id: append
title: "Дописать в конец: StandardOpenOption.APPEND"
hints:
  - "Режим дописывания передают после текста: `Files.writeString(diary, текст, StandardOpenOption.APPEND);`."
  - "Текст записи: `count + \") \" + entry + \"\\n\"` — перевод строки ставь сам."
  - "После цикла: `List<String> lines = Files.readAllLines(diary);`, печать каждой строки и `\"Записей: \" + (lines.size() - 1)`."
sampleInput: |
  проснулся
  выпил кофе
  написал код
quiz:
  question: Что делает StandardOpenOption.APPEND?
  options:
    - Пишет в конец файла, не стирая старое содержимое
    - Создаёт копию файла
    - Очищает файл
    - Открывает файл только для чтения
  correct: 0
  hint: Append — «добавить в конец».
exam:
  - q: Что будет, если записывать заголовок дневника тоже с APPEND?
    options:
      - При каждом запуске в файле будут копиться старые записи и заголовки
      - Ничего не изменится
      - Заголовок не запишется
      - Файл удалится
    correct: 0
    explain: APPEND никогда не стирает файл. Без перезаписи в начале дневник с прошлого запуска останется.
    advice: Первая запись перезаписывает, следующие дописывают.
  - q: Почему после каждой записи нужен "\n"?
    options:
      - writeString пишет ровно переданный текст и не добавляет перевод строки
      - Без него файл не сохранится
      - Так требует APPEND
      - Чтобы запись стала заглавной
    correct: 0
    explain: В отличие от println, writeString не добавляет ничего своего. Без "\n" записи слипнутся в одну строку.
    advice: Files.write со списком, наоборот, сам ставит переводы строк.
  - q: Какой режим добавить к APPEND, чтобы работать с файлом, которого ещё нет?
    options:
      - CREATE
      - TRUNCATE_EXISTING
      - READ
      - Никакой, APPEND создаёт файл сам
    correct: 0
    explain: Одно APPEND требует существующий файл. CREATE разрешает создать его при первой записи.
    advice: Для логов обычно пишут CREATE и APPEND вместе.
memory:
  note: Момент после чтения дневника.
  stack:
    - method: main(String[] args)
      vars:
        - Scanner sc → объект в куче
        - Path diary → адрес diary.txt
        - int count = 3
        - List<String> lines → список из файла
  heap:
    - obj: List<String>
      data: "=== Дневник ===, 1) проснулся, 2) выпил кофе, 3) написал код"
tests:
  - name: Дневник из примера
    stdin: |
      проснулся
      выпил кофе
      написал код
    stdout: |
      === Дневник ===
      1) проснулся
      2) выпил кофе
      3) написал код
      Записей: 3
  - name: Пустой день
    stdin: ""
    stdout: |
      === Дневник ===
      Записей: 0
  - kind: source
    name: Дописывание в конец
    pattern: 'StandardOpenOption\s*\.\s*APPEND'
    message: "Дописывай записи с StandardOpenOption.APPEND"
