id: append
title: "Дописать в конец: журнал в файле"
hints:
  - "Каждая запись — три шага: прочитать файл в список, добавить строку, записать список обратно."
  - "`List<String> current = new ArrayList<>(Files.readAllLines(diary)); current.add(count + \") \" + entry); Files.write(diary, current);`."
  - "После цикла: `List<String> lines = Files.readAllLines(diary);`, печать каждой строки и `\"Записей: \" + (lines.size() - 1)`."
sampleInput: |
  проснулся
  выпил кофе
  написал код
quiz:
  question: Что делает режим StandardOpenOption.APPEND в обычной Java?
  options:
    - Пишет в конец файла, не стирая старое содержимое
    - Создаёт копию файла
    - Очищает файл
    - Открывает файл только для чтения
  correct: 0
  hint: Append — «добавить в конец».
exam:
  - q: Что останется в файле, если в цикле писать Files.write(diary, List.of(новая запись))?
    options:
      - Только последняя запись — каждая запись стирает предыдущие
      - Все записи по порядку
      - Только заголовок
      - Файл окажется пустым
    correct: 0
    explain: Files.write по умолчанию перезаписывает файл. Без чтения старого содержимого история теряется.
    advice: Для дописывания либо режим APPEND, либо «прочитать, добавить, записать».
  - q: Почему список из readAllLines копируют в new ArrayList<>(...)?
    options:
      - Спецификация не обещает, что он изменяемый, а копия точно изменяемая
      - readAllLines возвращает массив
      - Иначе строки перепутаются
      - Так быстрее
    correct: 0
    explain: Документация readAllLines не гарантирует, что в список можно добавлять. Копия снимает вопрос.
    advice: Если нужно менять чужую коллекцию, работай с копией.
  - q: Когда способ «прочитать, добавить, записать» плох?
    options:
      - Для огромных файлов — каждый раз весь файл читается и пишется заново
      - Для файлов с русскими буквами
      - Когда записей больше трёх
      - Никогда
    correct: 0
    explain: Для лога на гигабайты каждая новая строка заставила бы переписывать гигабайты. Там нужен APPEND.
    advice: Маленький журнал — любой способ, большой — только дописывание в конец.
memory:
  note: Момент после третьей записи, перед чтением дневника.
  stack:
    - method: main(String[] args)
      vars:
        - Scanner sc → объект в куче
        - Path diary → адрес diary.txt
        - int count = 3
        - List<String> current → 4 строки
  heap:
    - obj: ArrayList (current)
      data: "=== Дневник ===, 1) проснулся, 2) выпил кофе, 3) написал код"
tests:
  - name: Дневник из примера
    stdin: |
      проснулся
      выпил кофе
      написал код
    stdout: |
      === Дневник ===
      1) проснулся
      2) выпил кофе
      3) написал код
      Записей: 3
  - name: Пустой день
    stdin: ""
    stdout: |
      === Дневник ===
      Записей: 0
  - kind: source
    name: Запись читает старое содержимое
    pattern: 'readAllLines\s*\([\s\S]*\.add\s*\([\s\S]*Files\s*\.\s*write\s*\('
    message: "В цикле прочитай файл, добавь строку и запиши список обратно"
