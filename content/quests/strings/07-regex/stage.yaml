id: regex
title: "Регулярные выражения: проверка по шаблону"
hints:
  - "Одна проверка — `login.matches(шаблон)`: `matches` сверяет всю строку целиком."
  - "Шаблон из двух частей: первая буква `[a-z]`, потом `[a-z0-9_]{2,15}`."
  - "`if (login.matches(\"[a-z][a-z0-9_]{2,15}\")) { ok++; ... }` — и две ветки печати."
sampleInput: |
  java_hero
  7up
  ab
  anna2008
  Vasya
  very_long_login_name_2
quiz:
  question: Что вернёт "abc".matches("[a-z]{2}")?
  options:
    - "false — шаблон описывает ровно две буквы, а в строке три"
    - "true — две буквы в строке есть"
    - Ошибку компиляции
    - "3"
  correct: 0
  hint: matches проверяет всю строку, а не кусок.
exam:
  - q: Как записать в Java шаблон «одна или больше цифр»?
    options:
      - "\"\\\\d+\""
      - "\"\\d+\""
      - "\"d+\""
      - "\"[digits]+\""
    correct: 0
    explain: В регулярном выражении цифра — \d. В строке Java обратную черту экранируют, поэтому пишут две.
    advice: Если компилятор пишет «Invalid escape sequence», удвой обратную черту.
  - q: Что вернёт "8-900-123".replaceAll("\\d", "#")?
    options:
      - "#-###-###"
      - "#"
      - "8-900-123"
      - "###"
    correct: 0
    explain: replaceAll заменяет каждое совпадение с шаблоном. Каждая цифра становится решёткой, дефисы остаются.
    advice: replaceAll с шаблоном удобен для маскировки и чистки текста.
  - q: Почему для логина длиной 3–16 после первой буквы стоит {2,15}?
    options:
      - Первая буква уже занимает один символ из общей длины
      - Так короче писать
      - Квантификатор считает с нуля
      - Иначе не пройдут цифры
    correct: 0
    explain: Шаблон состоит из двух частей. Первая часть — ровно один символ, поэтому на вторую остаётся от 2 до 15.
    advice: Считай длину всей строки как сумму длин частей шаблона.
memory:
  note: Момент после проверки последнего логина из примера.
  stack:
    - method: main(String[] args)
      vars:
        - Scanner sc → объект в куче
        - int ok = 2
        - int total = 6
        - String login → «very_long_login_name_2»
  heap:
    - obj: Scanner
      data: Ввод прочитан до конца.
tests:
  - name: Логины из примера
    stdin: |
      java_hero
      7up
      ab
      anna2008
      Vasya
      very_long_login_name_2
    stdout: |
      java_hero: OK
      7up: ошибка
      ab: ошибка
      anna2008: OK
      Vasya: ошибка
      very_long_login_name_2: ошибка
      Подходит: 2 из 6
  - name: Граница длины
    stdin: |
      abc
      a_______________
      a________________
    stdout: |
      abc: OK
      a_______________: OK
      a________________: ошибка
      Подходит: 2 из 3
  - kind: source
    name: Проверка через matches
    pattern: '\.matches\s*\('
    message: "Проверь логин методом matches"
