id: split-join
title: "split, trim и join: строка на части и обратно"
hints:
  - "`line.split(\";\")` уже дал массив кусков. Каждый кусок нужно обрезать: `names[i] = names[i].trim();`."
  - "В том же цикле ищи самое длинное: `if (names[i].length() > longest.length()) longest = names[i];`, начиная с `String longest = \"\";`."
  - "Список — одной строкой: `String.join(\", \", names)`."
sampleInput: |2
   Аня ; Борис;Вика ;  Гоша
quiz:
  question: Что вернёт "a;b;c".split(";").length?
  options:
    - "3"
    - "2"
    - "5"
    - "1"
  correct: 0
  hint: Две точки с запятой делят строку на три части.
exam:
  - q: Что вернёт " кот ".trim().length()?
    options:
      - "3"
      - "5"
      - "4"
      - "0"
    correct: 0
    explain: trim убирает пробелы по краям. Остаётся «кот» из трёх букв.
    advice: Данные из ввода почти всегда стоит обрезать через trim.
  - q: Почему "1.2.3".split(".") не делит строку по точкам?
    options:
      - Аргумент split — регулярное выражение, а точка в нём означает любой символ
      - Точка не может быть разделителем
      - split работает только с пробелами
      - Нужно писать splitDot
    correct: 0
    explain: В регулярном выражении «.» совпадает с каждым символом, поэтому все куски получаются пустыми. Чтобы искать саму точку, её экранируют — "\\.".
    advice: Разделители . | + * ? ( ) [ ] экранируй двумя обратными чертами.
  - q: Что вернёт String.join("-", "a", "b", "c")?
    options:
      - a-b-c
      - a-b-c-
      - -a-b-c
      - abc
    correct: 0
    explain: join ставит разделитель только между частями, поэтому по краям его нет.
    advice: join удобнее, чем цикл с проверкой «последний ли элемент».
memory:
  note: Момент после цикла обрезки для ввода из примера.
  stack:
    - method: main(String[] args)
      vars:
        - String line → строка в куче
        - String[] names → массив в куче
        - String longest → «Борис»
  heap:
    - obj: String[4]
      data: "Аня, Борис, Вика, Гоша"
tests:
  - name: Имена с пробелами
    stdin: |2
       Аня ; Борис;Вика ;  Гоша
    stdout: |
      Имён: 4
      Список: Аня, Борис, Вика, Гоша
      Самое длинное: Борис
  - name: Два имени одной длины
    stdin: |
      Ян;Ева
    stdout: |
      Имён: 2
      Список: Ян, Ева
      Самое длинное: Ева
  - kind: source
    name: Склейка через String.join
    pattern: 'String\s*\.\s*join\s*\('
    message: "Собери список через String.join(\", \", names)"
