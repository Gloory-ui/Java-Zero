id: format
title: "Форматирование: printf и String.format"
hints:
  - "`printf` подставляет значения по порядку вместо `%s`, `%d`, `%.2f`. Шаблон для строки чека уже дан в задании."
  - "`System.out.printf(\"%-8s %2d x %6.2f = %7.2f%n\", names[i], counts[i], prices[i], sum);` — четыре спецификатора, четыре значения."
  - "Итог: `System.out.printf(\"Итого: %.2f%n\", total);` — иначе напечатается «540.9» без второго нуля."
quiz:
  question: Что напечатает System.out.printf("%.2f", 3.14159)?
  options:
    - "3.14"
    - "3.14159"
    - "3.1"
    - "3"
  correct: 0
  hint: Число после точки в спецификаторе — сколько знаков после запятой оставить.
exam:
  - q: Чем String.format отличается от System.out.printf?
    options:
      - format возвращает готовую строку, а printf сразу печатает
      - format не поддерживает %d
      - printf работает только с дробными числами
      - Ничем, это одно и то же
    correct: 0
    explain: Шаблоны у них одинаковые. String.format нужен, когда строку надо сохранить, склеить или вернуть из метода.
    advice: Строка для отчёта или файла — String.format, вывод на экран — printf.
  - q: Что сделает спецификатор %-10s со строкой «кот»?
    options:
      - Дополнит её пробелами справа до 10 символов
      - Обрежет до 10 символов
      - Дополнит пробелами слева
      - Напечатает 10 раз
    correct: 0
    explain: Число — ширина поля, минус — выравнивание влево, то есть пробелы добавляются справа.
    advice: Без минуса выравнивание вправо — удобно для чисел в столбце.
  - q: Почему в конце шаблона printf пишут %n?
    options:
      - printf сам не переводит строку
      - Иначе число не выведется
      - Это обязательный конец любого шаблона
      - Чтобы вывести символ n
    correct: 0
    explain: В отличие от println, printf печатает ровно шаблон. Перевод строки нужно попросить явно.
    advice: "%n переводит строку так, как принято в системе, где запущена программа."
memory:
  note: Момент после строки чека для сыра.
  stack:
    - method: main(String[] args)
      vars:
        - String[] names → массив в куче
        - int[] counts → массив в куче
        - double[] prices → массив в куче
        - double total = 540.9
        - int i = 2
        - double sum = 360.0
  heap:
    - obj: String[3]
      data: "Хлеб, Молоко, Сыр"
    - obj: double[3]
      data: "45.5, 89.9, 120.0"
tests:
  - name: Чек
    match: tokens
    stdout: |
      Хлеб 2 x 45.50 = 91.00
      Молоко 1 x 89.90 = 89.90
      Сыр 3 x 120.00 = 360.00
      Итого: 540.90
  - kind: source
    name: Вывод через printf или String.format
    pattern: '(printf|String\.format)\s*\([^)]*%'
    message: "Печатай строки чека через System.out.printf с шаблоном"
