id: synchronized
title: "Гонка потоков и synchronized"
hints:
  - "Изменение счётчика защищает слово в заголовке метода: `synchronized void increment()`."
  - "Запись в журнал — блок на общем объекте: `synchronized (log) { log.add(id); }`."
  - "Все потоки запираются на один и тот же `log`. Новый объект-замок для каждой записи ничего не защитит."
quiz:
  question: Почему count++ из нескольких потоков может терять прибавления?
  options:
    - Это три шага — прочитать, прибавить, записать, и потоки могут перемешать их
    - ++ не работает в потоках
    - Потоки не видят поля объектов
    - Java запрещает менять int из потоков
  correct: 0
  hint: Два потока прочитали одно и то же значение.
exam:
  - q: Что делает synchronized у метода?
    options:
      - Пускает в метод объекта только один поток за раз
      - Запускает метод в новом потоке
      - Делает метод статическим
      - Ускоряет метод
    correct: 0
    explain: Поток, вошедший в synchronized-метод, держит замок объекта. Остальные ждут, пока он выйдет.
    advice: Синхронизируй все методы, которые меняют общие данные.
  - q: Почему synchronized (new Object()) не защищает список?
    options:
      - Каждый раз создаётся новый замок, и потоки не ждут друг друга
      - new внутри synchronized запрещён
      - Список нельзя защищать
      - Защищает, всё в порядке
    correct: 0
    explain: Замок работает, только если все потоки запираются на один и тот же объект.
    advice: Запирайся на сам общий объект или на отдельное final-поле.
  - q: Чем плох synchronized вокруг всего цикла на 10 000 шагов?
    options:
      - Потоки будут работать строго по очереди, и параллельность пропадёт
      - Счётчик станет неверным
      - Программа не скомпилируется
      - Ничем
    correct: 0
    explain: Пока один поток крутит весь цикл, остальные стоят у двери. Результат верный, но смысла в потоках нет.
    advice: Держи замок как можно меньше времени.
memory:
  note: Момент после ожидания всех четырёх потоков.
  stack:
    - method: main(String[] args)
      vars:
        - Counter counter → объект в куче
        - List<Integer> log → ArrayList в куче
        - List<Thread> threads → 4 завершённых потока
  heap:
    - obj: Counter
      data: count = 40000
    - obj: ArrayList<Integer> (log)
      data: 20 записей — номера потоков 1–4 по 5 раз
tests:
  - name: Счётчик и журнал
    stdout: |
      Счётчик: 40000
      Записей в журнале: 20
  - kind: source
    name: Синхронизированный метод
    pattern: 'synchronized\s+void\s+increment'
    message: "Сделай synchronized void increment()"
  - kind: source
    name: Синхронизированный блок
    pattern: 'synchronized\s*\(\s*log\s*\)'
    message: "Оберни запись в synchronized (log) { ... }"
