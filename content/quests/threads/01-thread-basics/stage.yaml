id: thread-basics
title: "Поток: Thread, start и join"
hints:
  - "Второй поток — такой же цикл, как у первого, только от `50_001` до `100_000` и в `results[1]`."
  - "Запуск: `first.start(); second.start();` — оба потока работают одновременно."
  - "Ожидание: `first.join(); second.join();` — и только потом печать."
quiz:
  question: Что делает метод join()?
  options:
    - Ждёт, пока поток закончит работу
    - Запускает поток
    - Объединяет два потока в один
    - Останавливает поток немедленно
  correct: 0
  hint: Join — «присоединиться», дождаться у финиша.
exam:
  - q: Что будет, если вызвать worker.run() вместо worker.start()?
    options:
      - Задача выполнится в текущем потоке, без параллельности
      - Поток запустится так же
      - Ошибка компиляции
      - Задача не выполнится
    correct: 0
    explain: run() — обычный метод с кодом задачи. Новый поток создаёт только start().
    advice: Для параллельной работы — всегда start().
  - q: Почему без join() программа может напечатать нули?
    options:
      - main идёт дальше, не дожидаясь, пока потоки посчитают
      - Потоки обнуляют массив
      - join() заполняет массив
      - Нули печатаются всегда
    correct: 0
    explain: После start() потоки и main работают независимо. Печать может случиться раньше, чем циклы в потоках закончатся.
    advice: Результат потока читай только после join().
  - q: Почему сумма хранится в long?
    options:
      - Итог 5 000 050 000 не помещается в int
      - Потоки работают только с long
      - long быстрее int
      - Так требует join
    correct: 0
    explain: Максимум int — около 2,1 миллиарда. Итог больше и в int переполнился бы.
    advice: Прикидывай размер результата до выбора типа.
memory:
  note: Момент после обоих join().
  stack:
    - method: main(String[] args)
      vars:
        - long[] results → массив в куче
        - Thread first → завершён
        - Thread second → завершён
  heap:
    - obj: long[2]
      data: "1250025000, 3750025000"
tests:
  - name: Сумма в два потока
    stdout: |
      Первая половина: 1250025000
      Вторая половина: 3750025000
      Всего: 5000050000
  - kind: source
    name: Потоки запущены
    pattern: 'second\s*\.\s*start\s*\(\s*\)'
    message: "Запусти потоки через start()"
  - kind: source
    name: Ожидание через join
    pattern: '\.join\s*\(\s*\)'
    message: "Дождись потоков через join()"
