id: insertion-sort
title: Сортировка вставками
hints:
  - "Цикл с `i = 1`: запомни `int key = a[i];` и начни с `int j = i - 1;`."
  - "Сдвиги: `while (j >= 0 && a[j] > key) { a[j + 1] = a[j]; j--; shifts++; }`."
  - "После `while`: `a[j + 1] = key;` и печать `\"Вставлен \" + key + \": \" + Arrays.toString(a)`."
sampleInput: |
  12 11 13 5 6
quiz:
  question: На каких данных сортировка вставками работает быстрее всего?
  options:
    - На почти отсортированных
    - На отсортированных по убыванию
    - На случайных
    - Скорость всегда одинаковая
  correct: 0
  hint: Если карты уже почти по порядку, вставлять почти некуда.
exam:
  - q: Почему в while сначала проверяют j >= 0, а потом a[j] > key?
    options:
      - При j = -1 вторая проверка обратилась бы к a[-1]
      - Так быстрее
      - Порядок не важен
      - Иначе key потеряется
    correct: 0
    explain: && вычисляет правую часть, только если левая истинна. Когда j стало −1, до a[j] дело не дойдёт.
    advice: Проверку границы ставь первой — это частый приём.
  - q: Зачем сохранять key = a[i] до цикла?
    options:
      - Первый сдвиг запишет в a[i] другое значение
      - Иначе цикл не начнётся
      - Так требует Arrays
      - Чтобы посчитать сдвиги
    correct: 0
    explain: Сдвиг a[j + 1] = a[j] при j = i − 1 перезапишет a[i]. Без копии вставлять будет нечего.
    advice: Перед перезаписью ячейки сохрани то, что в ней лежит.
  - q: Сколько сдвигов нужно для уже отсортированного массива?
    options:
      - Ни одного
      - n
      - n²
      - По одному на элемент
    correct: 0
    explain: Для каждого key условие a[j] > key сразу ложно, и while не выполняется ни разу.
    advice: Поэтому вставками досортировывают почти готовые данные.
memory:
  note: Момент перед вставкой 5 — сдвиги закончились.
  stack:
    - method: main(String[] args)
      vars:
        - int[] a → массив в куче
        - int i = 3
        - int key = 5
        - int j = -1
        - int shifts = 4
  heap:
    - obj: int[5]
      data: "11, 11, 12, 13, 6 — ячейка 0 ждёт key"
tests:
  - name: Числа из примера
    stdin: |
      12 11 13 5 6
    stdout: |
      Вставлен 11: [11, 12, 13, 5, 6]
      Вставлен 13: [11, 12, 13, 5, 6]
      Вставлен 5: [5, 11, 12, 13, 6]
      Вставлен 6: [5, 6, 11, 12, 13]
      Сдвигов: 7
  - name: Уже отсортировано
    stdin: |
      1 2 3
    stdout: |
      Вставлен 2: [1, 2, 3]
      Вставлен 3: [1, 2, 3]
      Сдвигов: 0
