id: complexity
title: "Сложность алгоритмов: O(n), O(log n), O(n²)"
hints:
  - "`linearSteps` просто возвращает `n`: в худшем случае перебор проверит каждый элемент."
  - "`binarySteps`: цикл `while (n > 0) { steps++; n /= 2; }`."
  - "`pairSteps`: `return (long) n * (n - 1) / 2;` — приведение к `long` до умножения."
quiz:
  question: Во сколько раз вырастет время O(n²)-алгоритма, если данных станет вдвое больше?
  options:
    - Примерно в 4 раза
    - В 2 раза
    - Не изменится
    - На один шаг
  correct: 0
  hint: (2n)² = 4n².
exam:
  - q: Почему (long) n * (n - 1) работает, а (long) (n * (n - 1)) — нет?
    options:
      - Во втором случае умножение уже переполнилось в int до приведения
      - Это одно и то же
      - long нельзя умножать
      - Скобки запрещены
    correct: 0
    explain: Приведение применяется к n, и дальше умножение идёт в long. Во втором варианте сначала считается int-произведение, оно переполняется, и только потом испорченное число превращается в long.
    advice: Приводи к long первый множитель, а не результат.
  - q: Какая оценка у бинарного поиска?
    options:
      - O(log n)
      - O(n)
      - O(n²)
      - O(1)
    correct: 0
    explain: Каждый шаг делит отрезок пополам. Число шагов — логарифм n по основанию 2.
    advice: Удвоение данных добавляет всего один шаг.
  - q: Почему O(3n + 5) записывают как O(n)?
    options:
      - O большое показывает, как растёт время, а константы на рост не влияют
      - Это ошибка округления
      - 3 и 5 слишком маленькие
      - Так короче писать
    correct: 0
    explain: При росте n главным остаётся слагаемое n, а множители и константы не меняют характер роста.
    advice: Сравнивай алгоритмы по характеру роста, а точное время меряй на деле.
memory:
  note: Момент вызова binarySteps(1024) после трёх делений.
  stack:
    - method: binarySteps(int n)
      vars:
        - int n = 128
        - long steps = 3
    - method: main(String[] args)
      vars:
        - int[] sizes → массив в куче
  heap:
    - obj: int[3]
      data: "8, 1024, 1000000"
tests:
  - name: Три размера
    stdout: |
      n = 8: линейно 8, бинарно 4, пары 28
      n = 1024: линейно 1024, бинарно 11, пары 523776
      n = 1000000: линейно 1000000, бинарно 20, пары 499999500000
  - kind: source
    name: Приведение к long до умножения
    pattern: '\(\s*long\s*\)\s*n\s*\*'
    message: "Считай пары как (long) n * (n - 1) / 2"
