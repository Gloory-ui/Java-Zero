id: stack-brackets
title: "Свой стек: проверка скобок"
hints:
  - "Стек: `push` — `data[size++] = c;` с расширением через `Arrays.copyOf`, `pop` — `return data[--size];`."
  - "В `check` цикл по символам: открывающую (`\"([{\".indexOf(c) >= 0`) кладём, на закрывающую проверяем пару."
  - "Ошибка: `if (stack.isEmpty() || \"([{\".indexOf(stack.pop()) != \")]}\".indexOf(c)) return \"ошибка в позиции \" + (i + 1);`. В конце — `OK` или `\"не закрыто \" + stack.size()`."
sampleInput: |
  (a[b]{c})
  ([)]
  {[()()]}
  ((x)
  )(
quiz:
  question: Какую скобку снимет pop() после push('('), push('[')?
  options:
    - "["
    - "("
    - Обе
    - Никакую
  correct: 0
  hint: Последним положили — первым сняли.
exam:
  - q: Почему для проверки скобок подходит именно стек?
    options:
      - Закрываться должна последняя открытая скобка — это порядок стека
      - Стек сортирует скобки
      - В стеке нет индексов
      - Так быстрее, чем со строкой
    correct: 0
    explain: В «{[()]}» первой закрывается «(», открытая последней. Стек как раз отдаёт последний положенный элемент.
    advice: Вложенные структуры — скобки, вызовы методов, теги HTML — проверяют стеком.
  - q: Что нужно проверить перед pop на закрывающей скобке?
    options:
      - Что стек не пуст
      - Что строка кончилась
      - Что скобка круглая
      - Ничего
    correct: 0
    explain: Закрывающая скобка без открытой — сама по себе ошибка. Без проверки pop обратился бы к ячейке −1.
    advice: Перед снятием со стека всегда проверяй isEmpty().
  - q: Что показывает непустой стек после обхода строки?
    options:
      - Сколько скобок открыто и не закрыто
      - Сколько было ошибок
      - Длину строки
      - Что строка правильная
    correct: 0
    explain: Каждая закрытая пара убирает скобку из стека. Всё, что осталось, так и не закрылось.
    advice: Итоговая проверка стека так же важна, как проверка в цикле.
memory:
  note: Момент ошибки в строке «([)]» на позиции 3.
  stack:
    - method: check(String s)
      vars:
        - String s → «([)]»
        - CharStack stack → объект в куче
        - int i = 2
        - char c = ')'
    - method: main(String[] args)
      vars:
        - String line → «([)]»
  heap:
    - obj: CharStack
      data: "size = 1, внизу «(» — «[» только что снята"
tests:
  - name: Строки из примера
    stdin: |
      (a[b]{c})
      ([)]
      {[()()]}
      ((x)
      )(
    stdout: |
      (a[b]{c}): OK
      ([)]: ошибка в позиции 3
      {[()()]}: OK
      ((x): не закрыто 1
      )(: ошибка в позиции 1
  - name: Длинная вложенность
    stdin: |
      (((((((((((((((((((())))))))))))))))))))
      [[[
    stdout: |
      (((((((((((((((((((()))))))))))))))))))): OK
      [[[: не закрыто 3
  - kind: source
    name: Свой стек
    pattern: 'data\s*\[\s*size\s*\+\+\s*\]|data\s*\[\s*--\s*size\s*\]'
    message: "Напиши стек на массиве: data[size++] = c и data[--size]"
