id: merge-sort
title: Сортировка слиянием
hints:
  - "В `mergeSort` половины — `Arrays.copyOfRange(a, 0, mid)` и `Arrays.copyOfRange(a, mid, a.length)`, каждую отсортируй вызовом `mergeSort`."
  - "В `merge` три индекса `i`, `j`, `k`. Пока обе половины не кончились, бери меньшую голову: `out[k++] = left[i] <= right[j] ? left[i++] : right[j++];`."
  - "После основного цикла допиши остатки: `while (i < left.length) out[k++] = left[i++];` и так же для `right`."
sampleInput: |
  38 27 43 3
quiz:
  question: Какая оценка времени у сортировки слиянием?
  options:
    - O(n log n)
    - O(n²)
    - O(n)
    - O(log n)
  correct: 0
  hint: log n уровней деления, на каждом — n элементов слияния.
exam:
  - q: Что будет без строки if (a.length <= 1) return a;?
    options:
      - Бесконечная рекурсия и StackOverflowError
      - Массив не отсортируется, но программа закончится
      - Ничего не изменится
      - Ошибка компиляции
    correct: 0
    explain: Массив из одного элемента тоже поделится на половины длиной 0 и 1, и так без конца. Каждый вызов занимает место в стеке, пока оно не кончится.
    advice: У каждой рекурсии первым делом пиши базу — когда остановиться.
  - q: Зачем после основного цикла merge нужны ещё два цикла?
    options:
      - Дописать элементы, оставшиеся в одной из половин
      - Проверить сортировку
      - Удалить повторы
      - Напечатать результат
    correct: 0
    explain: Основной цикл кончается, когда исчерпана одна половина. В другой ещё могут остаться элементы — и все они больше уже слитых.
    advice: Выполнится только один из двух дописывающих циклов, второй будет пустым.
  - q: Чем слияние хуже пузырька?
    options:
      - Нужна дополнительная память под копии половин
      - Оно медленнее на больших массивах
      - Оно не работает с отрицательными числами
      - Ничем
    correct: 0
    explain: Слияние создаёт новые массивы на каждом уровне. Пузырёк сортирует на месте без лишней памяти.
    advice: Быстрота по времени часто оплачивается памятью.
memory:
  note: Момент последнего слияния для ввода из примера.
  stack:
    - method: merge(int[] left, int[] right)
      vars:
        - int[] left → [27, 38]
        - int[] right → [3, 43]
        - int[] out → новый массив из 4 ячеек
    - method: mergeSort(int[] a)
      vars:
        - int[] a → [38, 27, 43, 3]
        - int mid = 2
    - method: main(String[] args)
      vars:
        - int[] a → массив в куче
  heap:
    - obj: int[4] (out)
      data: "3, 27, 38, 43 после слияния"
tests:
  - name: Четыре числа
    stdin: |
      38 27 43 3
    stdout: |
      Слияние [38] + [27] → [27, 38]
      Слияние [43] + [3] → [3, 43]
      Слияние [27, 38] + [3, 43] → [3, 27, 38, 43]
      Итог: [3, 27, 38, 43]
  - name: Пять чисел
    stdin: |
      5 2 4 7 1
    stdout: |
      Слияние [5] + [2] → [2, 5]
      Слияние [7] + [1] → [1, 7]
      Слияние [4] + [1, 7] → [1, 4, 7]
      Слияние [2, 5] + [1, 4, 7] → [1, 2, 4, 5, 7]
      Итог: [1, 2, 4, 5, 7]
