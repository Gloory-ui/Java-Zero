id: binary-search
title: Бинарный поиск
hints:
  - "Замени перебор на отрезок `int lo = 0, hi = a.length - 1;` и цикл `while (lo <= hi)`."
  - "В цикле: `steps++;`, середина `int mid = lo + (hi - lo) / 2;`, три ветки — нашли, правее, левее."
  - "Правее — `lo = mid + 1;`, левее — `hi = mid - 1;`. После цикла `return -1;`."
sampleInput: |
  42 3 104 50
quiz:
  question: Сколько шагов бинарного поиска хватит для массива из 1000 элементов?
  options:
    - Около 10
    - Около 500
    - "1000"
    - "2"
  correct: 0
  hint: Каждый шаг делит отрезок пополам, а 2¹⁰ = 1024.
exam:
  - q: Почему бинарный поиск работает только на отсортированном массиве?
    options:
      - Иначе нельзя понять, в какой половине искать, и отбрасывать половину нельзя
      - Он сортирует массив сам
      - Отсортированный массив меньше
      - Работает на любом
    correct: 0
    explain: Решение «искомое правее, потому что a[mid] меньше» верно только при упорядоченных данных.
    advice: Если искать нужно много раз, выгодно один раз отсортировать и потом искать бинарно.
  - q: Почему условие цикла lo <= hi, а не lo < hi?
    options:
      - При lo == hi в отрезке остаётся один элемент, и его тоже нужно проверить
      - Так быстрее
      - Иначе будет бесконечный цикл
      - Разницы нет
    correct: 0
    explain: С lo < hi последний кандидат не проверится, и поиск по краям массива иногда будет промахиваться.
    advice: Проверяй границы на массиве из одного элемента.
  - q: Зачем писать mid = lo + (hi - lo) / 2 вместо (lo + hi) / 2?
    options:
      - Сумма lo + hi может переполнить int на огромных массивах
      - Так точнее для дробей
      - Это другой алгоритм
      - Так требует Java 17
    correct: 0
    explain: Для индексов около двух миллиардов lo + hi выйдет за пределы int и станет отрицательным.
    advice: На маленьких массивах разницы нет, но привычка полезная.
memory:
  note: Момент, когда поиск 104 проверяет середину в третий раз.
  stack:
    - method: search(int[] a, int target)
      vars:
        - int target = 104
        - int lo = 8
        - int hi = 9
        - int mid = 8
    - method: main(String[] args)
      vars:
        - int[] a → массив в куче
  heap:
    - obj: int[10]
      data: "3, 8, 15, 23, 42, 57, 61, 78, 90, 104"
tests:
  - name: Поиск из примера
    stdin: |
      42 3 104 50
    stdout: |
      42: индекс 4, шагов 1
      3: индекс 0, шагов 3
      104: индекс 9, шагов 4
      50: не найден, шагов 3
  - name: Меньше минимума и больше максимума
    stdin: |
      1 200
    stdout: |
      1: не найден, шагов 3
      200: не найден, шагов 4
  - kind: source
    name: Отрезок сужается
    pattern: 'lo\s*=\s*mid\s*\+\s*1|hi\s*=\s*mid\s*-\s*1'
    message: "Сужай отрезок: lo = mid + 1 или hi = mid - 1"
