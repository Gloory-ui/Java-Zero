id: quick-sort
title: Быстрая сортировка
hints:
  - "Граница зоны меньших: `int i = lo - 1;`, потом цикл `for (int j = lo; j < hi; j++)`."
  - "Если `a[j] < pivot`, то `i++; swap(i, j);` — меньший уходит в левую зону."
  - "После цикла опора встаёт на место: `swap(i + 1, hi);`, печать и `return i + 1;`."
sampleInput: |
  4 9 2 7 5
quiz:
  question: Где стоит опора после разбиения?
  options:
    - На своём окончательном месте в отсортированном массиве
    - В начале массива
    - В конце массива
    - Где угодно
  correct: 0
  hint: Слева все меньше, справа все не меньше.
exam:
  - q: Когда быстрая сортировка работает за O(n²)?
    options:
      - Когда опора всё время оказывается крайней, например на уже отсортированном массиве с опорой в конце
      - Всегда
      - На случайных данных
      - Никогда
    correct: 0
    explain: Если опора — максимум, разбиение отрезает всего один элемент. Уровней рекурсии становится n вместо log n.
    advice: На практике опору берут случайно или как медиану трёх элементов.
  - q: Чем быстрая сортировка удобнее слияния?
    options:
      - Сортирует на месте, без копий массива
      - Всегда быстрее в худшем случае
      - Не использует рекурсию
      - Устойчивая
    correct: 0
    explain: Разбиение переставляет элементы внутри того же массива. Слиянию нужны дополнительные массивы.
    advice: Быстрая сортировка неустойчивая — равные элементы могут поменяться местами.
  - q: Почему рекурсия идёт на отрезки lo..p−1 и p+1..hi, а не lo..p?
    options:
      - Опора уже на своём месте, её не нужно сортировать снова
      - Так короче
      - Иначе выход за массив
      - p — это последний элемент
    correct: 0
    explain: Опора не сдвинется, поэтому отрезки справа и слева её не включают. Если включить, отрезок может не уменьшаться и рекурсия зациклится.
    advice: Каждый рекурсивный вызов должен работать с отрезком строго меньше.
memory:
  note: Момент после первого разбиения для ввода из примера.
  stack:
    - method: quickSort(int lo, int hi)
      vars:
        - int lo = 0
        - int hi = 4
        - int p = 2
    - method: main(String[] args)
      vars:
        - вызвал quickSort(0, 4)
  heap:
    - obj: int[5] (a)
      data: "4, 2, 5, 7, 9 — опора 5 на месте 2"
tests:
  - name: Пять чисел
    stdin: |
      4 9 2 7 5
    stdout: |
      Опора 5: [4, 2, 5, 7, 9]
      Опора 2: [2, 4, 5, 7, 9]
      Опора 9: [2, 4, 5, 7, 9]
      Итог: [2, 4, 5, 7, 9]
  - name: Три числа
    stdin: |
      3 1 2
    stdout: |
      Опора 2: [1, 2, 3]
      Итог: [1, 2, 3]
