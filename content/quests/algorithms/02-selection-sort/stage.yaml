id: selection-sort
title: Сортировка выбором
hints:
  - "На шаге `i` заведи `int min = i;` и внутренним циклом с `j = i + 1` найди индекс самого маленького."
  - "После поиска — один обмен: `int tmp = a[i]; a[i] = a[min]; a[min] = tmp;`."
  - "Печать: `\"Шаг \" + (i + 1) + \": минимум \" + a[i] + \" → \" + Arrays.toString(a)`."
sampleInput: |
  64 25 12 22 11
quiz:
  question: Сколько обменов делает сортировка выбором за один шаг?
  options:
    - Не больше одного
    - Столько же, сколько сравнений
    - Ни одного
    - Два
  correct: 0
  hint: Сначала ищем, потом ставим.
exam:
  - q: Почему в сортировке выбором запоминают индекс минимума, а не его значение?
    options:
      - Индекс нужен, чтобы обменять минимум с позицией i
      - Значение нельзя сравнивать
      - Так требует Arrays.toString
      - Индекс занимает меньше памяти
    correct: 0
    explain: Зная только значение, не понять, в какой ячейке оно лежит. Индекс даёт и значение, и место.
    advice: В поиске экстремумов для перестановок всегда храни индекс.
  - q: Чем сортировка выбором лучше пузырька?
    options:
      - Делает намного меньше обменов
      - Делает меньше сравнений в худшем случае
      - Работает за O(n log n)
      - Не требует циклов
    correct: 0
    explain: Сравнений у обеих около n² / 2, но выбор меняет элементы не больше n раз.
    advice: Считай отдельно сравнения и перемещения — они стоят по-разному.
  - q: Почему внешний цикл идёт до a.length - 1?
    options:
      - Когда все элементы, кроме последнего, на местах, последний тоже на месте
      - Иначе выйдем за массив
      - Последний элемент всегда максимальный с самого начала
      - Это ошибка, нужно до a.length
    correct: 0
    explain: После n − 1 шагов на последнем месте остаётся единственный элемент — самый большой.
    advice: Проход до a.length тоже работал бы, но сделал бы лишний пустой шаг.
memory:
  note: Момент после шага 2 для ввода из примера.
  stack:
    - method: main(String[] args)
      vars:
        - int[] a → массив в куче
        - int i = 1
        - int min = 2
  heap:
    - obj: int[5]
      data: "11, 12, 25, 22, 64"
tests:
  - name: Числа из примера
    stdin: |
      64 25 12 22 11
    stdout: |
      Шаг 1: минимум 11 → [11, 25, 12, 22, 64]
      Шаг 2: минимум 12 → [11, 12, 25, 22, 64]
      Шаг 3: минимум 22 → [11, 12, 22, 25, 64]
      Шаг 4: минимум 25 → [11, 12, 22, 25, 64]
  - name: Три числа
    stdin: |
      3 1 2
    stdout: |
      Шаг 1: минимум 1 → [1, 3, 2]
      Шаг 2: минимум 2 → [1, 2, 3]
