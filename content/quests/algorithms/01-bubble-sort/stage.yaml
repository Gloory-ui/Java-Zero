id: bubble-sort
title: Сортировка пузырьком
hints:
  - "Два цикла: внешний — проходы `i`, внутренний — соседи `j` до `a.length - 1 - i`."
  - "Обмен соседей через `tmp`, счётчик `swaps++` и флаг `swapped = true`."
  - "После внутреннего цикла: печать `\"Проход \" + (i + 1) + \": \" + Arrays.toString(a)`, потом `if (!swapped) break;`."
sampleInput: |
  5 1 4 2 8
quiz:
  question: Где окажется самый большой элемент после первого прохода пузырька?
  options:
    - В конце массива
    - В начале массива
    - В середине
    - Там же, где был
  correct: 0
  hint: Пузырёк всплывает наверх.
exam:
  - q: Зачем внутренний цикл идёт до a.length - 1 - i, а не до a.length - 1?
    options:
      - Последние i элементов уже отсортированы, сравнивать их незачем
      - Иначе выйдем за массив
      - Так требует Java
      - Чтобы пропустить первый элемент
    correct: 0
    explain: После каждого прохода очередной максимум встаёт на своё место в конце. Проверять его снова — лишняя работа.
    advice: Это не меняет результат, но экономит сравнения.
  - q: Что даёт флаг swapped?
    options:
      - Останавливает сортировку, если за проход не было обменов
      - Считает обмены
      - Меняет элементы местами
      - Сортирует по убыванию
    correct: 0
    explain: Проход без обменов означает, что все соседи уже по порядку, то есть массив отсортирован.
    advice: Для уже отсортированного массива пузырёк с флагом делает всего один проход.
  - q: Сколько сравнений делает пузырёк в худшем случае для n элементов?
    options:
      - Около n² / 2
      - n
      - log n
      - "2n"
    correct: 0
    explain: Проходов почти n, в каждом до n сравнений. Сумма (n−1) + (n−2) + … + 1 = n(n−1)/2.
    advice: Для больших массивов пузырёк медленный — позже будут алгоритмы быстрее.
memory:
  note: Момент после второго прохода для ввода из примера.
  stack:
    - method: main(String[] args)
      vars:
        - int[] a → массив в куче
        - int swaps = 4
        - int i = 1
        - boolean swapped = true
  heap:
    - obj: int[5]
      data: "1, 2, 4, 5, 8"
tests:
  - name: Числа из примера
    stdin: |
      5 1 4 2 8
    stdout: |
      Проход 1: [1, 4, 2, 5, 8]
      Проход 2: [1, 2, 4, 5, 8]
      Проход 3: [1, 2, 4, 5, 8]
      Обменов: 4
  - name: Уже отсортировано
    stdin: |
      1 2 3
    stdout: |
      Проход 1: [1, 2, 3]
      Обменов: 0
  - name: По убыванию
    stdin: |
      3 2 1
    stdout: |
      Проход 1: [2, 1, 3]
      Проход 2: [1, 2, 3]
      Обменов: 3
