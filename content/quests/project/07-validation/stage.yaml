id: validation
title: "Проверка данных: запись и меню"
hints:
  - "В `Book` компактный конструктор без скобок: `Book { if (year < 1450 || year > 2026) throw new IllegalArgumentException(\"Год вне диапазона: \" + year); }`."
  - "В `add` первой строкой: `if (books.containsKey(book.id())) throw new IllegalArgumentException(\"Номер \" + book.id() + \" уже занят\");`."
  - "`addBook`: `String[] cells = arg.split(\";\");`, при `cells.length != 4` — подсказка формата; в `try` создай книгу из обрезанных частей и `Integer.parseInt(yearText)`, в `catch (NumberFormatException e)` — сообщение про год."
sampleInput: |
  add B5;Идиот;Достоевский;1869
  add B6;Будущее;Некто;3000
  add B7;Без года;Автор;давно
  add B1;Дубль;Кто-то;2000
  add сломано
  list
  exit
quiz:
  question: Где лучше проверять, что год книги возможен?
  options:
    - В конструкторе записи — тогда плохую книгу не создать ни откуда
    - Только в меню
    - Только при сохранении в файл
    - Нигде, пусть пользователь следит сам
  correct: 0
  hint: Книги создаются не только из меню, но и из файла.
exam:
  - q: Почему NumberFormatException ловят в addBook, а не оставляют общему catch меню?
    options:
      - Это наследник IllegalArgumentException, и общий catch напечатал бы невнятное «For input string»
      - Общий catch его не поймает
      - Иначе программа упадёт
      - Так быстрее
    correct: 0
    explain: Общий catch поймал бы ошибку разбора, но сообщение у неё техническое. Рядом с разбором понятно, что именно не так.
    advice: Переводи технические ошибки в понятные там, где знаешь их смысл.
  - q: Что будет при загрузке файла с книгой 3000 года после этого этапа?
    options:
      - "Конструктор записи бросит IllegalArgumentException, и меню напишет «Ошибка: Год вне диапазона»"
      - Книга загрузится
      - Файл удалится
      - Программа зависнет
    correct: 0
    explain: load создаёт книги через тот же конструктор. Проверка в записи защищает все пути создания.
    advice: Правила данных держи рядом с данными.
  - q: Зачем обрезать части строки через trim()?
    options:
      - «B6 ; Сказки» иначе даст номер с пробелом и год, который не разберётся
      - trim сортирует части
      - split без trim не работает
      - Чтобы строка стала короче
    correct: 0
    explain: Люди ставят пробелы вокруг разделителей. Без trim « 1831» не превратится в число.
    advice: Всё, что пришло от человека, нормализуй до проверок.
memory:
  note: Момент разбора строки «B7;Без года;Автор;давно».
  stack:
    - method: addBook(Library lib, String arg)
      vars:
        - String[] cells → [B7, Без года, Автор, давно]
        - String yearText → «давно»
        - NumberFormatException e → объект в куче
    - method: run(Library lib, Scanner sc)
      vars:
        - String cmd → «add»
  heap:
    - obj: Library
      data: 5 книг — B5 уже добавлена
tests:
  - name: Добавление из примера
    stdin: |
      add B5;Идиот;Достоевский;1869
      add B6;Будущее;Некто;3000
      add B7;Без года;Автор;давно
      add B1;Дубль;Кто-то;2000
      add сломано
      list
      exit
    stdout: |
      Добавлена: B5 | Идиот | Достоевский | 1869
      Ошибка: Год вне диапазона: 3000
      Ошибка: Год должен быть числом: давно
      Ошибка: Номер B1 уже занят
      Формат: add номер;название;автор;год
      B1 | Мастер и Маргарита | Булгаков | 1967
      B2 | Война и мир | Толстой | 1869
      B3 | Собачье сердце | Булгаков | 1925
      B4 | Преступление и наказание | Достоевский | 1866
      B5 | Идиот | Достоевский | 1869
      До встречи!
  - name: Пробелы и граница годов
    stdin: |
      add B6 ; Сказки ; Пушкин ; 1831
      add B0;Инкунабула;Гутенберг;1449
    stdout: |
      Добавлена: B6 | Сказки | Пушкин | 1831
      Ошибка: Год вне диапазона: 1449
  - kind: source
    name: Проверка года в записи
    pattern: 'Book\s*\{\s*if\s*\('
    message: "Проверь год в компактном конструкторе: Book { if (...) throw ... }"
