id: report
title: "Финал: отчёт библиотеки"
hints:
  - "Отчёт — список строк: `lines.add(\"=== Отчёт ===\");`, потом `books.size()`, `borrowedBy.size()` и их разность."
  - "Частый автор — цикл по `countByAuthor().entrySet()` со строгим `>`. Читатели: `readers.computeIfAbsent(e.getValue(), r -> new ArrayList<>()).add(books.get(e.getKey()).title());`."
  - "В меню: `case \"help\" -> System.out.println(\"Команды: list, find, borrow, return, sort, stats, add, save, load, clear, report, help, exit\");`."
sampleInput: |
  help
  add B5;Идиот;Достоевский;1869
  borrow B2 Аня
  borrow B3 Вика
  borrow B5 Вика
  report
  exit
quiz:
  question: Что делает map.computeIfAbsent(key, k -> new ArrayList<>())?
  options:
    - Возвращает значение по ключу, а если его нет — создаёт, кладёт и возвращает новое
    - Всегда создаёт новый список
    - Удаляет ключ
    - Возвращает null для нового ключа
  correct: 0
  hint: If absent — «если отсутствует».
exam:
  - q: Почему отчёт строится списком строк, а не печатается сразу?
    options:
      - Один и тот же список можно и напечатать, и записать в файл
      - println не работает в Library
      - Так быстрее
      - Список нельзя напечатать
    correct: 0
    explain: Library не знает, куда пойдёт отчёт. Она отдаёт данные, а меню решает — экран, файл или оба.
    advice: Отделяй подготовку данных от вывода — это та же идея, что слои Book, Library и LibraryApp.
  - q: Почему при равенстве книг у Булгакова и Достоевского выбран Булгаков?
    options:
      - Авторы идут по алфавиту, а строгий > не заменяет равного
      - У Булгакова книги старше
      - Так решает TreeMap случайно
      - Достоевский не считается
    correct: 0
    explain: countByAuthor возвращает TreeMap, Булгаков в нём раньше. С >= победил бы последний из равных.
    advice: Правило при ничьей стоит решить заранее и проверить тестом.
  - q: Что показывает этот финальный проект?
    options:
      - Как классы, коллекции, исключения, потоки данных и файлы складываются в одну программу
      - Что Java подходит только для библиотек
      - Что меню можно писать без switch
      - Ничего нового
    correct: 0
    explain: Запись хранит данные, класс держит правила, меню разговаривает с человеком, файлы сохраняют состояние. Так устроены и большие программы.
    advice: Попробуй сам добавить команду — например, поиск по году или список должников.
memory:
  note: Момент построения отчёта после трёх выдач.
  stack:
    - method: Library.report()
      vars:
        - List<String> lines → 5 строк
        - String topAuthor → «Булгаков»
        - Map<String, List<String>> readers → TreeMap
    - method: report(Library lib)
      vars:
        - вызвал lib.report()
  heap:
    - obj: TreeMap (readers)
      data: "{Аня=[Война и мир], Вика=[Собачье сердце, Идиот]}"
tests:
  - name: Финальная сессия
    stdin: |
      help
      add B5;Идиот;Достоевский;1869
      borrow B2 Аня
      borrow B3 Вика
      borrow B5 Вика
      report
      exit
    stdout: |
      Команды: list, find, borrow, return, sort, stats, add, save, load, clear, report, help, exit
      Добавлена: B5 | Идиот | Достоевский | 1869
      B2 выдана: Аня
      B3 выдана: Вика
      B5 выдана: Вика
      === Отчёт ===
      Всего книг: 5
      Выдано: 3
      В наличии: 2
      Самый частый автор: Булгаков
      Читатели: {Аня=[Война и мир], Вика=[Собачье сердце, Идиот]}
      Отчёт сохранён в report.txt
      До встречи!
  - name: Отчёт без выдач
    stdin: |
      report
    stdout: |
      === Отчёт ===
      Всего книг: 4
      Выдано: 0
      В наличии: 4
      Самый частый автор: Булгаков
      Читатели: {}
      Отчёт сохранён в report.txt
  - kind: source
    name: Список читателя создаётся сам
    pattern: 'computeIfAbsent\s*\('
    message: "Группируй книги по читателям через computeIfAbsent"
