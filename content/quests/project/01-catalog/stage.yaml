id: catalog
title: "Каталог: запись Book и класс Library"
hints:
  - "`line()` склеивает компоненты записи через « | »: `id + \" | \" + title + ...`."
  - "Каталог — словарь по номеру: `books.put(book.id(), book);`."
  - "Копия книг в порядке добавления: `return new ArrayList<>(books.values());`."
quiz:
  question: Почему каталог хранится в LinkedHashMap, а не в HashMap?
  options:
    - LinkedHashMap помнит порядок добавления и так же быстро ищет по ключу
    - HashMap не умеет хранить записи
    - LinkedHashMap сортирует книги по названию
    - Разницы нет
  correct: 0
  hint: Linked — связанный, помнит порядок.
exam:
  - q: Зачем all() возвращает new ArrayList<>(books.values()), а не сами values()?
    options:
      - Чтобы внешний код не мог менять каталог в обход методов Library
      - values() не работает с записями
      - Так быстрее
      - ArrayList печатается красивее
    correct: 0
    explain: values() — живое представление словаря. Удаление из него удалит книгу из каталога. Копия защищает внутреннее состояние.
    advice: Отдавай наружу копии или неизменяемые коллекции.
  - q: Почему программу делят на Book, Library и LibraryApp?
    options:
      - У каждого класса своя задача — данные, правила и общение с человеком, поэтому код проще менять
      - Java не разрешает больше 50 строк в классе
      - Так быстрее работает программа
      - Это требование record
    correct: 0
    explain: Если завтра меню станет графическим, поменяется только LibraryApp. Правила выдачи книг останутся в Library.
    advice: Один класс — одна ответственность.
  - q: Почему ключ каталога — номер книги, а не название?
    options:
      - Номер уникален, а названия могут повторяться
      - Названия нельзя класть в ключ
      - Так короче
      - Номер занимает меньше памяти
    correct: 0
    explain: В словаре один ключ — одна запись. Две разные книги с одинаковым названием затёрли бы друг друга.
    advice: Для ключей выбирай то, что точно не повторяется.
memory:
  note: Момент после заполнения каталога.
  stack:
    - method: main(String[] args)
      vars:
        - Library lib → объект в куче
  heap:
    - obj: Library
      data: books → LinkedHashMap из 4 книг
    - obj: LinkedHashMap<String, Book>
      data: "B1 → Мастер…, B2 → Война…, B3 → Собачье…, B4 → Преступление…"
tests:
  - name: Каталог
    stdout: |
      B1 | Мастер и Маргарита | Булгаков | 1967
      B2 | Война и мир | Толстой | 1869
      B3 | Собачье сердце | Булгаков | 1925
      B4 | Преступление и наказание | Достоевский | 1866
      Книг в каталоге: 4
  - kind: source
    name: Книга ложится по номеру
    pattern: 'books\s*\.\s*put\s*\(\s*book\s*\.\s*id\s*\(\s*\)'
    message: "Клади книгу по номеру: books.put(book.id(), book)"
