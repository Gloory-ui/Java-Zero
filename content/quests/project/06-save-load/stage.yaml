id: save-load
title: "Сохранение и загрузка каталога"
hints:
  - "`clear()` — две строки: `books.clear(); borrowedBy.clear();`."
  - "`save`: список строк с заголовком, для каждой книги — поля через «;» и `borrowedBy.getOrDefault(b.id(), \"\")` в конце; `Files.write(file, lines);`."
  - "`load`: `Files.readAllLines(file)`, `clear()`, цикл с `i = 1`, `split(\";\", -1)`, `add(new Book(...))` и `borrowedBy.put(...)`, если читатель не пустой."
sampleInput: |
  borrow B3 Вика
  save
  clear
  list
  load
  list
  exit
quiz:
  question: Сколько элементов вернёт "a;b;".split(";", -1)?
  options:
    - "3 — последний пустой"
    - "2"
    - "1"
    - "4"
  correct: 0
  hint: Предел -1 запрещает отбрасывать пустые куски в конце.
exam:
  - q: Зачем load вызывает clear() перед чтением файла?
    options:
      - Иначе книги из файла добавятся к имеющимся, а выдачи перемешаются
      - Без clear файл не прочитается
      - clear ускоряет чтение
      - Так требует Files
    correct: 0
    explain: Загрузка должна восстановить состояние из файла целиком, а не смешать его с текущим.
    advice: Сначала прочитай файл, потом очищай — тогда при ошибке чтения каталог не пропадёт.
  - q: Почему в меню NoSuchFileException ловят раньше IOException?
    options:
      - Это наследник IOException, и для него нужно своё понятное сообщение
      - IOException нельзя поймать
      - Порядок не важен
      - NoSuchFileException — не исключение
    correct: 0
    explain: catch проверяются по порядку. Общий IOException выше перехватил бы и отсутствие файла, и сообщение стало бы расплывчатым.
    advice: Частные исключения — выше общих.
  - q: Почему читатель хранится последним столбцом CSV?
    options:
      - Он необязательный, и пустой последний столбец легко прочитать через split с -1
      - Так требует формат CSV
      - Иначе файл не запишется
      - Столбцы нельзя переставлять
    correct: 0
    explain: Обязательные поля идут первыми и всегда на месте. Необязательный читатель в конце не сдвигает остальные.
    advice: Проектируя формат файла, подумай, как его будут читать.
memory:
  note: Момент после load — каталог восстановлен из файла.
  stack:
    - method: Library.load(Path file)
      vars:
        - List<String> lines → 5 строк файла
        - int i = 5
    - method: run(Library lib, Scanner sc)
      vars:
        - String cmd → «load»
  heap:
    - obj: Library
      data: 4 книги, borrowedBy = {B3=Вика}
tests:
  - name: Сохранить, очистить, загрузить
    stdin: |
      borrow B3 Вика
      save
      clear
      list
      load
      list
      exit
    stdout: |
      B3 выдана: Вика
      Сохранено книг: 4
      Каталог очищен
      Каталог пуст
      Загружено книг: 4
      B1 | Мастер и Маргарита | Булгаков | 1967
      B2 | Война и мир | Толстой | 1869
      B3 | Собачье сердце | Булгаков | 1925 — у Вика
      B4 | Преступление и наказание | Достоевский | 1866
      До встречи!
  - name: Загрузка отменяет несохранённое
    stdin: |
      save
      borrow B1 Ян
      load
      list
    stdout: |
      Сохранено книг: 4
      B1 выдана: Ян
      Загружено книг: 4
      B1 | Мастер и Маргарита | Булгаков | 1967
      B2 | Война и мир | Толстой | 1869
      B3 | Собачье сердце | Булгаков | 1925
      B4 | Преступление и наказание | Достоевский | 1866
  - kind: source
    name: Пустой столбец сохраняется
    pattern: 'split\s*\(\s*";"\s*,\s*-1\s*\)'
    message: "Читай строки CSV через split(\";\", -1)"
