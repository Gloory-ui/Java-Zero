id: sets
title: "Set: только уникальные"
hints:
  - "Заведи второе множество `Set<Integer> repeated = new TreeSet<>();` для повторов."
  - "`add` возвращает `false` для уже известного числа: `if (!unique.add(n)) { repeated.add(n); }`."
  - "Итоги: `unique.size()`, `unique` и `repeated` — `TreeSet` сам печатается по возрастанию."
sampleInput: |
  4 7 4 1 9 7 4 3
quiz:
  question: Что вернёт set.add(x), если x уже есть во множестве?
  options:
    - "false"
    - "true"
    - Бросит исключение
    - Индекс x
  correct: 0
  hint: Повтор не добавляется, и add об этом сообщает.
exam:
  - q: Какое множество печатает элементы по возрастанию?
    options:
      - TreeSet
      - HashSet
      - LinkedHashSet
      - Любое
    correct: 0
    explain: TreeSet держит элементы отсортированными. HashSet — в непредсказуемом порядке, LinkedHashSet — в порядке добавления.
    advice: Выбирай реализацию по тому, какой порядок нужен.
  - q: Почему повторы собирают во множество, а не в список?
    options:
      - Число, которое встретилось трижды, попало бы в список дважды
      - В список нельзя добавлять числа
      - Список не печатается
      - Так быстрее ввод
    correct: 0
    explain: Каждый следующий повтор снова даёт false у add. Множество повторов само отбросит лишние копии.
    advice: Нужен результат без повторов — клади его во множество.
  - q: Как проверить, есть ли 7 во множестве nums?
    options:
      - nums.contains(7)
      - nums.get(7)
      - nums.indexOf(7)
      - nums[7]
    correct: 0
    explain: У множества нет индексов, но проверка contains работает очень быстро.
    advice: Для «было ли уже такое» Set подходит лучше списка.
memory:
  note: Момент после чтения всех чисел из примера.
  stack:
    - method: main(String[] args)
      vars:
        - Scanner sc → объект в куче
        - Set<Integer> unique → TreeSet в куче
        - Set<Integer> repeated → TreeSet в куче
        - int total = 8
  heap:
    - obj: TreeSet (unique)
      data: "1, 3, 4, 7, 9"
    - obj: TreeSet (repeated)
      data: "4, 7"
tests:
  - name: Числа из примера
    stdin: |
      4 7 4 1 9 7 4 3
    stdout: |
      Всего чисел: 8
      Разных: 5
      По возрастанию: [1, 3, 4, 7, 9]
      Повторялись: [4, 7]
  - name: Без повторов
    stdin: |
      3 1 2
    stdout: |
      Всего чисел: 3
      Разных: 3
      По возрастанию: [1, 2, 3]
      Повторялись: []
