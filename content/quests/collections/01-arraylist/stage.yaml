id: arraylist
title: "ArrayList: список, который растёт"
hints:
  - "Каждый шаг — один метод списка: `add`, `add(индекс, элемент)`, `remove`, `set`. После шага печатай список целиком."
  - "Вставка в начало — `list.add(0, \"яйца\");`, удаление по значению — `list.remove(\"молоко\");`."
  - "Итоги: `list.size()`, `list.contains(\"сыр\")`, `list.indexOf(\"батон\")`."
quiz:
  question: Что вернёт size() у списка [a, b, c] после remove("b")?
  options:
    - "2"
    - "3"
    - "1"
    - Ошибку
  correct: 0
  hint: Список сжимается сам, дыр не остаётся.
exam:
  - q: Почему нельзя написать ArrayList<int>?
    options:
      - В угловых скобках могут стоять только классы, для int есть Integer
      - int слишком маленький тип
      - ArrayList хранит только строки
      - Можно, это правильная запись
    correct: 0
    explain: Коллекции хранят объекты. Для каждого примитива есть класс-обёртка — Integer, Double, Character, Boolean, — и Java переводит значения туда и обратно сама.
    advice: Пиши ArrayList<Integer>, а добавлять можно просто list.add(5).
  - q: Что делает list.add(0, x)?
    options:
      - Вставляет x в начало, остальные элементы сдвигаются вправо
      - Заменяет первый элемент на x
      - Добавляет x в конец
      - Добавляет x ноль раз
    correct: 0
    explain: add с индексом вставляет, set — заменяет. После вставки размер списка вырастает на один.
    advice: Запомни пару — add(i, x) вставляет, set(i, x) заменяет.
  - q: Чем ArrayList отличается от обычного массива?
    options:
      - Размер списка меняется сам при добавлении и удалении
      - Список быстрее массива в любых задачах
      - В массиве нельзя хранить строки
      - У списка нет индексов
    correct: 0
    explain: Внутри ArrayList лежит массив. Когда место кончается, список заводит массив побольше и переносит элементы.
    advice: Знаешь размер заранее — массив подойдёт. Размер меняется — бери список.
memory:
  note: Момент после замены на «батон».
  stack:
    - method: main(String[] args)
      vars:
        - ArrayList<String> list → объект в куче
  heap:
    - obj: ArrayList<String>
      data: "size = 3: яйца, батон, сыр"
tests:
  - name: Список покупок
    stdout: |
      Список: [хлеб, молоко, сыр]
      Первым: [яйца, хлеб, молоко, сыр]
      Без молока: [яйца, хлеб, сыр]
      Замена: [яйца, батон, сыр]
      Покупок: 3
      Есть сыр: true
      Где батон: 1
