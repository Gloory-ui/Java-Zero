id: comparator
title: "Comparator: порядок на выбор"
hints:
  - "Каждая сортировка — `books.sort(правило)`, где правило строится через `Comparator.comparing(Book::поле)`."
  - "Два ключа: `Comparator.comparing(Book::author).thenComparing(Book::title)`."
  - "Сначала новые — тот же год, но перевёрнутый: `Comparator.comparing(Book::year).reversed()`."
quiz:
  question: Что означает запись Book::year?
  options:
    - Ссылку на метод year() — «возьми у книги год»
    - Статическое поле year класса Book
    - Вызов year() прямо сейчас
    - Создание новой книги
  correct: 0
  hint: Скобок после year нет — метод не вызывается, а передаётся.
exam:
  - q: Когда нужен Comparator, а не Comparable?
    options:
      - Когда порядков несколько или класс нельзя менять
      - Когда сортируют числа
      - Когда в списке один элемент
      - Никогда, Comparable всегда лучше
    correct: 0
    explain: Comparable задаёт один естественный порядок внутри класса. Компараторов можно завести сколько угодно и снаружи класса.
    advice: Для record и чужих классов компаратор — обычный выбор.
  - q: Что делает thenComparing(Book::title)?
    options:
      - Сравнивает по названию, только если первый ключ равен
      - Сортирует сначала по названию
      - Отменяет первую сортировку
      - Переворачивает порядок
    correct: 0
    explain: Второй ключ решает ничьи. У двух книг Толстого авторы равны, и порядок определяет название.
    advice: Ключей можно цеплять сколько нужно.
  - q: Почему сортировка списка из List.of(...) без копирования падает?
    options:
      - List.of создаёт неизменяемый список
      - List.of нельзя обходить
      - В List.of нет элементов
      - sort работает только с массивами
    correct: 0
    explain: List.of возвращает список только для чтения, а sort меняет порядок на месте. Отсюда UnsupportedOperationException.
    advice: Нужно менять — оберни в new ArrayList<>(List.of(...)).
memory:
  note: Момент после сортировки по автору.
  stack:
    - method: main(String[] args)
      vars:
        - List<Book> books → ArrayList в куче
  heap:
    - obj: ArrayList<Book>
      data: "Булгаков ×2, Достоевский, Толстой ×2"
tests:
  - name: Три сортировки
    stdout: |
      По году:
      1866 Преступление и наказание
      1869 Война и мир
      1877 Анна Каренина
      1925 Собачье сердце
      1967 Мастер и Маргарита
      По автору:
      Булгаков: Мастер и Маргарита
      Булгаков: Собачье сердце
      Достоевский: Преступление и наказание
      Толстой: Анна Каренина
      Толстой: Война и мир
      Сначала новые:
      1967 Мастер и Маргарита
      1925 Собачье сердце
      1877 Анна Каренина
      1869 Война и мир
      1866 Преступление и наказание
  - kind: source
    name: Компаратор с двумя ключами
    pattern: 'thenComparing\s*\('
    message: "Для автора и названия нужен второй ключ: thenComparing(Book::title)"
  - kind: source
    name: Обратный порядок
    pattern: '\.reversed\s*\(\s*\)'
    message: "Сначала новые — через .reversed()"
