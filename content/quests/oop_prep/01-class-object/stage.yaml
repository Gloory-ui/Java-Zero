id: class-object
title: "Класс и объект: поля"
hints:
  - "Внутри `class Cat { }` объяви поля: `String name;` и `int age;`."
  - 'В `main`: `Cat barsik = new Cat();`, затем `barsik.name = "Барсик";` и `barsik.age = 3;`. Мурку создай так же, отдельным `new`.'
  - 'Вывод: `System.out.println("Кот: " + barsik.name + ", возраст: " + barsik.age);`.'
quiz:
  question: Что создаёт выражение new Cat()?
  options:
    - Новый объект класса Cat в куче
    - Новый класс Cat
    - Переменную без объекта
    - Копию уже существующего кота
  correct: 0
  hint: Класс — чертёж, new делает по нему новый объект.
exam:
  - q: Чем класс отличается от объекта?
    options:
      - Класс — описание, объект — конкретный экземпляр по этому описанию
      - Это одно и то же
      - Объект описывает класс
      - Класс хранит данные, объект — нет
    correct: 0
    explain: Класс Cat говорит, какие поля есть у каждого кота. Барсик и Мурка — два объекта со своими значениями полей.
    advice: Сравни с чертежом дома и самими домами по нему.
  - q: Что выведет System.out.println(new Cat().age)?
    options:
      - "0"
      - Ошибку компиляции
      - "null"
      - Случайное число
    correct: 0
    explain: Поля нового объекта получают значения по умолчанию. У int это 0, у String — null.
    advice: Поэтому поля лучше заполнять сразу после создания объекта.
  - q: Что будет после Cat b = a; b.name = "Том";?
    options:
      - У a тоже имя «Том»
      - У a имя не изменится
      - Ошибка компиляции
      - Создастся третий объект
    correct: 0
    explain: b = a копирует ссылку. Обе переменные указывают на один объект.
    advice: Чтобы получить второго кота, нужен второй new.
memory:
  note: Момент после создания обоих котов. В стеке — ссылки, сами объекты в куче.
  stack:
    - method: main()
      vars:
        - Cat barsik → объект в куче
        - Cat murka → объект в куче
  heap:
    - obj: Cat (Барсик)
      data: 'name = "Барсик", age = 3'
    - obj: Cat (Мурка)
      data: 'name = "Мурка", age = 5'
tests:
  - name: Два кота
    stdout: |
      Кот: Барсик, возраст: 3
      Кот: Мурка, возраст: 5
  - kind: source
    name: Класс Cat
    pattern: \bclass\s+Cat\b
    message: "Опиши класс: class Cat { String name; int age; }"
  - kind: source
    name: Два объекта через new
    pattern: new\s+Cat\s*\([\s\S]*new\s+Cat\s*\(
    message: Каждого кота создай своим new Cat()
