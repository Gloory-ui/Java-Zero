id: overloading
title: "Перегрузка: два конструктора и sayHi"
hints:
  - 'Конструктор по умолчанию: `Cat() { this("Безымянный", 1); }` — он передаёт значения конструктору с параметрами.'
  - 'Первая версия: `void sayHi(String guest)` печатает `name + ": Привет, " + guest + "!"`.'
  - 'Вторая версия: `void sayHi(String first, String second)` — то же, но `first + " и " + second`. В `main` гостей читай через `sc.next()`.'
sampleInput: |
  Аня Петя
quiz:
  question: Какую версию выберет вызов barsik.sayHi("Аня", "Петя")?
  options:
    - sayHi(String first, String second)
    - sayHi(String guest)
    - Обе по очереди
    - Никакую, будет ошибка
  correct: 0
  hint: Два аргумента — версия с двумя параметрами.
exam:
  - q: Что такое перегрузка методов?
    options:
      - Несколько методов с одним именем и разными параметрами
      - Метод, который вызывает сам себя
      - Замена метода в другом классе
      - Метод с очень длинным телом
    correct: 0
    explain: Компилятор различает версии по числу и типам параметров.
    advice: Не путай с переопределением (override) — оно бывает при наследовании.
  - q: Можно ли перегрузить метод, изменив только тип результата?
    options:
      - Нет, версии должны отличаться параметрами
      - Да, всегда
      - Да, если тип void
      - Только у конструкторов
    correct: 0
    explain: По вызову sayHi("Аня") нельзя понять, какой результат ждут, поэтому тип результата не различает версии.
    advice: Меняй число или типы параметров.
  - q: Зачем в Cat() писать this("Безымянный", 1)?
    options:
      - Чтобы значения задавались в одном конструкторе, без повторения кода
      - Чтобы создать второй объект
      - Так требует компилятор
      - Чтобы кот стал static
    correct: 0
    explain: Заполнение полей описано один раз во втором конструкторе, первый просто передаёт ему значения по умолчанию.
    advice: Поменяется логика заполнения — править придётся одно место.
memory:
  note: "Момент внутри Cat() при создании кота без параметров: вызов this(...) передаёт значения второму конструктору."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
    - method: Cat()
      vars:
        - Cat this → новый объект
    - method: Cat(String name, int age)
      vars:
        - Cat this → тот же объект
        - String name → "Безымянный"
        - int age = 1
  heap:
    - obj: Cat
      data: Поля заполнятся во втором конструкторе.
tests:
  - name: Гости Аня и Петя
    stdin: |
      Аня Петя
    stdout: |
      Кот: Безымянный, возраст: 1
      Кот: Барсик, возраст: 3
      Барсик: Привет, Аня!
      Барсик: Привет, Аня и Петя!
  - name: Гости Оля и Максим
    stdin: |
      Оля Максим
    stdout: |
      Кот: Безымянный, возраст: 1
      Кот: Барсик, возраст: 3
      Барсик: Привет, Оля!
      Барсик: Привет, Оля и Максим!
  - kind: source
    name: Конструктор по умолчанию
    pattern: \bCat\s*\(\s*\)\s*\{
    message: "Добавь конструктор без параметров: Cat() { ... }"
  - kind: source
    name: Две версии sayHi
    pattern: \bsayHi\s*\(\s*String\s+\w+\s*\)[\s\S]*\bsayHi\s*\(\s*String\s+\w+\s*,\s*String\s+\w+\s*\)|\bsayHi\s*\(\s*String\s+\w+\s*,\s*String\s+\w+\s*\)[\s\S]*\bsayHi\s*\(\s*String\s+\w+\s*\)
    message: "Нужны sayHi(String guest) и sayHi(String first, String second)"
