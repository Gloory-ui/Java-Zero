id: constructor
title: Конструктор и this
hints:
  - "Конструктор — внутри класса: `Cat(String name, int age) { ... }`, без `void` и без другого типа."
  - "В нём два присваивания: `this.name = name;` и `this.age = age;`."
  - "В `main`: `Cat first = new Cat(sc.next(), sc.nextInt());`, потом `first.printInfo();`. Второго кота — так же."
sampleInput: |
  Барсик 3 Мурка 5
quiz:
  question: Когда выполняется конструктор?
  options:
    - Один раз, при создании объекта через new
    - При каждом вызове метода
    - Когда программа заканчивается
    - Только если вызвать его по имени
  correct: 0
  hint: new Cat(...) создаёт объект и сразу вызывает конструктор.
exam:
  - q: Зачем в конструкторе пишут this.name = name?
    options:
      - Чтобы отличить поле объекта от параметра с тем же именем
      - Так быстрее работает программа
      - Без this поле нельзя объявить
      - this создаёт новый объект
    correct: 0
    explain: this.name — поле объекта, name — параметр конструктора. Без this параметр присвоился бы сам себе.
    advice: Параметры можно назвать иначе (n, a), но с одинаковыми именами и this код читается проще.
  - q: Чем конструктор отличается от метода?
    options:
      - Имя как у класса и нет типа результата
      - Конструктор всегда static
      - Конструктор нельзя вызвать с параметрами
      - Ничем
    correct: 0
    explain: У конструктора нет даже void, а называется он строго как класс.
    advice: Если написать void Cat(...), получится обычный метод с неудачным именем.
  - q: Что будет с new Cat(), если в классе есть только Cat(String name, int age)?
    options:
      - Ошибка компиляции
      - Кот без имени
      - Кот с именем «Cat»
      - Java сама подставит пустые значения
    correct: 0
    explain: Пустой конструктор Java добавляет, только когда в классе нет ни одного своего.
    advice: Нужен и такой вызов — напиши второй конструктор. Об этом следующий этап.
memory:
  note: Момент внутри конструктора при создании Барсика, до присваиваний. this указывает на новый объект с полями по умолчанию.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
    - method: Cat(String name, int age)
      vars:
        - Cat this → новый объект
        - String name → "Барсик"
        - int age = 3
  heap:
    - obj: Cat
      data: name = null, age = 0 — поля ещё не заполнены
tests:
  - name: Барсик и Мурка
    stdin: |
      Барсик 3 Мурка 5
    stdout: |
      Кот: Барсик, возраст: 3
      Кот: Мурка, возраст: 5
  - name: Другие коты
    stdin: |
      Том 7 Пушок 1
    stdout: |
      Кот: Том, возраст: 7
      Кот: Пушок, возраст: 1
  - kind: source
    name: Конструктор с именем и возрастом
    pattern: \bCat\s*\(\s*String\s+\w+\s*,\s*int\s+\w+\s*\)\s*\{
    message: "Добавь конструктор Cat(String name, int age) { ... }"
  - kind: source
    name: Поле заполняется через this
    pattern: \bthis\s*\.\s*name\s*=
    message: "В конструкторе пиши this.name = name;"
