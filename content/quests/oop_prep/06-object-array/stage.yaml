id: object-array
title: Массив объектов и карточки
hints:
  - "Прочитай `n`, создай `Cat[] cats = new Cat[n];` и в цикле заполни: `cats[i] = new Cat(sc.next(), sc.nextInt());`."
  - 'Метод `void printCard(int number)` печатает три строки: `"--- Карточка " + number + " ---"`, имя и возраст. В цикле вызывай `cats[i].printCard(i + 1);`.'
  - "Самый старший — поиск индекса: `int oldest = 0;`, в цикле `if (cats[i].age > cats[oldest].age) oldest = i;`, потом вывод `cats[oldest].name`."
sampleInput: |
  3
  Барсик 3
  Мурка 5
  Том 2
quiz:
  question: Что лежит в ячейках сразу после new Cat[3]?
  options:
    - null — котов ещё нет
    - Три кота с пустыми полями
    - Нули
    - Ошибка компиляции
  correct: 0
  hint: Массив объектов хранит ссылки, а новая ссылка никуда не указывает.
exam:
  - q: Что произойдёт при cats[0].printCard(1), если cats[0] не заполнили?
    options:
      - NullPointerException
      - Напечатается пустая карточка
      - Ошибка компиляции
      - Ничего
    correct: 0
    explain: В ячейке null. Вызвать метод у «никакого» объекта нельзя.
    advice: Перед использованием убедись, что каждая ячейка заполнена через new.
  - q: Сколько объектов Cat создаст код Cat[] cats = new Cat[5];?
    options:
      - Ни одного, только массив ссылок
      - Пять
      - Один
      - Шесть
    correct: 0
    explain: new Cat[5] создаёт один объект — массив из пяти ячеек для ссылок. Котов создаёт только new Cat(...).
    advice: Нарисуй кучу — массив отдельно, коты отдельно.
  - q: Как найти самого старшего кота в массиве?
    options:
      - Запомнить индекс и сравнивать cats[i].age с cats[oldest].age
      - Сравнивать cats[i] > cats[oldest]
      - Отсортировать имена
      - Взять последнего кота
    correct: 0
    explain: Объекты сравнивают по нужному полю. Индекс даёт доступ ко всему коту — и к имени, и к возрасту.
    advice: Это тот же поиск максимума, что в массивах чисел.
memory:
  note: Момент после заполнения массива при вводе из примера. Массив хранит три ссылки, коты лежат в куче отдельно.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 3
        - Cat[] cats → массив ссылок в куче
  heap:
    - obj: Cat[3]
      data: Три ссылки — на Барсика, Мурку и Тома.
    - obj: Cat (Барсик)
      data: 'name = "Барсик", age = 3'
    - obj: Cat (Мурка)
      data: 'name = "Мурка", age = 5'
    - obj: Cat (Том)
      data: 'name = "Том", age = 2'
tests:
  - name: Три кота из примера
    stdin: |
      3
      Барсик 3
      Мурка 5
      Том 2
    stdout: |
      --- Карточка 1 ---
      Имя: Барсик
      Возраст: 3
      --- Карточка 2 ---
      Имя: Мурка
      Возраст: 5
      --- Карточка 3 ---
      Имя: Том
      Возраст: 2
      Самый старший: Мурка
  - name: Одинаковый возраст — выводится первый
    stdin: |
      2
      Пушок 4
      Снежок 4
    stdout: |
      --- Карточка 1 ---
      Имя: Пушок
      Возраст: 4
      --- Карточка 2 ---
      Имя: Снежок
      Возраст: 4
      Самый старший: Пушок
  - kind: source
    name: Массив котов
    pattern: \bCat\s*\[\s*\]\s*\w+\s*=\s*new\s+Cat\s*\[
    message: "Создай массив: Cat[] cats = new Cat[n];"
  - kind: source
    name: Метод printCard
    pattern: \bvoid\s+printCard\s*\(\s*int\s+\w+\s*\)
    message: Вывод карточки — метод void printCard(int number) в классе Cat
