id: remainder
title: "Остаток от деления: чётность и последняя цифра"
hints:
  - "`%` — остаток от деления: `n % 2` — сколько останется, если разделить n на 2 нацело."
  - "Последняя цифра числа — остаток от деления на 10: `n % 10`."
  - "Три команды подряд: `System.out.println(n % 2);`, затем такие же для 5 и для 10."
quiz:
  question: Как проверить, что число n кратно 5?
  options:
    - n / 5 == 0
    - n % 5 == 0
    - n % 5 == 1
    - n == 5
  correct: 1
  hint: Если остаток от деления на 5 равен нулю, значит число делится нацело.
exam:
  - q: Чему равно выражение 14 % 5 в Java?
    options:
      - "2.8"
      - "2"
      - "4"
      - "0"
    correct: 2
    explain: "14 делим на 5: помещается 2 раза (это 10), в остатке 14 - 10 = 4."
    advice: Потренируйся находить остаток от деления в уме.
  - q: Как получить последнюю цифру числа 347?
    options:
      - 347 / 10
      - 347 % 10
      - 347 % 100
      - 347 - 10
    correct: 1
    explain: Остаток от деления на 10 — последняя цифра, здесь 7. А 347 / 10 отбрасывает её и даёт 34.
    advice: Запомни пару приёмов — n % 10 и n / 10.
  - q: Чему равно 5 % 7?
    options:
      - "0"
      - "2"
      - "5"
      - "Ошибка: делимое меньше делителя"
    correct: 2
    explain: Семёрка в пятёрке не помещается ни разу, поэтому в остатке остаётся всё число — 5.
    advice: Если делимое меньше делителя, остаток равен делимому.
memory:
  note: Момент в конце программы. Остатки печатаются сразу и в переменные не сохраняются, в памяти лежит только n.
  stack:
    - method: main()
      vars:
        - int n = 17
  heap: []
tests:
  - name: Остатки от деления 17 на 2, на 5 и последняя цифра
    stdout: |
      1
      2
      7
  - kind: source
    name: Остаток от деления на 2
    pattern: "%\\s*2\\b"
    message: "Посчитай остаток оператором %: n % 2"
  - kind: source
    name: Последняя цифра через % 10
    pattern: "%\\s*10\\b"
    message: "Последняя цифра — n % 10"
