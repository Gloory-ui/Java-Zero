id: program-structure
isNew: true
title: "Первая программа: класс, main и вывод"
hints:
  - Внутри `main` нужны две команды вывода — по одной на каждую строку.
  - 'Команда вывода: `System.out.println("текст");` — текст в двойных кавычках, в конце точка с запятой.'
  - 'Первая строка: `System.out.println("Привет, Java!");` Вторую напиши так же, со своим текстом.'
quiz:
  question: С какого метода Java начинает выполнять программу?
  options:
    - С первого метода в файле
    - С метода main
    - С метода start
    - С любого метода, который вызовет пользователь
  correct: 1
  hint: Точка входа любой программы на Java — public static void main(String[] args).
exam:
  - q: Что будет, если убрать точку с запятой после System.out.println("Привет")?
    options:
      - Программа выведет текст без перевода строки
      - Java сама допишет точку с запятой
      - Код не скомпилируется
      - Программа запустится с предупреждением
    correct: 2
    explain: Точка с запятой отмечает конец команды. Без неё компилятор не может разобрать код и останавливается с ошибкой, программа не запускается.
    advice: Перечитай раздел «Как устроена программа».
  - q: Чем System.out.print отличается от System.out.println?
    options:
      - println печатает и переводит строку, print — только печатает
      - print работает быстрее, иначе они одинаковые
      - println печатает только числа
      - print печатает в файл, а не на экран
    correct: 0
    explain: После println следующий вывод начнётся с новой строки. После print — продолжится в той же строке.
    advice: Попробуй оба варианта в лаборатории кнопкой «Запуск с вводом».
  - q: Что сделает компилятор со строкой // Выведи результат?
    options:
      - Выведет этот текст на экран
      - Выдаст ошибку компиляции
      - Пропустит её — это комментарий
      - Выполнит как команду
    correct: 2
    explain: Всё после // до конца строки — комментарий. Компилятор его не читает, это заметка для людей.
    advice: Используй комментарии, чтобы подписывать шаги решения.
memory:
  note: Момент вывода первой строки. Даже без аргументов запуска Java создаёт для main пустой массив args.
  stack:
    - method: main(String[] args)
      vars:
        - String[] args → пустой массив
  heap:
    - obj: String[0]
      data: Массив аргументов запуска. Программу запускают без аргументов, поэтому он пустой.
    - obj: '"Привет, Java!"'
      data: Строка-литерал из кода. println получает ссылку на неё.
tests:
  - name: Выводит две строки
    stdout: |
      Привет, Java!
      Я пишу первую программу
  - kind: source
    name: Две команды println
    pattern: System\.out\.println[\s\S]*System\.out\.println
    message: Выведи каждую строку своей командой System.out.println
