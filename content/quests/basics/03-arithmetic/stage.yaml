id: arithmetic
isNew: true
title: "Арифметика: целое и дробное деление"
hints:
  - "Когда делишь `int` на `int`, дробная часть отбрасывается: `a / b` для 7 и 2 даёт 3."
  - "Чтобы получить дробь, преврати одно из чисел в `double` прямо перед делением: `(double) a / b`."
  - "Умножение выполняется раньше сложения: `a + b * 2` — это 7 + 4. Каждое значение выводи своим `System.out.println(...)`."
quiz:
  question: Чему равно 9 / 2 в Java, если оба числа int?
  options:
    - "4.5"
    - "4"
    - "5"
    - "4.0"
  correct: 1
  hint: Целое деление отбрасывает дробную часть без округления.
exam:
  - q: Что выведет System.out.println(7 / 2 * 2)?
    options:
      - "7"
      - "7.0"
      - "6"
      - "6.5"
    correct: 2
    explain: Действия идут слева направо. 7 / 2 — целое деление, получается 3. Потом 3 * 2 = 6.
    advice: При целом делении сначала посчитай, что потеряется дробная часть.
  - q: Как получить 3.5 из int a = 7 и int b = 2?
    options:
      - (double) (a / b)
      - (double) a / b
      - a / b + 0.5
      - double c = a / b
    correct: 1
    explain: Приведение (double) a превращает 7 в 7.0 до деления, и деление становится дробным. В (double) (a / b) целые числа делятся раньше, и получается 3.0.
    advice: Приводи одно из чисел, а не готовый результат.
  - q: Что произойдёт при выполнении int x = 10 / 0;?
    options:
      - В x запишется 0
      - В x запишется Infinity
      - Программа упадёт с ArithmeticException
      - Код не скомпилируется
    correct: 2
    explain: Целочисленное деление на ноль запрещено, при запуске Java бросает ArithmeticException / by zero. Компилятор такую строку пропускает.
    advice: Перед делением проверяй делитель — так будет сделано в калькуляторе.
memory:
  note: Результаты выражений не сохраняются в переменные — println получает их и сразу печатает. В памяти остаются только a и b.
  stack:
    - method: main()
      vars:
        - int a = 7
        - int b = 2
  heap: []
tests:
  - name: Целое деление, дробное деление и приоритет
    stdout: |
      3
      3.5
      11
  - kind: source
    name: Делишь a на b
    pattern: \ba\s*/\s*b\b
    message: "Посчитай деление по переменным: a / b"
  - kind: source
    name: Приведение (double)
    pattern: \(\s*double\s*\)
    message: "Приведи одно из чисел к double: (double) a / b"
