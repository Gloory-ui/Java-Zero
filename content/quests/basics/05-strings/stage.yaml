id: strings
isNew: true
title: "Строки: склейка текста и чисел"
hints:
  - 'Текст и переменную склеивает `+`: `"Возраст: " + age`.'
  - 'Пробел после двоеточия пишется внутри кавычек: `"Студент: "`.'
  - 'Сумму возьми в скобки: `"Баллы: " + (score + bonus)` — иначе Java склеит 85 и 10 в «8510».'
quiz:
  question: 'Что выведет System.out.println("Итого: " + 2 + 3)?'
  options:
    - "Итого: 5"
    - "Итого: 23"
    - "Итого: 2 + 3"
    - Ошибку компиляции
  correct: 1
  hint: Слева уже строка, поэтому 2 и 3 приклеиваются по очереди как текст.
exam:
  - q: Что выведет System.out.println(2 + 3 + " яблок")?
    options:
      - 23 яблок
      - 5 яблок
      - 2 + 3 яблок
      - Ошибку компиляции
    correct: 1
    explain: Выражение идёт слева направо. Пока строки нет, 2 + 3 складываются в 5, и только потом приклеивается текст.
    advice: Прочитай раздел «Главная ловушка».
  - q: 'Как правильно вывести «Сумма: 5» при int a = 2 и int b = 3?'
    options:
      - '"Сумма: " + a + b'
      - '"Сумма: " + (a + b)'
      - '"Сумма: a + b"'
      - '"Сумма: " - (a + b)'
    correct: 1
    explain: 'Скобки заставляют сначала сложить числа. Без них получится «Сумма: 23», а в кавычках — просто текст «a + b».'
    advice: Если в строке нужна сумма, бери её в скобки.
  - q: Как вывести кавычки внутри строки?
    options:
      - '"Он сказал "да""'
      - '"Он сказал \"да\""'
      - "'Он сказал \"да\"'"
      - Никак, это запрещено
    correct: 1
    explain: Обратная косая черта перед кавычкой говорит Java, что это символ текста, а не конец строки.
    advice: Так же работают \t (табуляция) и \n (перевод строки).
memory:
  note: Момент перед выводом суммы баллов. Строки — объекты, поэтому в стеке лежит ссылка name, а сам текст — в куче. Склейка создаёт новую строку.
  stack:
    - method: main()
      vars:
        - String name → строка в куче
        - int age = 19
        - int score = 85
        - int bonus = 10
  heap:
    - obj: '"Аня"'
      data: Строка-литерал, на неё указывает name.
    - obj: '"Баллы: 95"'
      data: Новая строка — результат склейки. Её получает println.
tests:
  - name: Подписанные значения
    stdout: |
      Студент: Аня
      Возраст: 19
      Баллы: 95
  - kind: source
    name: Имя берётся из переменной
    pattern: \+\s*name\b
    message: 'Приклей переменную к тексту: "Студент: " + name'
  - kind: source
    name: Баллы считаются из переменных
    pattern: score\s*\+\s*bonus
    message: "Посчитай сумму из переменных: score + bonus"
