id: memory-boxes
badge: ЭТАП 01 / 02
title: "Коробки памяти: int, double и вывод"
hints:
  - "Нужны три переменные: две для чисел и одна для суммы. Целое число — тип `int`, дробное — `double`."
  - "Объявление переменной: тип, имя, `=`, значение и `;`. Например: `int a = 10;`"
  - Сумму сохрани в `double result = a + b;` — int сложится с double, получится double. Выведи её через `System.out.println(result);`
quiz:
  question: Какой тип переменной нужен для хранения числа 3.14?
  options:
    - int
    - double
    - boolean
    - char
  correct: 1
  hint: Числа с плавающей точкой в Java объявляются типом double.
exam:
  - q: В чем фундаментальная разница между int и String в памяти JVM?
    options:
      - int хранится в куче (Heap), а String в регистрах процессора
      - int хранит двоичное число прямо на стеке (Stack), а String — адрес объекта в куче (Heap)
      - Никакой разницы нет, оба типа примитивные
      - String занимает 4 байта, а int занимает 8 байт
    correct: 1
    explain: Примитивные типы (int, double) хранятся непосредственно в стековом фрейме. Ссылочные типы (String) хранятся в куче, а на стеке лежит ссылка.
    advice: Повтори разницу между стеком и кучей во вкладке «Память RAM».
memory:
  note: Момент, когда main дошёл до конца. Все три переменные — простые значения, они лежат прямо в стеке.
  stack:
    - method: main()
      vars:
        - int a = 10
        - double b = 2.5
        - double result = 12.5
  heap: []
tests:
  - name: Выводит a + b
    stdout: |
      12.5
  - kind: source
    name: int a = 10
    pattern: \bint\s+a\s*=\s*10\s*;
    message: "Объяви переменную: int a = 10;"
  - kind: source
    name: double b = 2.5
    pattern: \bdouble\s+b\s*=\s*2\.5\s*;
    message: "Объяви переменную: double b = 2.5;"
  - kind: source
    name: double result = a + b
    pattern: \bdouble\s+result\s*=\s*a\s*\+\s*b\s*;
    message: "Сложи в переменную: double result = a + b;"
