id: logic
isNew: true
title: "Логика: && (и), || (или), ! (не)"
hints:
  - Год високосный в двух случаях — делится на 4 и не делится на 100, либо делится на 400. Это «или» из двух частей.
  - "«и» — `&&`, «или» — `||`, «не делится на 100» — `year % 100 != 0`."
  - "Всё условие: `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0` — в `if`, а в `else` печатай «Обычный»."
sampleInput: |
  2024
quiz:
  question: Когда выражение a && b истинно?
  options:
    - Когда истинно хотя бы одно из a и b
    - Когда истинны и a, и b
    - Когда a и b разные
    - Когда оба ложны
  correct: 1
  hint: '&& — это «и»: нужны обе части.'
exam:
  - q: Чему равно (5 > 3) || (2 > 4)?
    options:
      - "true"
      - "false"
      - Ошибка компиляции
      - "2"
    correct: 0
    explain: Для «или» достаточно одной истинной части. 5 > 3 истинно, поэтому всё выражение true.
    advice: Для || ищи хотя бы одну истинную часть, для && — хотя бы одну ложную.
  - q: Почему в цепочке else if более строгое условие ставят раньше?
    options:
      - Так требует компилятор
      - Срабатывает первая истинная ветка, и до строгого условия дело не дойдёт
      - Строгие условия выполняются медленнее
      - Порядок не важен
    correct: 1
    explain: Для числа 6 условие «чётное» тоже истинно. Если оно стоит первым, ветка «делится и на 2, и на 3» никогда не выполнится.
    advice: Это разбирают на защите КТ 1, задание 3.
  - q: Что означает !(x > 5)?
    options:
      - x < 5
      - x <= 5
      - x != 5
      - x > -5
    correct: 1
    explain: ! переворачивает результат. «Не больше пяти» — значит «меньше или равно пяти», пятёрка тоже подходит.
    advice: Проверяй граничное значение — здесь это само число 5.
memory:
  note: Момент в конце программы при вводе 1900. Условие вычислилось в false и нигде не сохранилось.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int year = 1900
  heap:
    - obj: Scanner
      data: Прочитал из ввода число 1900.
tests:
  - name: 2024 — високосный
    stdin: |
      2024
    stdout: |
      Високосный
  - name: 1900 делится на 100 — обычный
    stdin: |
      1900
    stdout: |
      Обычный
  - name: 2000 делится на 400 — високосный
    stdin: |
      2000
    stdout: |
      Високосный
  - name: 2023 — обычный
    stdin: |
      2023
    stdout: |
      Обычный
  - kind: source
    name: Логические операторы && и ||
    pattern: "&&[\\s\\S]*\\|\\||\\|\\|[\\s\\S]*&&"
    message: Соедини части условия операторами && и ||
