id: conditions
isNew: true
title: "Условия: if, else и сравнения"
hints:
  - "Три варианта знака — это цепочка `if … else if … else`."
  - "Условия для знака: `n > 0` и `n < 0`. Для нуля условие не нужно — это последний `else`."
  - "Чётность — отдельный `if (n % 2 == 0)` с веткой `else`. Не проверяй `n % 2 == 1`: для −3 остаток равен −1."
sampleInput: |
  -3
quiz:
  question: 'Что выведет код: int x = 5; if (x > 3) { System.out.println("A"); } else { System.out.println("B"); }'
  options:
    - A
    - B
    - A и B
    - Ничего
  correct: 0
  hint: 5 > 3 — истина, поэтому выполняется первая ветка, а else пропускается.
exam:
  - q: Чем = отличается от ==?
    options:
      - Ничем, это одно и то же
      - = записывает значение в переменную, == сравнивает два значения
      - == записывает значение, = сравнивает
      - == используется только для строк
    correct: 1
    explain: int a = 5; кладёт 5 в a. a == 5 спрашивает, равно ли a пяти, и даёт true или false.
    advice: В условиях if всегда стоит сравнение, то есть ==.
  - q: Почему нечётность надёжнее проверять через n % 2 != 0, а не n % 2 == 1?
    options:
      - Так быстрее
      - Для отрицательных нечётных чисел остаток равен −1
      - n % 2 == 1 не компилируется
      - Разницы нет
    correct: 1
    explain: В Java знак остатка совпадает со знаком делимого, поэтому -3 % 2 = -1. Условие == 1 для него ложно, а != 0 — истинно.
    advice: Проверяй свои условия на отрицательных числах и на нуле.
  - q: Сколько веток выполнится в цепочке if / else if / else?
    options:
      - Все, у которых истинно условие
      - Ровно одна — первая с истинным условием, или else
      - Две — первая и else
      - Ни одной, если условий больше двух
    correct: 1
    explain: Цепочка проверяется сверху вниз. Как только условие истинно, выполняется его ветка, а остальные пропускаются. Если ни одно не подошло, выполняется else.
    advice: Порядок веток важен — это пригодится в КТ 1, задание 3.
memory:
  note: Момент в конце программы при вводе -3. Сравнения в if вычисляются на лету и в переменных не хранятся.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = -3
  heap:
    - obj: Scanner
      data: Прочитал из ввода число -3.
tests:
  - name: Положительное нечётное
    stdin: |
      5
    stdout: |
      Положительное
      Нечетное
  - name: Отрицательное нечётное
    stdin: |
      -3
    stdout: |
      Отрицательное
      Нечетное
  - name: Ноль
    stdin: |
      0
    stdout: |
      Ноль
      Четное
  - name: Отрицательное чётное
    stdin: |
      -4
    stdout: |
      Отрицательное
      Четное
  - kind: source
    name: Условия if и else
    pattern: \bif\s*\([\s\S]*\belse\b
    message: Выбери ветку через if и else
