id: negative-cells
title: Номера ячеек с отрицательными числами
hints:
  - "Прочитай `rows`, `cols` и таблицу `int[][] t = new int[rows][cols];` двумя вложенными циклами."
  - 'Обход: `if (t[i][j] < 0)` — печатай `"[" + i + "][" + j + "]"` и увеличивай `count`.'
  - 'После циклов: `if (count == 0) System.out.println("Отрицательных чисел нет");`.'
sampleInput: |
  3 4
  5 -2 7 0
  -1 4 -8 3
  6 9 2 -4
quiz:
  question: Сколько номеров выведет программа для таблицы {{0, -3}, {-1, 0}}?
  options:
    - "2"
    - "4"
    - "0"
    - "3"
  correct: 0
  hint: Отрицательные только −3 и −1, ноль к ним не относится.
exam:
  - q: Что означает номер ячейки [2][0]?
    options:
      - Третья строка, первый столбец
      - Вторая строка, нулевой столбец
      - Первая строка, третий столбец
      - Значение 20
    correct: 0
    explain: Индексы считаются с нуля. Первый индекс — строка, второй — столбец.
    advice: Если спросят «номер по-человечески», прибавь к индексам единицу.
  - q: Почему сообщение «Отрицательных чисел нет» нельзя печатать в else внутри цикла?
    options:
      - Оно напечатается для каждой неотрицательной ячейки
      - Так не скомпилируется
      - Оно не напечатается никогда
      - Цикл остановится
    correct: 0
    explain: Проверка «нет ни одного» возможна только после просмотра всей таблицы.
    advice: Для этого нужен счётчик или флаг, как в квесте «Циклы».
  - q: Как обойти все ячейки таблицы rows × cols?
    options:
      - Внешний цикл по строкам, внутренний по столбцам
      - Один цикл до rows * cols с t[i][i]
      - Цикл только по строкам
      - Цикл только по столбцам
    correct: 0
    explain: На каждую строку внутренний цикл проходит все её столбцы — так посещается каждая ячейка.
    advice: Проверь, что внешний цикл идёт до rows, а внутренний до cols.
memory:
  note: Момент после обхода при вводе из примера.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int rows = 3
        - int cols = 4
        - int[][] t → массив строк в куче
        - int count = 4
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[3][4]
      data: "{5, -2, 7, 0}, {-1, 4, -8, 3}, {6, 9, 2, -4}"
tests:
  - name: Таблица из примера
    stdin: |
      3 4
      5 -2 7 0
      -1 4 -8 3
      6 9 2 -4
    stdout: |
      [0][1]
      [1][0]
      [1][2]
      [2][3]
  - name: Отрицательных нет, ноль не считается
    stdin: |
      2 2
      1 2
      3 0
    stdout: |
      Отрицательных чисел нет
  - name: Все числа отрицательные
    stdin: |
      1 2
      -1 -3
    stdout: |
      [0][0]
      [0][1]
