id: diagonal-sums
title: Суммы главной и побочной диагонали
hints:
  - "Прочитай `n` и матрицу `int[][] m = new int[n][n];` двумя вложенными циклами."
  - "Заведи до цикла `int mainSum = 0;` и `int sideSum = 0;`."
  - "Один цикл по `i`: `mainSum += m[i][i];` и `sideSum += m[i][n - 1 - i];`."
sampleInput: |
  3
  5 1 2
  3 4 6
  7 8 9
quiz:
  question: Какие ячейки матрицы 3 × 3 лежат на побочной диагонали?
  options:
    - m[0][2], m[1][1], m[2][0]
    - m[0][0], m[1][1], m[2][2]
    - m[2][0], m[2][1], m[2][2]
    - m[0][1], m[1][2], m[2][0]
  correct: 0
  hint: "Столбец побочной диагонали — n - 1 - i: 2, 1, 0."
exam:
  - q: Почему для сумм диагоналей хватает одного цикла?
    options:
      - В каждой строке ровно одна ячейка каждой диагонали, её столбец считается по i
      - Двумерный массив нельзя обойти двумя циклами
      - Так быстрее компилируется
      - Диагональ — это одна строка
    correct: 0
    explain: Для строки i главная диагональ — столбец i, побочная — столбец n - 1 - i.
    advice: Двумя циклами с проверкой i == j тоже правильно, но они проходят все n × n ячеек.
  - q: Сколько элементов матрицы 5 × 5 входит в обе диагонали сразу?
    options:
      - "1"
      - "0"
      - "2"
      - "5"
    correct: 0
    explain: При нечётном n диагонали пересекаются в центре — ячейке m[2][2].
    advice: При чётном n общих ячеек нет.
  - q: Какая формула даёт столбец побочной диагонали в строке i?
    options:
      - n - 1 - i
      - n - i
      - i + 1
      - i - n
    correct: 0
    explain: В строке 0 это последний столбец n - 1, в последней строке — столбец 0.
    advice: Проверь формулу на крайних строках — так легко поймать ошибку на единицу.
memory:
  note: Момент после цикла при вводе из примера.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 3
        - int[][] m → массив строк в куче
        - int mainSum = 18
        - int sideSum = 13
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[3][3]
      data: "{5, 1, 2}, {3, 4, 6}, {7, 8, 9}"
tests:
  - name: Матрица 3 × 3 из примера
    stdin: |
      3
      5 1 2
      3 4 6
      7 8 9
    stdout: |
      Сумма главной диагонали: 18
      Сумма побочной диагонали: 13
  - name: Матрица 4 × 4
    stdin: |
      4
      2 0 1 3
      4 5 6 7
      1 1 1 1
      9 8 7 6
    stdout: |
      Сумма главной диагонали: 14
      Сумма побочной диагонали: 19
  - name: Матрица 1 × 1
    stdin: |
      1
      7
    stdout: |
      Сумма главной диагонали: 7
      Сумма побочной диагонали: 7
