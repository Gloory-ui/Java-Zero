id: min-all
title: Наименьший элемент и все его повторы
hints:
  - "Прочитай `n` и заполни `int[] a = new int[n];` через `sc.nextInt()`."
  - "Первый проход: `int min = a[0];` и `if (a[i] < min) min = a[i];`."
  - 'Второй проход: `if (a[i] == min) System.out.println("a[" + i + "] = " + a[i]);`.'
sampleInput: |
  6
  3 -2 7 -2 5 -2
quiz:
  question: Сколько строк вида a[i] = ... выведет программа для ввода 4 и 1 1 1 1?
  options:
    - "1"
    - "4"
    - "0"
    - "2"
  correct: 1
  hint: Все четыре числа равны минимуму.
exam:
  - q: Почему минимум ищут с min = a[0], а не с min = 0?
    options:
      - Ноля может не быть в массиве
      - a[0] всегда самый маленький
      - Так быстрее
      - Иначе не скомпилируется
    correct: 0
    explain: Если все числа больше нуля, min = 0 так и останется нулём, хотя такого элемента нет.
    advice: Стартовое значение — всегда одно из чисел массива.
  - q: Почему повторы минимума выводят вторым циклом?
    options:
      - Окончательный минимум известен только после просмотра всего массива
      - Второй цикл работает быстрее
      - Первый цикл не может ничего печатать
      - Так массив не изменится
    correct: 0
    explain: В массиве 3, -2, 7, -5 число -2 сначала выглядит минимумом, но потом находится -5.
    advice: Покажи это на примере, где минимум меняется в середине массива.
  - q: Что будет, если во втором цикле написать if (a[i] = min)?
    options:
      - Ошибка компиляции
      - Выведутся все элементы
      - Выведется только первый минимум
      - Массив заполнится минимумом
    correct: 0
    explain: = — присваивание, а if ждёт boolean. Сравнение пишется ==.
    advice: "Компилятор скажет: incompatible types: int cannot be converted to boolean."
memory:
  note: "Момент после первого прохода при вводе 6 и 3 -2 7 -2 5 -2."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 6
        - int[] a → массив в куче
        - int min = -2
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[6]
      data: "3, -2, 7, -2, 5, -2"
tests:
  - name: Наименьший встречается трижды
    stdin: |
      6
      3 -2 7 -2 5 -2
    stdout: |
      Наименьший элемент: -2
      a[1] = -2
      a[3] = -2
      a[5] = -2
    match: tokens
  - name: Один наименьший
    stdin: |
      5
      4 -5 0 6 8
    stdout: |
      Наименьший элемент: -5
      a[1] = -5
    match: tokens
  - name: Все элементы равны
    stdin: |
      3
      7 7 7
    stdout: |
      Наименьший элемент: 7
      a[0] = 7
      a[1] = 7
      a[2] = 7
    match: tokens
