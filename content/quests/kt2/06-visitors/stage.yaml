id: visitors
title: "Посетители 7 × 4: самый загруженный и свободный день"
hints:
  - "Прочитай таблицу `int[][] visits = new int[7][4];` из ввода и заведи `int[] sums = new int[7];`."
  - "Для каждого дня `i`: `int sum = 0;`, внутренний цикл по неделям складывает `visits[i][j]`, потом `sums[i] = sum;` и печать `days[i] + \": \" + sum`."
  - "По массиву `sums` найди `maxDay` и `minDay` (знаки `>` и `<`) и выведи `days[maxDay] + \" (\" + sums[maxDay] + \")\"`."
sampleInput: |
  30 25 35 30
  20 25 30 20
  40 35 30 45
  35 40 30 35
  60 55 70 65
  100 110 95 105
  80 75 90 85
quiz:
  question: Что в этой задаче означает сумма строки таблицы visits?
  options:
    - Сколько посетителей было в этот день недели за весь месяц
    - Сколько посетителей было за неделю
    - Сколько дней в неделе
    - Среднее число посетителей
  correct: 0
  hint: Строка — день недели, в ней 4 числа — по одному за каждую неделю.
exam:
  - q: Сколько ячеек в массиве new int[7][4] и что они значат?
    options:
      - 28 — посетители в каждый день каждой недели
      - 11 — дни и недели
      - 7 — дни недели
      - 4 — недели месяца
    correct: 0
    explain: 7 строк по 4 столбца. Ячейка visits[i][j] — посетители в день i на неделе j.
    advice: Проговори на защите, что значат строка и столбец.
  - q: Как вывести название дня по его индексу?
    options:
      - Взять days[maxDay] из массива названий
      - Напечатать maxDay
      - Напечатать visits[maxDay]
      - Написать switch по числу
    correct: 0
    explain: Индекс строки таблицы совпадает с индексом названия в массиве days.
    advice: Массив названий короче и надёжнее, чем switch на семь веток.
  - q: Как заполнить таблицу случайными числами от 10 до 100?
    options:
      - visits[i][j] = rnd.nextInt(91) + 10
      - visits[i][j] = rnd.nextInt(100)
      - visits[i][j] = rnd.nextInt(90) + 10
      - visits[i][j] = rnd.nextInt(10) + 100
    correct: 0
    explain: В диапазоне 10..100 — 91 число. nextInt(91) даёт 0..90, плюс 10 — 10..100.
    advice: "Формула для диапазона от a до b: rnd.nextInt(b - a + 1) + a."
memory:
  note: Момент после подсчёта сумм при вводе из примера.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - String[] days → массив в куче
        - int[][] visits → массив строк в куче
        - int[] sums → массив в куче
  heap:
    - obj: String[7]
      data: "Понедельник, Вторник, Среда, Четверг, Пятница, Суббота, Воскресенье"
    - obj: int[7][4]
      data: 28 чисел из ввода, по строке на день.
    - obj: int[7] (sums)
      data: "120, 95, 150, 140, 250, 410, 330"
tests:
  - name: Посетители из примера
    stdin: |
      30 25 35 30
      20 25 30 20
      40 35 30 45
      35 40 30 35
      60 55 70 65
      100 110 95 105
      80 75 90 85
    stdout: |
      Понедельник: 120
      Вторник: 95
      Среда: 150
      Четверг: 140
      Пятница: 250
      Суббота: 410
      Воскресенье: 330
      Самый загруженный день: Суббота (410)
      Самый свободный день: Вторник (95)
  - name: Одинаковые суммы — берётся первый день
    stdin: |
      50 50 50 50
      10 10 10 10
      10 10 10 10
      20 20 20 20
      30 30 30 30
      40 40 40 40
      50 50 50 50
    stdout: |
      Понедельник: 200
      Вторник: 40
      Среда: 40
      Четверг: 80
      Пятница: 120
      Суббота: 160
      Воскресенье: 200
      Самый загруженный день: Понедельник (200)
      Самый свободный день: Вторник (40)
  - kind: source
    name: Таблица 7 на 4
    pattern: new\s+int\s*\[\s*7\s*\]\s*\[\s*4\s*\]
    message: "Создай таблицу: int[][] visits = new int[7][4]; — 7 дней по 4 недели"
