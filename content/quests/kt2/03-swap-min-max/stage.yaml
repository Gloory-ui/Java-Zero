id: swap-min-max
title: Обмен наибольшего и наименьшего элементов
hints:
  - 'Вывод массива: `System.out.print("До: {");`, элементы через `", "` (запятая перед всеми, кроме первого), в конце `System.out.println("}");`.'
  - "Один цикл, два условия: `if (a[i] > a[maxIndex]) maxIndex = i;` и `if (a[i] < a[minIndex]) minIndex = i;`."
  - "Обмен: `int temp = a[maxIndex]; a[maxIndex] = a[minIndex]; a[minIndex] = temp;`, потом вывод с `После: {`."
sampleInput: |
  5
  4 -5 0 6 8
quiz:
  question: Какие индексы у наибольшего и наименьшего элементов в {4, -5, 0, 6, 8}?
  options:
    - maxIndex = 4, minIndex = 1
    - maxIndex = 8, minIndex = -5
    - maxIndex = 3, minIndex = 0
    - maxIndex = 1, minIndex = 4
  correct: 0
  hint: "Индекс — номер ячейки: 8 стоит в ячейке 4, −5 — в ячейке 1."
exam:
  - q: Зачем для обмена нужна переменная temp?
    options:
      - Первое присваивание затирает одно из значений, temp его сохраняет
      - Без неё массив нельзя изменить
      - Так требует компилятор
      - Она ускоряет обмен
    correct: 0
    explain: После a[maxIndex] = a[minIndex] старое значение максимума потеряно. temp держит его до второго присваивания.
    advice: Покажи обмен на двух стаканах с разной водой и пустом третьем.
  - q: Что произойдёт, если в массиве один элемент?
    options:
      - maxIndex и minIndex равны 0, обмен ничего не изменит
      - Программа упадёт
      - Обмен удалит элемент
      - Компилятор не пропустит такой массив
    correct: 0
    explain: Элемент меняется местами сам с собой — массив остаётся прежним.
    advice: Граничные случаи — один элемент, все равны — любят спрашивать на защите.
  - q: Какой максимум найдёт поиск со знаком > в {7, 2, 7}?
    options:
      - Первый, индекс 0
      - Последний, индекс 2
      - Оба сразу
      - Никакой
    correct: 0
    explain: Вторая семёрка не больше первой, поэтому maxIndex остаётся 0.
    advice: Со знаком >= запомнился бы последний максимум.
memory:
  note: "Момент после обмена при вводе 5 и 4 -5 0 6 8."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 5
        - int[] a → массив в куче
        - int maxIndex = 4
        - int minIndex = 1
        - int temp = 8
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[5]
      data: "4, 8, 0, 6, -5"
tests:
  - name: Пример из билета
    stdin: |
      5
      4 -5 0 6 8
    stdout: |
      До: {4, -5, 0, 6, 8}
      После: {4, 8, 0, 6, -5}
  - name: Наибольший первый, наименьший второй
    stdin: |
      4
      9 1 5 3
    stdout: |
      До: {9, 1, 5, 3}
      После: {1, 9, 5, 3}
  - name: Повторы — меняются первые наибольший и наименьший
    stdin: |
      5
      2 7 1 7 1
    stdout: |
      До: {2, 7, 1, 7, 1}
      После: {2, 1, 7, 7, 1}
  - name: Один элемент
    stdin: |
      1
      5
    stdout: |
      До: {5}
      После: {5}
