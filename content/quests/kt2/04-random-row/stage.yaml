id: random-row
title: Таблица 5 × 6 из случайных чисел и её третья строка
hints:
  - "Создай `Random rnd = new Random();` и `int[][] t = new int[5][6];`, заполни вложенными циклами: `t[i][j] = rnd.nextInt(100);`."
  - 'Всю таблицу печатай, как на этапе про двумерный массив: `System.out.print(t[i][j] + " ");`, после строки — `System.out.println();`.'
  - 'Третья строка — индекс 2: `System.out.print("Третья строка:");` и цикл по `j` с `" " + t[2][j]`.'
quiz:
  question: Какой индекс у третьей строки двумерного массива?
  options:
    - "3"
    - "2"
    - "1"
    - "0"
  correct: 1
  hint: Строки нумеруются с нуля — 0, 1, 2.
exam:
  - q: Сколько чисел в таблице new int[5][6]?
    options:
      - "30"
      - "11"
      - "5"
      - "6"
    correct: 0
    explain: 5 строк по 6 столбцов — 30 ячеек.
    advice: Первое число — строки, второе — столбцы.
  - q: Какие числа даёт rnd.nextInt(100)?
    options:
      - от 0 до 99
      - от 1 до 100
      - от 0 до 100
      - от 1 до 99
    correct: 0
    explain: nextInt(k) возвращает k разных чисел, начиная с нуля. Сама граница 100 не выпадает.
    advice: "Диапазон от a до b: rnd.nextInt(b - a + 1) + a."
  - q: Сколько раз выполнится цикл, печатающий одну строку таблицы 5 × 6?
    options:
      - "6"
      - "5"
      - "30"
      - "11"
    correct: 0
    explain: В строке 6 столбцов. Номер строки фиксирован, меняется только j.
    advice: Для одной строки нужен один цикл, для всей таблицы — два вложенных.
memory:
  note: Момент после заполнения таблицы. Числа — пример одного запуска.
  stack:
    - method: main()
      vars:
        - Random rnd → объект в куче
        - int[][] t → массив строк в куче
  heap:
    - obj: Random
      data: Генератор случайных чисел.
    - obj: int[5][6]
      data: "Строка 2 (третья): 17, 88, 42, 5, 71, 30"
tests:
  - name: Третья строка из шести чисел от 0 до 99
    stdout: '^Третья строка:([ \t]+([0-9]|[1-9][0-9])){6}[ \t]*$'
    match: regex
  - kind: source
    name: Таблица 5 на 6
    pattern: new\s+int\s*\[\s*5\s*\]\s*\[\s*6\s*\]
    message: "Создай таблицу: int[][] t = new int[5][6];"
  - kind: source
    name: Случайные числа через Random или Math.random
    pattern: new\s+Random\s*\(|Math\.random\s*\(
    message: "Создай генератор: Random rnd = new Random();"
