id: even-and-triple
title: "Числа от 1 до 30: Четность и кратность 3"
hints:
  - "Самое строгое условие проверяй первым: число кратно и 2, и 3 одновременно."
  - "Цепочка: `if (i % 2 == 0 && i % 3 == 0)` … `else if (i % 2 == 0)` … `else if (i % 3 == 0)` … `else`."
  - 'Печать с подписью: `System.out.println(i + " Четное и кратное 3");` — пробел перед словом стоит внутри кавычек.'
quiz:
  question: Что программа должна вывести для числа 6?
  options:
    - 6 Четное
    - 6 Кратное 3
    - 6 Четное и кратное 3
    - "6"
  correct: 2
  hint: 6 делится и на 2, и на 3.
exam:
  - q: Почему условие (i % 2 == 0 && i % 3 == 0) обязано стоять первым в конструкции if-else?
    options:
      - Потому что логическое 'И' выполняется быстрее
      - Потому что если поставить первым (i % 2 == 0), условие выполнится для числа 6, управление выйдет из if-else, и до двойной проверки код никогда не дойдет
      - Это требование стандарта Java
      - Иначе компилятор выдаст ошибку unreachable code
    correct: 1
    explain: В цепочке if - else if выполняется только ПЕРВАЯ истинная ветка. Более строгие составные условия всегда должны стоять раньше частных.
    advice: Всегда ставь составные проверки выше простых.
  - q: Что выведет программа для числа 9?
    options:
      - 9 Кратное 3
      - 9 Четное
      - "9"
      - 9 Четное и кратное 3
    correct: 0
    explain: 9 не делится на 2, но делится на 3. Первые две ветки ложны, срабатывает третья.
    advice: Проверь вручную несколько чисел по цепочке условий.
  - q: Сколько чисел от 1 до 30 получат подпись «Четное и кратное 3»?
    options:
      - "5"
      - "10"
      - "15"
      - "3"
    correct: 0
    explain: "Это числа, кратные 6: 6, 12, 18, 24, 30."
    advice: Кратное и 2, и 3 — то же, что кратное 6.
memory:
  note: "Последний круг: 30 делится и на 2, и на 3, поэтому сработала первая ветка цепочки."
  stack:
    - method: main()
      vars:
        - int i = 30
  heap: []
tests:
  - name: Подписывает чётные и кратные 3 от 1 до 30
    stdout: |
      1
      2 Четное
      3 Кратное 3
      4 Четное
      5
      6 Четное и кратное 3
      7
