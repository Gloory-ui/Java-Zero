      9 Кратное 3
      10 Четное
      11
      12 Четное и кратное 3
      13
      14 Четное
      15 Кратное 3
      16 Четное
      17
      18 Четное и кратное 3
      19
      20 Четное
      21 Кратное 3
      22 Четное
      23
      24 Четное и кратное 3
      25
