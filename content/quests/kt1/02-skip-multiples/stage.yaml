id: skip-multiples
title: Числа 1..50 без кратных 5 и 7, стоп на 41
hints:
  - "Порядок проверок в теле цикла: сначала стоп на 41, потом пропуск кратных, потом печать."
  - "Кратно 5 или 7: `i % 5 == 0 || i % 7 == 0` — `||` значит «или»."
  - "`if (i == 41) break;` и `if (i % 5 == 0 || i % 7 == 0) continue;` стоят перед `System.out.println(i);`."
quiz:
  question: Будет ли выведено число 35 в этом задании?
  options:
    - Да
    - Нет, так как 35 кратно 5 и 7 (сработает continue)
    - Вызовет ошибку
    - Завершит цикл
  correct: 1
  hint: 35 делится и на 5, и на 7 без остатка.
exam:
  - q: Почему при достижении числа 41 цикл завершается и 41 не выводится?
    options:
      - Потому что 41 кратно 5
      - Потому что условие if (i == 41) break срабатывает до инструкции вывода System.out.println
      - В Java нельзя выводить простые числа
      - Это особенность компилятора
    correct: 1
    explain: Когда i становится равным 41, оператор break немедленно прерывает цикл, поэтому 41 на экран не попадает.
    advice: Четко объясни преподавателю порядок выполнения строк в теле цикла.
  - q: Будет ли выведено число 40?
    options:
      - "Нет: 40 кратно 5"
      - Да
      - "Нет: цикл остановится раньше"
      - Да, дважды
    correct: 0
    explain: 40 % 5 == 0, поэтому continue пропустит его. Стоп на 41 наступит на следующем круге.
    advice: Проверяй граничные числа перед защитой.
  - q: Почему условие пропуска записывают через ||, а не через &&?
    options:
      - "Пропускаем числа, кратные хотя бы одному: 5 или 7"
      - "&& не работает с %"
      - "|| быстрее"
      - Разницы нет
    correct: 0
    explain: С && пропустились бы только числа, кратные и 5, и 7 одновременно, — 35. А 10 или 14 вывелись бы.
    advice: «Или» — хотя бы одно условие, «и» — все сразу.
memory:
  note: "Момент, когда сработал break: i равно 41, поэтому числа после 40 не напечатаны."
  stack:
    - method: main()
      vars:
        - int i = 41
  heap: []
tests:
  - name: Числа до 40 без кратных 5 и 7, стоп на 41
    stdout: |
      1
      2
      3
      4
      6
      8
      9
      11
      12
      13
      16
      17
      18
      19
      22
      23
      24
      26
      27
      29
      31
      32
      33
      34
      36
      37
      38
      39
    match: tokens
  - kind: source
    name: Выход из цикла через break
    pattern: \bbreak\s*;
    message: Останови цикл оператором break
  - kind: source
    name: Пропуск итерации через continue
    pattern: \bcontinue\s*;
    message: Пропусти итерацию оператором continue
