id: guess-number
title: Игра «Угадай число» с лимитом попыток
hints:
  - "Цикл `while (attempts < maxAttempts)`: в начале каждого круга увеличь `attempts` и прочитай число `int guess = sc.nextInt();`."
  - "Сравни `guess` с `target`: равно — «Угадал!» и `break;`; меньше — «больше»; иначе — «меньше»."
  - "«больше» значит «загаданное число больше твоего»: эта подсказка печатается, когда `guess < target`."
sampleInput: |
  10
  90
  42
quiz:
  question: Что выводит программа, если пользователь ввел 20, а загадано 50?
  options:
    - меньше
    - больше
    - ошибка
    - выход
  correct: 1
  hint: "Загаданное число 50 больше введенного 20, поэтому подсказка: «больше»."
exam:
  - q: Какой цикл лучше всего подходит для игры 'Угадай число' с ограничением попыток?
    options:
      - Только бесконечный цикл без условий
      - while (attempts < maxAttempts) или for (int i = 1; i <= maxAttempts; i++) с прерыванием break при победе
      - Рекурсия без базового случая
      - Оператор switch
    correct: 1
    explain: Цикл while или for с ограничением по счетчику гарантирует, что программа завершится, даже если пользователь не угадал число.
    advice: Объясни преподавателю условие остановки цикла.
  - q: Что делает break после «Угадал!»?
    options:
      - Выходит из цикла, чтобы не просить новые догадки
      - Завершает программу с ошибкой
      - Пропускает одну попытку
      - Сбрасывает счётчик попыток
    correct: 0
    explain: Число угадано — игра окончена. Без break цикл продолжил бы читать ввод до конца лимита.
    advice: break — выход из цикла, программа продолжается после него.
  - q: Где увеличивать attempts, чтобы лимит попыток работал?
    options:
      - В каждом круге цикла
      - Только когда пользователь угадал
      - До цикла
      - После цикла
    correct: 0
    explain: Каждый круг — одна попытка. Если счётчик не растёт, при неверных догадках цикл никогда не закончится.
    advice: Проверь программу на пяти неверных догадках подряд.
memory:
  note: "Момент победы при вводе 10, 90, 42: третья попытка угадала. Сам Scanner — объект в куче, в стеке лежит только ссылка на него."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int target = 42
        - int maxAttempts = 5
        - int attempts = 3
        - int guess = 42
  heap:
    - obj: Scanner
      data: "Читает числа из ввода по одному: 10, потом 90, потом 42."
tests:
  - name: Подсказки и победа с третьей попытки
    stdin: |
      10
      90
      42
    stdout: |
      больше
      меньше
      Угадал!
  - name: Угадывает с первой попытки
    stdin: |
      42
    stdout: |
      Угадал!
  - name: Останавливается после пяти попыток
    stdin: |
      1
      1
      1
      1
      1
      1
    stdout: |
      больше
      больше
      больше
      больше
      больше
  - kind: source
    name: Ввод через Scanner
    pattern: new\s+Scanner\s*\(\s*System\.in\s*\)
    message: Создай Scanner sc = new Scanner(System.in)
