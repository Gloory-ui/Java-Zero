id: abstract
title: Абстрактные классы
hints:
  - "`Shape` абстрактный: у него есть `area()` и `name()`, но без тела. Каждая фигура обязана их реализовать."
  - 'Площадь треугольника — основание на высоту пополам: `return base * height / 2;`, имя — `"Треугольник"`.'
  - 'Квадрат — это прямоугольник с равными сторонами: `class Square extends Rectangle`, в конструкторе `super(side, side);`, а `name()` возвращает `"Квадрат"`.'
quiz:
  question: Можно ли написать new Shape(), если Shape — абстрактный класс?
  options:
    - "Нет: абстрактный класс — только основа для наследников"
    - Да, как обычный класс
    - Да, но площадь будет 0
    - Только внутри main
  correct: 0
  hint: У абстрактного класса могут быть методы без тела — такой объект нельзя было бы использовать.
exam:
  - q: Что обязан сделать обычный (не абстрактный) наследник абстрактного класса?
    options:
      - Реализовать все абстрактные методы родителя
      - Переопределить все методы родителя
      - Объявить свой конструктор
      - Ничего, это необязательно
    correct: 0
    explain: Иначе у объекта наследника остался бы метод без тела. Компилятор сообщит «must implement the inherited abstract method».
    advice: "abstract-метод — это обещание: «наследник это напишет»."
  - q: Зачем делать Shape абстрактным, а не обычным классом с area(), возвращающим 0?
    options:
      - Чтобы нельзя было создать «просто фигуру» и забыть реализовать площадь в наследнике
      - Абстрактные классы работают быстрее
      - Так короче писать
      - Разницы нет
    correct: 0
    explain: Площадь абстрактной фигуры бессмысленна. abstract запрещает такие объекты и заставляет каждый вид фигуры посчитать площадь по-своему.
    advice: Если у метода нет разумной общей реализации — делай его абстрактным.
  - q: Может ли в абстрактном классе быть обычный метод с телом?
    options:
      - Да, абстрактный класс может содержать и обычные методы
      - Нет, только абстрактные
      - Только статические
      - Только конструктор
    correct: 0
    explain: Абстрактный класс — это обычный класс, у которого есть хотя бы запрет на new. Он может хранить поля, конструкторы и готовые методы для всех наследников.
    advice: Общий код — в абстрактного родителя, особенный — в наследников.
memory:
  note: Момент после цикла. В массиве Shape[] лежат настоящие фигуры; объекта «просто Shape» в куче нет и быть не может.
  stack:
    - method: main(String[] args)
      vars:
        - Shape[] shapes → массив в куче
        - double total = 52.0
  heap:
    - obj: Shape[3]
      data: ссылки на Rectangle, Triangle и Square
    - obj: Rectangle
      data: width = 3.0, height = 4.0
    - obj: Triangle
      data: base = 6.0, height = 5.0
    - obj: Square
      data: width = 5.0, height = 5.0 — поля от Rectangle
tests:
  - name: Площади фигур
    stdout: |
      Прямоугольник: 12.0
      Треугольник: 15.0
      Квадрат: 25.0
      Общая площадь: 52.0
  - kind: source
    name: Квадрат — это прямоугольник
    pattern: class\s+Square\s+extends\s+Rectangle
    message: "Унаследуй квадрат от прямоугольника: class Square extends Rectangle"
