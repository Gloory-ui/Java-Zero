id: super
title: "super(...): передать данные родителю"
hints:
  - Имя и возраст хранит `Animal`, и заполняет их его конструктор. `Cat` должна передать ему `name` и `age`.
  - Вызов конструктора родителя — `super(name, age);`. Он обязан быть первой строкой конструктора `Cat`.
  - 'После `super(name, age);` запиши своё поле: `this.color = color;`. Заглушку `super("?", 0);` убери.'
quiz:
  question: Где в конструкторе наследника должен стоять вызов super(...)?
  options:
    - Первой строкой
    - Последней строкой
    - Где угодно
    - Только в методе main
  correct: 0
  hint: Сначала строится часть родителя, потом всё остальное.
exam:
  - q: Что будет, если у Animal есть только конструктор Animal(String name, int age), а в Cat(...) не вызвать super(...)?
    options:
      - "Ошибка компиляции: Java попробует вызвать Animal(), а его нет"
      - name и age станут null и 0
      - Java сама передаст параметры
      - Программа упадёт при запуске
    correct: 0
    explain: Без явного super(...) компилятор подставляет super() без аргументов. Конструктора без параметров у Animal нет — ошибка «Implicit super constructor Animal() is undefined».
    advice: Если у родителя нет конструктора без параметров, super(...) в наследнике обязателен.
  - q: Чем super отличается от this?
    options:
      - super обращается к части родителя, this — к текущему объекту
      - Это одно и то же
      - super — для статических полей, this — для обычных
      - super работает только в main
    correct: 0
    explain: this — ссылка на сам объект, super — на его родительскую часть. super(...) вызывает конструктор родителя, this.color — поле текущего объекта.
    advice: super — «вверх по наследованию», this — «я сам».
  - q: Зачем передавать name в super, а не присвоить this.name = name прямо в Cat?
    options:
      - Родитель сам решает, как заполнить и проверить свои поля; код не повторяется
      - Иначе программа будет медленнее
      - this.name в наследнике писать запрещено
      - Разницы нет, super нужен для красоты
    correct: 0
    explain: Конструктор Animal может проверять возраст или считать животных. Если каждый наследник заполняет поля сам, эти проверки придётся копировать.
    advice: Поля родителя пусть заполняет родитель.
memory:
  note: Момент после создания второй кошки. У каждого объекта свои name, age от Animal и color от Cat.
  stack:
    - method: main(String[] args)
      vars:
        - Cat murka → объект в куче
        - Cat snow → объект в куче
  heap:
    - obj: Cat
      data: name = "Мурка", age = 2 (заполнил Animal через super), color = "рыжий"
    - obj: Cat
      data: name = "Снежок", age = 5, color = "белый"
tests:
  - name: Кошки с окрасом
    stdout: |
      Мурка, 2 г., окрас: рыжий
      Снежок, 5 г., окрас: белый
  - kind: source
    name: Конструктор родителя через super
    pattern: super\s*\(\s*name\s*,\s*age\s*\)
    message: "Передай имя и возраст родителю: super(name, age);"
