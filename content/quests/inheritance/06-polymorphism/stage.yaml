id: polymorphism
title: "Полиморфизм: один вызов — разное поведение"
hints:
  - Пройди по массиву `zoo` циклом `for` с индексом и у каждого элемента вызови `speak()`. Java сама выберет версию кошки или собаки.
  - "Чтобы посчитать кошек, проверь тип объекта: `if (zoo[i] instanceof Cat) cats++;`."
  - "Цикл: `for (int i = 0; i < zoo.length; i++) { zoo[i].speak(); if (zoo[i] instanceof Cat) cats++; }`, после цикла — строка с количеством."
quiz:
  question: Animal a = new Cat("Мурка"); a.speak(); — чья версия speak() сработает?
  options:
    - Версия Cat
    - Версия Animal
    - Обе по очереди
    - Ошибка компиляции
  correct: 0
  hint: Решает класс объекта, а не тип переменной.
exam:
  - q: Почему в массив Animal[] можно положить Cat и Dog?
    options:
      - "Кошка и собака — это животные: ссылка родительского типа может указывать на наследника"
      - Java сама превращает их в Animal
      - Массивы в Java могут хранить что угодно
      - Так нельзя, будет ошибка
    correct: 0
    explain: Наследник «является» родителем. Поэтому переменная или ячейка типа Animal может указывать на Cat или Dog.
    advice: Родительский тип — общая «рамка», в которую помещаются все наследники.
  - q: Animal a = new Cat("Мурка"). Можно ли вызвать a.meow(), если meow() есть только у Cat?
    options:
      - "Нет: по типу переменной Animal компилятор видит только методы Animal"
      - Да, объект ведь кошка
      - Да, но только внутри цикла
      - Нет, программа упадёт при запуске
    correct: 0
    explain: "Компилятор проверяет вызовы по типу переменной. Нужно сначала проверить instanceof и привести тип: ((Cat) a).meow()."
    advice: Тип переменной решает, что можно вызвать, класс объекта — какая версия сработает.
  - q: Что вернёт zoo[i] instanceof Cat, если в ячейке собака?
    options:
      - "false"
      - "true"
      - Ошибку компиляции
      - "null"
    correct: 0
    explain: instanceof проверяет, является ли объект экземпляром класса (или его наследника). Собака — не кошка.
    advice: instanceof отвечает на вопрос «этот объект — такой-то?».
memory:
  note: Момент после цикла. Массив хранит ссылки типа Animal, но объекты в куче — настоящие Cat и Dog.
  stack:
    - method: main(String[] args)
      vars:
        - Animal[] zoo → массив в куче
        - int cats = 2
  heap:
    - obj: Animal[3]
      data: "три ссылки: на Cat, Dog и Cat"
    - obj: Cat
      data: name = "Барсик"
    - obj: Dog
      data: name = "Шарик"
    - obj: Cat
      data: name = "Мурка"
tests:
  - name: Зоопарк
    stdout: |
      Барсик: Мяу
      Шарик: Гав!
      Мурка: Мяу
      Котов в зоопарке: 2
  - kind: source
    name: Проверка типа
    pattern: instanceof\s+Cat
    message: Посчитай кошек через instanceof Cat
