id: init-order
title: Статические поля и порядок инициализации
hints:
  - Счётчик — общий для всех объектов, поэтому он `static`. Увеличивать его нужно там, где рождается каждый объект, — в конструкторе.
  - В конструкторе `Animal()` напиши `count++;`, в конструкторе `Cat()` — `catCount++;`.
  - При `new Cat()` сработают оба конструктора, поэтому кошка попадёт и в `count`, и в `catCount`. `main` менять не нужно.
quiz:
  question: "Что Java подготовит раньше при первом new Cat(): статические поля или обычные поля Animal?"
  options:
    - Статические поля Animal и Cat
    - Обычные поля Animal
    - Конструктор Cat
    - Всё одновременно
  correct: 0
  hint: Статические поля принадлежат классу, и класс готовится раньше любого объекта.
exam:
  - q: Сколько копий статического поля count существует, если создано пять кошек?
    options:
      - Одна на весь класс
      - Пять, по одной на объект
      - "Две: у Animal и у Cat"
      - Ни одной, пока не вызван main
    correct: 0
    explain: static — поле класса, а не объекта. Все объекты видят одну и ту же ячейку.
    advice: static — «общее на всех».
  - q: В каком порядке выполнится код при new Cat(), если у обоих классов есть static-поля, обычные поля и конструкторы?
    options:
      - static Animal → static Cat → поля Animal → конструктор Animal → поля Cat → конструктор Cat
      - конструктор Cat → конструктор Animal → поля → static
      - поля Cat → поля Animal → static
      - static Cat → static Animal → конструкторы
    correct: 0
    explain: "Сначала готовятся классы (статика родителя, потом наследника), затем объект: часть родителя целиком, потом часть наследника."
    advice: Класс раньше объекта, родитель раньше наследника.
  - q: Сработает ли статическая инициализация Animal второй раз при втором new Cat()?
    options:
      - Нет, класс готовится один раз
      - Да, при каждом new
      - Только если поменять поле
      - Да, но без вывода
    correct: 0
    explain: Статические поля инициализируются один раз, при первом обращении к классу. Дальше новые объекты их не пересоздают.
    advice: Счётчик не обнуляется между объектами именно поэтому.
memory:
  note: Момент перед выводом. Статические счётчики лежат отдельно от объектов, по одной ячейке на класс.
  stack:
    - method: main(String[] args)
      vars:
        - "объекты созданы без переменных: new Cat(), new Cat(), new Animal()"
  heap:
    - obj: Animal (статика класса)
      data: count = 3 — одна ячейка на все объекты
    - obj: Cat (статика класса)
      data: catCount = 2
    - obj: Cat
      data: первый объект
    - obj: Cat
      data: второй объект
    - obj: Animal
      data: третий объект
tests:
  - name: Счётчики
    stdout: |
      Животных: 3
      Котов: 2
  - kind: source
    name: Счётчик растёт в конструкторе
    pattern: count\s*(\+\+|\+=\s*1)
    message: "Увеличь счётчик в конструкторе: count++;"
