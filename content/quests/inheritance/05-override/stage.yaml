id: override
title: Переопределение методов и @Override
hints:
  - "Кошка и собака говорят по-своему. В каждом наследнике объяви метод с той же сигнатурой, что у родителя: `void speak()`."
  - "Над методом поставь `@Override`: компилятор проверит, что ты действительно переопределяешь метод родителя, а не создаёшь новый."
  - 'У собаки сначала звучит общий звук, потом свой: `super.speak();` и `System.out.println(name + ": Гав!");`.'
quiz:
  question: Что делает аннотация @Override?
  options:
    - Просит компилятор проверить, что метод действительно переопределяет метод родителя
    - Делает метод статическим
    - Запрещает переопределять метод дальше
    - Вызывает метод родителя
  correct: 0
  hint: Это страховка от опечатки в имени или параметрах.
exam:
  - q: Метод в Cat назван spek() вместо speak(), без @Override. Что будет?
    options:
      - "Скомпилируется, но кошка при speak() скажет звук родителя: spek — отдельный новый метод"
      - Ошибка компиляции
      - Java сама исправит опечатку
      - Программа упадёт при запуске
    correct: 0
    explain: Без @Override компилятор не знает, что ты хотел переопределить speak(). Появится новый метод spek, а speak останется родительским.
    advice: "Ставь @Override всегда, когда переопределяешь: тогда опечатка станет ошибкой компиляции."
  - q: Что делает super.speak() внутри переопределённого speak() у Dog?
    options:
      - Вызывает версию speak() из Animal
      - Вызывает speak() у Dog ещё раз
      - Создаёт новый объект Animal
      - Вызывает конструктор родителя
    correct: 0
    explain: super.метод() — это вызов родительской версии метода. Так наследник дополняет поведение родителя, а не заменяет его целиком.
    advice: super(...) — конструктор родителя, super.метод() — метод родителя.
  - q: Какой метод сработает при new Animal("Ёжик").speak(), если Cat переопределил speak()?
    options:
      - speak() из Animal
      - speak() из Cat
      - Оба по очереди
      - Никакой, будет ошибка
    correct: 0
    explain: Объект — Animal, а не Cat. Переопределение в наследнике на родителя не влияет.
    advice: Какой метод сработает, решает класс объекта.
memory:
  note: Момент вызова speak() у собаки. Её метод сначала вызвал родительскую версию через super.
  stack:
    - method: Animal.speak()
      vars:
        - this → объект Dog «Шарик»
    - method: Dog.speak()
      vars:
        - ждёт возврата из super.speak()
    - method: main(String[] args)
      vars:
        - вызвал speak() у собаки
  heap:
    - obj: Cat
      data: name = "Барсик"
    - obj: Dog
      data: name = "Шарик"
    - obj: Animal
      data: name = "Ёжик"
tests:
  - name: Каждый говорит своё
    stdout: |
      Барсик: Мяу
      Шарик издаёт звук
      Шарик: Гав!
      Ёжик издаёт звук
  - kind: source
    name: Переопределение с @Override
    pattern: "@Override\\s+(public\\s+)?void\\s+speak"
    message: Переопредели speak() и поставь над ним @Override
  - kind: source
    name: Собака зовёт родителя
    pattern: super\s*\.\s*speak\s*\(
    message: "У собаки сначала вызови общий звук: super.speak();"
