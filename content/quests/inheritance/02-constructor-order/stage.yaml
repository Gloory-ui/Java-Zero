id: constructor-order
title: "Кто строится первым: конструкторы родителя и наследника"
hints:
  - "Конструктор — метод с именем класса и без типа результата. Нужны два: `Animal()` и `Cat()`."
  - 'Внутри каждого — одна строка вывода: `System.out.println("Отработал конструктор Animal");` и такая же для Cat с восклицательным знаком.'
  - "`main` уже готов. При `new Cat()` Java сама сначала вызовет `Animal()`, потом `Cat()` — вызывать родителя руками не нужно."
quiz:
  question: Класс Cat extends Animal. В каком порядке выполнятся конструкторы при new Cat()?
  options:
    - Сначала Cat, потом Animal
    - Сначала Animal, потом Cat
    - Только Cat
    - В случайном порядке
  correct: 1
  hint: Сначала строится «основание» — часть объекта от родителя.
exam:
  - q: Почему конструктор родителя выполняется раньше конструктора наследника?
    options:
      - Наследник может опираться на поля родителя, поэтому они должны быть готовы заранее
      - Так конструкторы идут по алфавиту
      - Потому что родитель объявлен выше в файле
      - Это случайность, порядок не гарантирован
    correct: 0
    explain: Объект наследника содержит часть родителя. Конструктор Cat может использовать name или age, значит, Animal должен подготовить их первым.
    advice: "Думай о доме: сначала фундамент, потом этажи."
  - q: Сколько раз выполнится конструктор Animal, если создать два объекта Cat?
    options:
      - Два раза
      - Один раз
      - Ни разу
      - Четыре раза
    correct: 0
    explain: Каждый new Cat() строит новый объект, и у каждого своя часть Animal. Конструктор родителя срабатывает для каждого объекта.
    advice: Конструктор работает при каждом new.
  - q: Что выведет new Animal(), если конструктор Animal печатает строку?
    options:
      - Строку из конструктора Animal
      - Строки из конструкторов Animal и Cat
      - Ничего, конструкторы не печатают
      - Ошибку компиляции
    correct: 0
    explain: "Создаётся объект только Animal. Наследники тут ни при чём: родитель о них не знает."
    advice: Родитель не знает о своих наследниках, а наследник знает о родителе.
memory:
  note: Момент внутри new Cat(), когда конструктор Animal уже отработал, а Cat() ещё выполняется. Кадр Cat() лежит поверх main.
  stack:
    - method: Cat()
      vars:
        - this → строящийся объект Cat
    - method: main(String[] args)
      vars:
        - ждёт, пока new Cat() вернёт объект
  heap:
    - obj: Cat
      data: Часть от Animal уже построена, конструктор Cat печатает свою строку.
tests:
  - name: Порядок конструкторов
    stdout: |
      Отработал конструктор Animal
      Отработал конструктор Cat!
      ---
      Отработал конструктор Animal
  - kind: source
    name: Конструкторы объявлены
    pattern: Animal\s*\(\s*\)\s*\{[\s\S]*Cat\s*\(\s*\)\s*\{
    message: Объяви конструкторы Animal() и Cat()
