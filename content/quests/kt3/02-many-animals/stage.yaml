id: many-animals
title: Несколько животных из ввода
hints:
  - "Прочитай `int n = sc.nextInt();` и сделай цикл на `n` кругов."
  - "В цикле: `Animal animal = new Animal(sc.next(), sc.next(), sc.nextInt());` — аргументы читаются слева направо."
  - "Сразу после создания: `animal.printInfo();`."
sampleInput: |
  3
  Барсик кот 3
  Шарик собака 5
  Кеша попугай 2
quiz:
  question: Сколько объектов Animal создаст цикл из трёх кругов с new Animal(...) внутри?
  options:
    - "3"
    - "1"
    - "0"
    - "4"
  correct: 0
  hint: Каждый new — новый объект.
exam:
  - q: Почему переменная animal в цикле одна, а объектов несколько?
    options:
      - Каждый круг new создаёт новый объект, и переменная указывает уже на него
      - Переменная копирует все объекты
      - Объект один, у него меняются поля
      - Так нельзя, будет ошибка
    correct: 0
    explain: Переменная — ссылка. На каждом круге она перенаправляется на новое животное.
    advice: Чтобы сохранить всех животных, нужен массив — это задание 5.
  - q: В каком порядке выполняются sc.next(), sc.next(), sc.nextInt() в аргументах конструктора?
    options:
      - Слева направо
      - Справа налево
      - В случайном порядке
      - Сначала nextInt
    correct: 0
    explain: Java вычисляет аргументы слева направо, поэтому имя, вид и возраст читаются по порядку.
    advice: Для наглядности можно сначала прочитать значения в переменные.
  - q: Что читает sc.next()?
    options:
      - Одно слово до пробела
      - Всю строку
      - Одно число
      - Один символ
    correct: 0
    explain: next() берёт следующее слово. Поэтому вид из двух слов, например «морская свинка», так не прочитать.
    advice: Для строки с пробелами есть nextLine().
memory:
  note: Момент после создания второго животного при вводе из примера. Первое животное уже не нужно, ссылки на него нет.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 3
        - int i = 1
        - Animal animal → Шарик
  heap:
    - obj: Animal (Шарик)
      data: 'name = "Шарик", species = "собака", age = 5'
tests:
  - name: Три животных из примера
    stdin: |
      3
      Барсик кот 3
      Шарик собака 5
      Кеша попугай 2
    stdout: |
      Животное: Барсик, вид: кот, возраст: 3
      Животное: Шарик, вид: собака, возраст: 5
      Животное: Кеша, вид: попугай, возраст: 2
  - name: Одно животное
    stdin: |
      1
      Мурка кошка 7
    stdout: |
      Животное: Мурка, вид: кошка, возраст: 7
