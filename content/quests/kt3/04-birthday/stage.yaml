id: birthday
title: "День рождения: celebrateBirthday()"
hints:
  - "Метод без параметров: `void celebrateBirthday() { ... }` внутри класса `Animal`."
  - 'Сначала `age++;`, потом `System.out.println("С днём рождения, " + name + "! Теперь возраст: " + age);`.'
  - "В `main`: прочитай животное и `int birthdays = sc.nextInt();`, цикл с `animal.celebrateBirthday();`, в конце `animal.printInfo();`."
sampleInput: |
  Барсик кот 3 2
quiz:
  question: Что выведет printInfo() после двух вызовов celebrateBirthday() у животного трёх лет?
  options:
    - Возраст 5
    - Возраст 3
    - Возраст 4
    - Ошибку
  correct: 0
  hint: Каждый вызов увеличивает поле age на 1.
exam:
  - q: Почему celebrateBirthday() не нужен параметр age?
    options:
      - Метод работает с полем age своего объекта
      - Параметры в методах запрещены
      - Возраст хранится в main
      - Так быстрее
    correct: 0
    explain: Метод вызывают у конкретного животного, и он меняет именно его поле.
    advice: Параметр int age изменил бы только копию.
  - q: Что будет, если вывести сообщение до age++?
    options:
      - В сообщении окажется старый возраст
      - Возраст не изменится
      - Ошибка компиляции
      - Ничего не изменится
    correct: 0
    explain: Команды выполняются по порядку. До увеличения в поле ещё старое значение.
    advice: Сначала меняй состояние, потом сообщай о нём.
  - q: Видно ли изменение возраста в main после вызова метода?
    options:
      - Да, метод изменил сам объект, на который указывает переменная
      - Нет, изменения пропадают после метода
      - Только если метод вернул возраст
      - Только для static-полей
    correct: 0
    explain: Поле принадлежит объекту в куче. Метод и main работают с одним объектом.
    advice: Сравни с этапом про машину времени.
memory:
  note: Момент после второго праздника при вводе «Барсик кот 3 2».
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - Animal animal → объект в куче
        - int birthdays = 2
  heap:
    - obj: Animal
      data: 'name = "Барсик", species = "кот", age = 5, owner = null'
tests:
  - name: Два дня рождения
    stdin: |
      Барсик кот 3 2
    stdout: |
      С днём рождения, Барсик! Теперь возраст: 4
      С днём рождения, Барсик! Теперь возраст: 5
      Животное: Барсик, вид: кот, возраст: 5, хозяин: нет
  - name: Без праздников
    stdin: |
      Шарик собака 5 0
    stdout: |
      Животное: Шарик, вид: собака, возраст: 5, хозяин: нет
  - kind: source
    name: Метод celebrateBirthday()
    pattern: \bvoid\s+celebrateBirthday\s*\(\s*\)
    message: "Добавь в Animal метод void celebrateBirthday()"
