id: cards
title: Карточки животных и медицинская история
hints:
  - 'Поле `String medicalHistory = "Записей нет";`. Методы: `printShort(int number)` печатает `"[" + number + "] " + name + " (" + species + ", " + age + ")"`, `printCard()` — заголовок `"===== Карточка: " + name + " ====="` и строки «Вид», «Возраст», «Хозяин», «Медицинская история».'
  - 'Массив: `Animal[] shelter = { new Animal("Барсик", "кот", 3), ... };`, затем `shelter[0].medicalHistory = "Прививка от бешенства, 2025";`.'
  - 'Меню: `while (true) { System.out.println("Номер карточки (0 — выход):"); int number = sc.nextInt(); if (number == 0) break; ... }`, после цикла — «До свидания!».'
sampleInput: |
  2
  0
quiz:
  question: Какой элемент массива открывает карточка с номером 3?
  options:
    - shelter[2]
    - shelter[3]
    - shelter[1]
    - shelter[0]
  correct: 0
  hint: Номер карточки на 1 больше индекса.
exam:
  - q: Зачем полю medicalHistory значение по умолчанию «Записей нет»?
    options:
      - Чтобы у животного без истории не выводилось null
      - Так требует компилятор
      - Чтобы поле стало static
      - Без него массив не создать
    correct: 0
    explain: Без начального значения строковое поле равно null, и в карточке напечаталось бы «null».
    advice: Начальные значения полей задаются прямо в объявлении.
  - q: Как устроен выход из меню?
    options:
      - while (true) и break, когда введён 0
      - Цикл for на 10 кругов
      - Программа сама останавливается
      - return в printCard
    correct: 0
    explain: Сколько карточек откроют, заранее неизвестно, поэтому цикл бесконечный с выходом по условию.
    advice: Это тот же приём, что в игре «Угадай число».
  - q: Что будет при вводе номера 7, если проверки нет?
    options:
      - ArrayIndexOutOfBoundsException
      - Откроется последняя карточка
      - Ничего
      - Откроется первая карточка
    correct: 0
    explain: shelter[6] не существует, массив из трёх элементов.
    advice: Всегда проверяй ввод пользователя перед обращением к массиву.
memory:
  note: Момент, когда открыта карточка Шарика при вводе 2 и 0.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - Animal[] shelter → массив ссылок в куче
        - int number = 2
    - method: printCard()
      vars:
        - Animal this → Шарик
  heap:
    - obj: Animal[3]
      data: Ссылки на Барсика, Шарика и Кешу.
    - obj: Animal (Шарик)
      data: 'name = "Шарик", species = "собака", age = 5, medicalHistory = "Перелом лапы, вылечен"'
tests:
  - name: Открыть карточку Шарика
    stdin: |
      2
      0
    stdout: |
      [1] Барсик (кот, 3)
      [2] Шарик (собака, 5)
      [3] Кеша (попугай, 2)
      Номер карточки (0 — выход):
      ===== Карточка: Шарик =====
      Вид: собака
      Возраст: 5
      Хозяин: нет
      Медицинская история: Перелом лапы, вылечен
      Номер карточки (0 — выход):
      До свидания!
  - name: Неверный номер, потом две карточки
    stdin: |
      5
      1
      3
      0
    stdout: |
      [1] Барсик (кот, 3)
      [2] Шарик (собака, 5)
      [3] Кеша (попугай, 2)
      Номер карточки (0 — выход):
      Нет такой карточки
      Номер карточки (0 — выход):
      ===== Карточка: Барсик =====
      Вид: кот
      Возраст: 3
      Хозяин: нет
      Медицинская история: Прививка от бешенства, 2025
      Номер карточки (0 — выход):
      ===== Карточка: Кеша =====
      Вид: попугай
      Возраст: 2
      Хозяин: нет
      Медицинская история: Записей нет
      Номер карточки (0 — выход):
      До свидания!
  - name: Сразу выход
    stdin: |
      0
    stdout: |
      [1] Барсик (кот, 3)
      [2] Шарик (собака, 5)
      [3] Кеша (попугай, 2)
      Номер карточки (0 — выход):
      До свидания!
  - kind: source
    name: Массив животных
    pattern: \bAnimal\s*\[\s*\]\s*\w+
    message: "Храни животных в массиве: Animal[] shelter = { ... };"
