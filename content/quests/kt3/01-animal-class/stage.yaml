id: animal-class
title: "Класс Animal: поля, printInfo и два конструктора"
hints:
  - "Поля: `String name; String species; int age;`. Конструктор с параметрами: `Animal(String name, String species, int age)` и три присваивания через `this`."
  - 'Конструктор по умолчанию: `Animal() { this("Безымянный", "неизвестно", 1); }`.'
  - 'printInfo(): `System.out.println("Животное: " + name + ", вид: " + species + ", возраст: " + age);`.'
quiz:
  question: Какой конструктор вызовет new Animal()?
  options:
    - Конструктор без параметров
    - Конструктор с тремя параметрами
    - Оба по очереди
    - Никакой, будет ошибка
  correct: 0
  hint: Пустые скобки — версия без параметров.
exam:
  - q: Зачем классу два конструктора?
    options:
      - Чтобы создавать объект и с известными данными, и со значениями по умолчанию
      - Так требует компилятор
      - Второй конструктор удаляет объект
      - Один для полей, другой для методов
    correct: 0
    explain: Это перегрузка конструкторов. Компилятор выбирает версию по аргументам new.
    advice: Покажи на защите оба вызова в main.
  - q: Что делает this("Безымянный", "неизвестно", 1) в конструкторе по умолчанию?
    options:
      - Вызывает конструктор с параметрами этого же класса
      - Создаёт второй объект
      - Вызывает метод printInfo
      - Ничего, это комментарий
    correct: 0
    explain: this(...) передаёт значения другому конструктору, и поля заполняются в одном месте.
    advice: this(...) должен стоять первой строкой конструктора.
  - q: Чем конструктор отличается от метода printInfo()?
    options:
      - У конструктора имя класса и нет типа результата, он выполняется при new
      - Конструктор всегда static
      - Конструктор нельзя вызвать с параметрами
      - Ничем
    correct: 0
    explain: printInfo() — void-метод, его вызывают у готового объекта. Конструктор работает один раз, при создании.
    advice: Если перед именем конструктора написать void, получится обычный метод.
memory:
  note: Момент после создания двух животных.
  stack:
    - method: main()
      vars:
        - Animal unknown → объект в куче
        - Animal barsik → объект в куче
  heap:
    - obj: Animal (unknown)
      data: 'name = "Безымянный", species = "неизвестно", age = 1'
    - obj: Animal (barsik)
      data: 'name = "Барсик", species = "кот", age = 3'
tests:
  - name: Оба конструктора и printInfo
    stdout: |
      Животное: Безымянный, вид: неизвестно, возраст: 1
      Животное: Барсик, вид: кот, возраст: 3
  - kind: source
    name: Конструктор по умолчанию
    pattern: \bAnimal\s*\(\s*\)\s*\{
    message: "Добавь конструктор без параметров: Animal() { ... }"
  - kind: source
    name: Конструктор с параметрами
    pattern: \bAnimal\s*\(\s*String\s+\w+\s*,\s*String\s+\w+\s*,\s*int\s+\w+\s*\)\s*\{
    message: "Добавь конструктор Animal(String name, String species, int age)"
  - kind: source
    name: Метод printInfo()
    pattern: \bvoid\s+printInfo\s*\(\s*\)
    message: "Добавь метод void printInfo()"
