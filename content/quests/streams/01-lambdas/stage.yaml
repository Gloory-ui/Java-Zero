id: lambdas
title: "Лямбды: метод в одну строку"
hints:
  - "Каждая операция — пара «имя → лямбда»: `ops.put(\"-\", (a, b) -> a - b);`."
  - "Большее из двух — через тернарный оператор: `(a, b) -> a > b ? a : b`."
  - "Степень — блочная лямбда: `(a, b) -> { int result = 1; for (int i = 0; i < b; i++) result *= a; return result; }`."
quiz:
  question: Какой интерфейс можно реализовать лямбдой?
  options:
    - Интерфейс ровно с одним абстрактным методом
    - Любой интерфейс
    - Только Runnable
    - Интерфейс без методов
  correct: 0
  hint: Лямбда — это тело одного метода.
exam:
  - q: Чем отличаются x -> x * 2 и x -> { return x * 2; }?
    options:
      - Ничем по смыслу — во втором случае блок, и return пишут явно
      - Первая не возвращает значение
      - Вторая не компилируется
      - Первая работает только с int
    correct: 0
    explain: Короткая форма возвращает значение выражения сама. В блочной форме результат возвращают через return.
    advice: Одна строка — короткая форма, логика с циклами — блок.
  - q: Почему нельзя написать count++ внутри лямбды для локальной переменной count?
    options:
      - Лямбда может читать внешние локальные переменные, только если они не меняются
      - ++ запрещён в лямбдах
      - count не видна в лямбде
      - Можно, это правильно
    correct: 0
    explain: Локальные переменные, которые видит лямбда, должны быть фактически final — присвоены один раз. Иначе было бы неясно, какую версию значения она видит.
    advice: Считать внутри лямбды можно через поле класса или AtomicInteger, но лучше обойтись без этого.
  - q: Зачем аннотация @FunctionalInterface?
    options:
      - Компилятор проверит, что абстрактный метод ровно один
      - Без неё лямбды не работают
      - Она делает методы static
      - Она ускоряет лямбды
    correct: 0
    explain: Лямбды работают и без аннотации. Но если кто-то добавит второй абстрактный метод, аннотация превратит это в ошибку компиляции.
    advice: Ставь её на свои интерфейсы для лямбд.
memory:
  note: Момент вызова операции «pow».
  stack:
    - method: лямбда pow
      vars:
        - int a = 12
        - int b = 5
        - int result = 248832
    - method: main(String[] args)
      vars:
        - Map<String, Operation> ops → LinkedHashMap в куче
  heap:
    - obj: LinkedHashMap
      data: "+, -, *, max, pow → объекты-лямбды"
tests:
  - name: Операции над 12 и 5
    stdout: |
      12 + 5 = 17
      12 - 5 = 7
      12 * 5 = 60
      12 max 5 = 12
      12 pow 5 = 248832
  - kind: source
    name: Блочная лямбда
    pattern: '->\s*\{[\s\S]*return'
    message: "Степень напиши блочной лямбдой с return"
