id: pipeline
title: "Конвейер целиком: таблица результатов"
hints:
  - "Одно правило на весь код: `Comparator<Result> order = Comparator.comparingInt(Result::score).reversed().thenComparing(Result::name);`."
  - "Тройка: `results.stream().sorted(order).limit(3).toList()` и цикл по индексам для номеров мест."
  - "Баллы: `.map(Result::score).distinct().sorted(Comparator.reverseOrder()).toList()`. Остальные: `.sorted(order).skip(3).map(Result::name).toList()`."
sampleInput: |
  Аня 90
  Борис 55
  Вика 72
  Гоша 90
  Даша 81
  Ева 72
quiz:
  question: Что вернёт List.of(1, 2, 3, 4).stream().skip(1).limit(2).toList()?
  options:
    - "[2, 3]"
    - "[1, 2]"
    - "[3, 4]"
    - "[2, 3, 4]"
  correct: 0
  hint: Сначала пропускаем один, потом берём два.
exam:
  - q: Почему reversed() ставят сразу после comparingInt, а не в конце цепочки?
    options:
      - Иначе перевернётся и второй ключ — имена пойдут от Я к А
      - reversed нельзя ставить в конце
      - Так быстрее
      - Разницы нет
    correct: 0
    explain: reversed переворачивает весь компаратор, построенный до него. В конце он перевернул бы и сравнение по имени.
    advice: Строй компаратор по шагам и переворачивай только нужный ключ.
  - q: Что делает distinct()?
    options:
      - Убирает повторы, сохраняя первое появление
      - Сортирует элементы
      - Оставляет только уникальные, удаляя все повторявшиеся полностью
      - Считает разные элементы
    correct: 0
    explain: distinct пропускает элемент, только если такого ещё не было. 90, 55, 72, 90 превратится в 90, 55, 72.
    advice: Для подсчёта разных после distinct добавь count().
  - q: Что будет, если поставить limit(3) до sorted(order)?
    options:
      - Возьмутся первые трое из ввода, и отсортируются только они
      - Ничего не изменится
      - Ошибка компиляции
      - Получится пустой список
    correct: 0
    explain: Шаги конвейера выполняются по порядку. limit до сортировки отрежет данные раньше, чем их упорядочили.
    advice: Сначала упорядочи, потом режь.
memory:
  note: Момент после выбора тройки лучших.
  stack:
    - method: main(String[] args)
      vars:
        - List<Result> results → ArrayList в куче
        - Comparator<Result> order → объект-компаратор
        - List<Result> top → новый список
  heap:
    - obj: List<Result> (top)
      data: "Аня 90, Гоша 90, Даша 81"
tests:
  - name: Олимпиада из примера
    stdin: |
      Аня 90
      Борис 55
      Вика 72
      Гоша 90
      Даша 81
      Ева 72
    stdout: |
      1. Аня — 90
      2. Гоша — 90
      3. Даша — 81
      Разные баллы: [90, 81, 72, 55]
      Остальные: [Вика, Ева, Борис]
  - name: Двое участников
    stdin: |
      Ян 50
      Ия 70
    stdout: |
      1. Ия — 70
      2. Ян — 50
      Разные баллы: [70, 50]
      Остальные: []
  - kind: source
    name: Обрезка через limit
    pattern: '\.limit\s*\(\s*3\s*\)'
    message: "Возьми тройку через limit(3)"
