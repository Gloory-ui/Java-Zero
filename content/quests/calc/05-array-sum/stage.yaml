id: array-sum
isNew: true
title: "Сводка по массиву: сумма, максимум, среднее"
hints:
  - "Сначала прочитай все числа: цикл `for (int i = 0; i < n; i++)` и внутри `results[i] = sc.nextDouble();`."
  - "Сумма — накопитель `double sum = 0;` до цикла. Максимум начинай с первого элемента: `double max = results[0];`."
  - 'В цикле: `sum += results[i];` и `if (results[i] > max) max = results[i];`. Среднее — `sum / n`, печатай `"Среднее: " + sum / n`.'
sampleInput: |
  4
  12.5 3 47.25 8
quiz:
  question: С чего правильно начинать поиск максимума в массиве?
  options:
    - С нуля
    - С первого элемента массива
    - С последнего индекса
    - С самого большого числа типа double
  correct: 1
  hint: Первый элемент точно есть в массиве. С нулём ошибёшься, если все числа отрицательные.
exam:
  - q: Почему max = 0 ломает поиск максимума в массиве {-5, -2, -9}?
    options:
      - Ноль нельзя сравнивать с отрицательными числами
      - Все элементы меньше нуля, и программа ответит 0 — числа, которого нет в массиве
      - Так программа уйдёт в бесконечный цикл
      - Ничего не ломает
    correct: 1
    explain: Ни один элемент не больше стартового нуля, поэтому max так и останется 0. Старт с results[0] гарантирует, что ответ взят из массива.
    advice: Проверяй алгоритмы на массиве из одних отрицательных чисел.
  - q: Как пройти по всем элементам массива arr?
    options:
      - for (int i = 0; i <= arr.length; i++)
      - for (int i = 1; i <= arr.length; i++)
      - for (int i = 0; i < arr.length; i++)
      - for (int i = 1; i < arr.length; i++)
    correct: 2
    explain: Индексы идут от 0 до length - 1. Вариант с <= выходит за границу, а старт с 1 пропускает первый элемент.
    advice: Запомни шаблон i = 0; i < arr.length; i++.
  - q: Что будет при обращении arr[arr.length]?
    options:
      - Вернётся последний элемент
      - Вернётся 0
      - Программа упадёт с ArrayIndexOutOfBoundsException
      - Массив увеличится на одну ячейку
    correct: 2
    explain: Ячейки с номером length нет. Java проверяет границы при каждом обращении и бросает исключение.
    advice: Лаборатория объясняет это исключение по-русски — попробуй.
memory:
  note: Момент после цикла при вводе 4 и 12.5 3 47.25 8. Массив и Scanner — объекты в куче, в стеке ссылки на них и простые переменные.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 4
        - double[] results → массив в куче
        - double sum = 70.75
        - double max = 47.25
  heap:
    - obj: Scanner
      data: Прочитал 4, затем четыре числа.
    - obj: double[4]
      data: "[12.5, 3.0, 47.25, 8.0]"
tests:
  - name: Четыре результата
    stdin: |
      4
      12.5 3 47.25 8
    stdout: |
      Сумма: 70.75
      Максимум: 47.25
      Среднее: 17.6875
  - name: Все числа отрицательные
    stdin: |
      3
      -1 -5 -3
    stdout: |
      Сумма: -9.0
      Максимум: -1.0
      Среднее: -3.0
  - name: Один результат
    stdin: |
      1
      7
    stdout: |
      Сумма: 7.0
      Максимум: 7.0
      Среднее: 7.0
  - kind: source
    name: Проход циклом
    pattern: \bfor\s*\(
    message: Пройди массив циклом for
