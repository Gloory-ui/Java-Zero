id: history-array
title: "Журнал вычислений: массивы"
hints:
  - "Массив на 5 ячеек: `double[] history = new double[5];` — в каждой пока 0.0."
  - "Цикл по всем ячейкам: `for (int i = 0; i < history.length; i++)`. В первом цикле пиши `history[i] = (i + 1) * 1.5;`."
  - 'Во втором таком же цикле печатай `history[i]`. После цикла — `System.out.println("Всего записей: " + history.length);`.'
quiz:
  question: Чему равно history.length для new double[5]?
  options:
    - "4"
    - "5"
    - "6"
    - "0"
  correct: 1
  hint: Длина — это число ячеек, заданное при создании. А последний номер ячейки — 4.
exam:
  - q: Где физически создаются массивы в Java?
    options:
      - В куче (Heap), а переменная хранит ссылку
      - На стеке, как int
      - В регистрах процессора
      - В файле программы
    correct: 0
    explain: Массив — объект, поэтому он создаётся в куче. В переменной-массиве лежит только ссылка на него.
    advice: Сравни в «Памяти» стек и кучу на этом этапе.
  - q: Какой номер у последней ячейки массива длины 5?
    options:
      - "5"
      - "4"
      - "6"
      - "1"
    correct: 1
    explain: Нумерация с нуля — 0, 1, 2, 3, 4. Поэтому в цикле условие i < length.
    advice: Последний индекс всегда length - 1.
  - q: Что лежит в ячейках new int[3] сразу после создания?
    options:
      - Случайные числа
      - Нули
      - Ничего, чтение вызовет ошибку
      - Числа 1, 2, 3
    correct: 1
    explain: Java заполняет новый массив значениями по умолчанию — 0 для чисел, false для boolean, null для строк.
    advice: Если нужны другие значения, заполни массив циклом.
memory:
  note: Момент после заполнения массива. Сам массив живёт в куче, а переменная history в стеке хранит ссылку на него.
  stack:
    - method: main()
      vars:
        - double[] history → массив в куче
  heap:
    - obj: double[5]
      data: "[1.5, 3.0, 4.5, 6.0, 7.5]"
tests:
  - name: Заполняет и выводит журнал
    stdout: |
      1.5
      3.0
      4.5
      6.0
      7.5
      Всего записей: 5
  - kind: source
    name: Массив new double[5]
    pattern: new\s+double\s*\[\s*5\s*\]
    message: "Создай массив: double[] history = new double[5];"
  - kind: source
    name: Проход циклом по массиву
    pattern: \bfor\s*\([^)]*\.length
    message: "Пройди массив циклом: for (int i = 0; i < history.length; i++)"
