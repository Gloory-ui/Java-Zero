id: history-array
badge: ЭТАП 03 / 04
title: "Журнал вычислений: Массивы в Heap"
hint: double[] history = new double[5]; history[0] = 10.5; System.out.println(history.length);
quiz:
  question: Чему равно history.length для new double[5]?
  options:
    - "4"
    - "5"
    - "6"
    - "0"
  correct: 1
  hint: Длина созданного массива равна переданному размеру.
exam:
  - q: Где физически создаются массивы в JVM?
    options:
      - В куче (Heap)
      - На стеке (Stack)
      - В реестре процессора
      - В файловой системе
    correct: 0
    explain: Все массивы в Java являются объектами и размещаются в Heap, а переменная хранит ссылку на них.
    advice: Повтори устройство кучи.
memory:
  stack:
    - method: main()
      vars:
        - double[] history = @0x99
        - history[0] = 10.5
  heap:
    - obj: double[5] Array
      data: "[10.5, 0.0, 0.0, 0.0, 0.0]"
tests:
  - name: Выводит длину массива
    stdout: |
      5
  - kind: source
    name: Массив new double[5]
    pattern: new\s+double\s*\[\s*5\s*\]
    message: "Создай массив: double[] history = new double[5];"
  - kind: source
    name: Запись в history[0]
    pattern: \bhistory\s*\[\s*0\s*\]\s*=
    message: "Запиши значение в первую ячейку: history[0] = 10.5;"
