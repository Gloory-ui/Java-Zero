id: methods
isNew: true
title: "Методы: параметры и return"
hints:
  - Метод получает значения в скобках и отдаёт результат через `return`. Замени заглушку `return 0;` на формулу.
  - "Процент: значение умножить на процент и разделить на 100 — `return value * p / 100;`."
  - "Среднее двух чисел — их сумма, делённая на 2. Не забудь скобки: `return (a + b) / 2;`."
quiz:
  question: Что вернёт метод static int twice(int x) { return x * 2; } при вызове twice(21)?
  options:
    - "21"
    - "42"
    - "x * 2"
    - Ничего, он только считает
  correct: 1
  hint: При вызове x = 21, а return отдаёт 21 * 2.
exam:
  - q: Зачем в методе нужен return?
    options:
      - Чтобы напечатать результат
      - Чтобы вернуть результат туда, откуда метод вызвали, и завершить метод
      - Чтобы перезапустить метод
      - Он нужен только в main
    correct: 1
    explain: return передаёт значение в место вызова, например в переменную или в println. Код после return в методе не выполняется.
    advice: Если метод должен что-то посчитать, он возвращает, а печатает вызывающий.
  - q: Что означает void в заголовке метода?
    options:
      - Метод пустой и ничего не делает
      - Метод ничего не возвращает
      - Метод возвращает 0
      - Метод нельзя вызвать из main
    correct: 1
    explain: void — это «нет результата». Такой метод может печатать или менять данные, но значение не возвращает.
    advice: main тоже void — он ничего никому не возвращает.
  - q: Где живут параметры и локальные переменные метода?
    options:
      - В куче, пока программа работает
      - В кадре метода в стеке — и исчезают после его завершения
      - В классе, доступны всем методам
      - В файле программы
    correct: 1
    explain: Каждый вызов получает свой кадр в стеке. Когда метод вернул результат, кадр снимается, и его переменных больше нет.
    advice: Открой вкладку «Память» — там виден кадр percent рядом с main.
memory:
  note: Момент первого вызова percent(200, 15). У метода свой кадр в стеке поверх main; после return он исчезнет, а main получит 30.0.
  stack:
    - method: percent(200.0, 15.0)
      vars:
        - double value = 200.0
        - double p = 15.0
        - → вернёт 30.0
    - method: main(String[] args)
      vars:
        - ждёт результат percent(200, 15)
  heap: []
tests:
  - name: Проценты и среднее
    stdout: |
      30.0
      40.0
      3.5
      4.0
  - kind: source
    name: Методы возвращают результат
    pattern: return\s+\(?\s*\w+\s*[*+]
    message: Замени заглушку return 0 на формулу с параметрами
