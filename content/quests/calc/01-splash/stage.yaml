id: splash
title: Базовый каркас и заставка
hints:
  - Нужна одна команда вывода внутри `main`.
  - Текст для вывода берут в двойные кавычки и передают в `System.out.println(...)`.
  - 'Скопируй текст заставки из задания точно, вместе со знаками `===` и пробелами: `"=== КАЛЬКУЛЯТОР ЗАПУЩЕН ==="`.'
quiz:
  question: Какая сигнатура является точкой входа в Java?
  options:
    - function main()
    - public static void main(String[] args)
    - void start()
    - public void run()
  correct: 1
  hint: public static void main(String[] args)
exam:
  - q: Почему метод main объявлен как static?
    options:
      - Чтобы работать быстрее
      - Чтобы JVM могла вызвать его без создания объекта через new
      - Это устаревшее требование
      - Чтобы запретить вызовы из других классов
    correct: 1
    explain: static позволяет JVM вызвать метод main без создания экземпляра класса в куче.
    advice: Повтори разницу между статическими и нестатическими методами.
  - q: Что будет, если назвать класс Calc, а файл останется Calculator.java?
    options:
      - "Код не скомпилируется: публичный класс должен называться как файл"
      - Всё заработает
      - Java сама переименует файл
      - Появится только предупреждение
    correct: 0
    explain: Публичный класс обязан совпадать с именем файла. Компилятор остановится с ошибкой.
    advice: В лаборатории имя класса не меняй.
  - q: Что означает void в заголовке public static void main?
    options:
      - main ничего не возвращает
      - main пустой
      - main нельзя вызвать
      - main возвращает 0
    correct: 0
    explain: void — «нет результата». Метод может что-то делать, например печатать, но значения не возвращает.
    advice: В этапе «Методы» появятся методы, которые возвращают результат.
memory:
  note: Момент вывода заставки. Даже без аргументов запуска JVM создаёт для main пустой массив args.
  stack:
    - method: main(String[] args)
      vars:
        - String[] args → пустой массив
  heap:
    - obj: String[0]
      data: Массив аргументов запуска. Программу запускают без аргументов, поэтому он пустой.
    - obj: '"=== КАЛЬКУЛЯТОР ЗАПУЩЕН ==="'
      data: "Строка-литерал: её получает println."
tests:
  - name: Выводит заставку
    stdout: |
      === КАЛЬКУЛЯТОР ЗАПУЩЕН ===
