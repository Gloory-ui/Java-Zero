id: factorial
badge: ЭТАП 04 / 04
title: Рекурсивный факториал n!
hints:
  - "Базовый случай: для `n <= 1` факториал равен 1 — на нём рекурсия останавливается."
  - "Шаг рекурсии: `n! = n * (n - 1)!` — метод вызывает сам себя с числом на единицу меньше."
  - "Вместо заглушки: `if (n <= 1) return 1;` и следующей строкой `return n * factorial(n - 1);`."
quiz:
  question: Чему равен факториал 5!?
  options:
    - "25"
    - "60"
    - "120"
    - "720"
  correct: 2
  hint: 5 * 4 * 3 * 2 * 1 = 120.
exam:
  - q: Что вызывает ошибку java.lang.StackOverflowError?
    options:
      - Переполнение кучи
      - Исчерпание памяти стека вызовов из-за бесконечной или слишком глубокой рекурсии
      - Деление на 0
      - Ошибка диска
    correct: 1
    explain: Каждый рекурсивный вызов занимает отдельный стековый фрейм. При исчерпании стека потока JVM выбрасывает StackOverflowError.
    advice: Всегда следи за достижимостью терминального случая в рекурсии.
memory:
  note: "Самый глубокий момент рекурсии: пять кадров factorial лежат в стеке друг над другом. Когда factorial(1) вернёт 1, кадры начнут сниматься сверху вниз."
  stack:
    - method: factorial(1)
      vars:
        - int n = 1 → вернёт 1
    - method: factorial(2)
      vars:
        - int n = 2 → ждёт factorial(1)
    - method: factorial(3)
      vars:
        - int n = 3 → ждёт factorial(2)
    - method: factorial(4)
      vars:
        - int n = 4 → ждёт factorial(3)
    - method: factorial(5)
      vars:
        - int n = 5 → ждёт factorial(4)
    - method: main()
      vars:
        - ждёт factorial(5)
  heap: []
tests:
  - name: Выводит 5! = 120
    stdout: |
      120
  - kind: source
    name: Рекурсивный вызов factorial(n - 1)
    pattern: \bfactorial\s*\(\s*n\s*-\s*1\s*\)
    message: "Метод должен вызывать сам себя: factorial(n - 1)"
  - kind: source
    name: Базовый случай n <= 1
    pattern: \bn\s*(<=\s*1|==\s*[01]|<\s*2)\b
    message: "Без базового случая рекурсия не остановится: if (n <= 1) return 1;"
