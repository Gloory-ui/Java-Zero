id: try-catch
title: "try и catch: программа не падает"
hints:
  - "Деление, которое может сломаться, положи в `try`, а сообщение о нуле — в `catch (ArithmeticException e)`."
  - "Сначала посчитай `int q = a / b;`, потом печатай: если деление бросит исключение, строка не успеет начаться."
  - "`try { int q = a / b; System.out.println(a + \" / \" + b + \" = \" + q); } catch (ArithmeticException e) { System.out.println(a + \" / \" + b + \": деление на ноль\"); }`"
sampleInput: |
  10 2
  7 0
  9 3
quiz:
  question: Что происходит с остатком блока try после того, как в нём бросилось исключение?
  options:
    - Он пропускается, управление переходит в подходящий catch
    - Он выполняется до конца, потом срабатывает catch
    - Программа сразу завершается
    - try начинается заново
  correct: 0
  hint: Исключение прерывает выполнение прямо на месте ошибки.
exam:
  - q: Что напечатает System.out.println(5.0 / 0)?
    options:
      - Infinity
      - ArithmeticException
      - "0"
      - NaN
    correct: 0
    explain: Для дробных чисел деление на ноль даёт бесконечность. Исключение бросает только деление целых чисел.
    advice: Для дробных проверяй делитель сам или смотри на Double.isInfinite.
  - q: Где продолжится программа после выполнения catch?
    options:
      - На строке после всей конструкции try/catch
      - На строке, где случилась ошибка
      - В начале try
      - Нигде, программа завершится
    correct: 0
    explain: Исключение обработано, и программа идёт дальше обычным порядком — к коду после try/catch.
    advice: Поэтому цикл с try внутри продолжит читать следующие пары.
  - q: Что будет, если в catch указать не тот тип исключения?
    options:
      - Исключение не поймается и уронит программу
      - catch поймает его всё равно
      - Ошибка компиляции
      - Java подберёт подходящий catch сама
    correct: 0
    explain: catch ловит только свой тип и его наследников. Остальные исключения летят дальше, пока их не поймают или программа не упадёт.
    advice: Лови конкретный тип, который действительно ожидаешь.
memory:
  note: Момент внутри catch для пары 7 и 0.
  stack:
    - method: main(String[] args)
      vars:
        - Scanner sc → объект в куче
        - int a = 7
        - int b = 0
        - ArithmeticException e → объект в куче
  heap:
    - obj: ArithmeticException
      data: "message = \"/ by zero\""
tests:
  - name: Пары из примера
    stdin: |
      10 2
      7 0
      9 3
    stdout: |
      10 / 2 = 5
      7 / 0: деление на ноль
      9 / 3 = 3
      Готово
  - name: Ноль в конце
    stdin: |
      0 5
      1 0
    stdout: |
      0 / 5 = 0
      1 / 0: деление на ноль
      Готово
  - kind: source
    name: Ловим ArithmeticException
    pattern: 'catch\s*\(\s*ArithmeticException'
    message: "Поймай деление на ноль: catch (ArithmeticException e)"
