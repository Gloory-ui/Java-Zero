id: while-attempts
title: Цикл while и лимит попыток
hints:
  - "Цикл `while` повторяется, пока условие в скобках истинно: `attempts < maxAttempts`."
  - Внутри цикла сначала увеличь счётчик `attempts++;`, потом печатай — так первая строка будет «Попытка 1», а не «Попытка 0».
  - 'Печать: `System.out.println("Попытка " + attempts);` — пробел после слова стоит внутри кавычек.'
quiz:
  question: Когда проверяется условие в цикле while?
  options:
    - Перед каждой итерацией
    - После каждой итерации
    - Только один раз при старте
    - В конце программы
  correct: 0
  hint: while — это цикл с предусловием (проверка идет ДО входа в тело).
exam:
  - q: Что произойдет, если в цикле while (attempts < 3) забыть сделать attempts++?
    options:
      - Ошибка компиляции
      - Бесконечный цикл (Infinite Loop), программа намертво зависнет
      - Цикл выполнится ровно 3 раза
      - JVM автоматически увеличит переменную
    correct: 1
    explain: Если переменная в условии цикла не изменяется, условие всегда истинно. Выполнение зациклится.
    advice: Всегда проверяй шаг изменения условий в циклах while.
  - q: Сколько раз выполнится тело while (x < 3), если до цикла x = 5?
    options:
      - Ни разу
      - Один раз
      - Бесконечно
      - Три раза
    correct: 0
    explain: while проверяет условие до первого круга. 5 < 3 ложно, и тело пропускается.
    advice: У while может не быть ни одного круга.
  - q: "Что выведет код: int n = 1; while (n < 20) n *= 3; System.out.println(n);"
    options:
      - "27"
      - "9"
      - "20"
      - "81"
    correct: 0
    explain: "n меняется так: 1 → 3 → 9 → 27. При 27 условие 27 < 20 ложно, цикл закончен."
    advice: Выпиши значения по кругам.
memory:
  note: "Момент после цикла: attempts дорос до 3, условие 3 < 3 ложно, и цикл закончился."
  stack:
    - method: main()
      vars:
        - int attempts = 3
        - int maxAttempts = 3
  heap:
    - obj: '"Попытка "'
      data: "Строка-литерал. Склейка с числом каждый раз создаёт новую строку: «Попытка 1», «Попытка 2»…"
tests:
  - name: Печатает три попытки
    stdout: |
      Попытка 1
      Попытка 2
      Попытка 3
  - kind: source
    name: Цикл while
    pattern: \bwhile\s*\(
    message: Используй цикл while
