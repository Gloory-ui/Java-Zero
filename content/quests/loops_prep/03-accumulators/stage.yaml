id: accumulators
title: "Переменные-накопители: раздельные суммы"
hints:
  - Суммы уже объявлены до цикла — внутри цикла к ним только прибавляй.
  - "Чётность: `i % 2 == 0`. Чётное прибавь к `sumEven`, иначе (`else`) — к `sumOdd`."
  - "`sumEven += i;` значит `sumEven = sumEven + i;`. После цикла выведи две суммы, каждую своим `println`."
quiz:
  question: Что означает оператор sum += i?
  options:
    - sum = i
    - sum = sum + i
    - sum = sum * i
    - sum == i
  correct: 1
  hint: += прибавляет правое значение к переменной слева.
exam:
  - q: Что произойдет, если объявить int sum = 0 внутри тела цикла for?
    options:
      - Сумма посчитается правильно
      - На каждом шаге цикла переменная sum будет пересоздаваться и обнуляться, теряя накопленный результат
      - Компилятор выбросит ошибку дублирования переменной
      - Переменная сохранится в куче JVM
    correct: 1
    explain: Область видимости (Scope) переменной внутри цикла ограничена одной итерацией. После закрывающей скобки блока она уничтожается.
    advice: Всегда объявляй накопители до начала цикла.
  - q: "Чему будет равна sum после кода: int sum = 0; for (int i = 1; i <= 4; i++) sum += i;"
    options:
      - "10"
      - "4"
      - "15"
      - "24"
    correct: 0
    explain: sum копит 1 + 2 + 3 + 4 = 10.
    advice: Составь таблицу значений i и sum по кругам.
  - q: Как посчитать, сколько чисел от 1 до 20 делятся на 3?
    options:
      - Завести int count = 0 до цикла и делать count++, если i % 3 == 0
      - Сложить все числа от 1 до 20
      - Вывести 20 % 3
      - Писать count = i внутри цикла
    correct: 0
    explain: Счётчик — тот же накопитель, только прибавляет 1 за каждое подходящее число.
    advice: Этот приём нужен в задании 6 КТ 1 — считать простые числа.
memory:
  note: Момент после цикла. Накопители объявлены до него, поэтому пережили все 10 кругов и хранят итог.
  stack:
    - method: main()
      vars:
        - int sumEven = 30
        - int sumOdd = 25
  heap: []
tests:
  - name: Выводит сумму чётных и нечётных от 1 до 10
    stdout: |
      30
      25
  - kind: source
    name: Проверка чётности через %
    pattern: "%\\s*2"
    message: "Чётность проверяют так: i % 2 == 0"
