id: nested-loops
badge: ПОДГОТОВКА 04 / 06
title: "Вложенные циклы: сетки и таблицы"
hints:
  - Внешний цикл отвечает за строки, внутренний — за числа в строке.
  - 'Во внутреннем цикле печатай без перевода строки: `System.out.print(i * j + "\t");`'
  - "Когда внутренний цикл закончился, переведи строку: `System.out.println();` — внутри внешнего цикла, после внутреннего."
quiz:
  question: Какой спецсимвол добавляет табуляцию (отступ колонки)?
  options:
    - \n
    - \t
    - \r
    - \b
  correct: 1
  hint: \t означает Tab (табуляция).
exam:
  - q: Сколько всего раз выполнится тело внутреннего цикла for (int j = 1; j <= 10; j++), если внешний цикл делает 10 шагов?
    options:
      - 20 раз
      - 100 раз (10 * 10)
      - 10 раз
      - 50 раз
    correct: 1
    explain: На каждый 1 шаг внешнего цикла внутренний делает 10 шагов. 10 * 10 = 100 итераций.
    advice: "Сложность вложенных циклов перемножается: O(N * M)."
memory:
  note: "Момент, когда печатается 2 × 3 = 6: внешний цикл на второй строке, внутренний — на третьем столбце."
  stack:
    - method: main()
      vars:
        - int i = 2
        - int j = 3
  heap: []
loopTracer:
  rows: 3
  cols: 3
tests:
  - name: Печатает таблицу 3×3 через табуляцию
    stdout: |
      1	2	3	
      2	4	6	
      3	6	9	
    match: tokens
  - kind: source
    name: Два вложенных цикла for
    pattern: \bfor\s*\([^)]*\)[\s\S]*\bfor\s*\(
    message: Внутри внешнего for нужен второй for
