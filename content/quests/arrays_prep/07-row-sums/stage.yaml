id: row-sums
title: "Суммы по строкам: самая и наименее загруженная"
hints:
  - "Прочитай таблицу `int[][] t = new int[3][4];` из ввода и заведи `int[] sums = new int[3];`."
  - "Для каждой строки: `int sum = 0;`, внутренний цикл складывает `t[i][j]`, потом `sums[i] = sum;` и печать `shifts[i] + \": \" + sum`."
  - "По массиву `sums` найди индексы `maxRow` и `minRow` и выведи `shifts[maxRow]` и `shifts[minRow]`."
sampleInput: |
  12 15 9 14
  20 18 25 22
  7 11 6 10
quiz:
  question: Где обнуляют сумму строки при подсчёте сумм по строкам?
  options:
    - Внутри внешнего цикла, перед внутренним
    - До обоих циклов
    - Внутри внутреннего цикла
    - После обоих циклов
  correct: 0
  hint: Каждая строка считается с нуля, а внешний цикл как раз переходит к новой строке.
exam:
  - q: Что будет, если int sum = 0 объявить до внешнего цикла?
    options:
      - Суммы строк начнут накапливаться друг на друга
      - Ничего не изменится
      - Программа не скомпилируется
      - Суммы станут нулями
    correct: 0
    explain: Сумма не обнуляется между строками. У второй строки будет сумма первых двух, у третьей — всех трёх.
    advice: Накопитель живёт столько же, сколько величина, которую он считает, — одну строку.
  - q: Зачем хранить суммы в отдельном массиве sums?
    options:
      - Чтобы потом найти среди них максимум и минимум
      - Без него нельзя сложить числа
      - Так требует компилятор
      - Чтобы таблица не изменилась
    correct: 0
    explain: Суммы нужны дважды — для печати и для поиска лучшей строки. Массив хранит их все.
    advice: Можно искать максимум и сразу при подсчёте, но с массивом код проще проверить.
  - q: Что хранит String[] shifts = {"Утро", "День", "Вечер"}?
    options:
      - Три ссылки на строки, индексы 0, 1, 2
      - Три числа
      - Одну строку «УтроДеньВечер»
      - Таблицу 3 × 3
    correct: 0
    explain: Массив строк устроен как массив чисел, только в ячейках текст. shifts[1] — «День».
    advice: Индекс строки таблицы и индекс названия совпадают, поэтому shifts[maxRow] — нужное имя.
memory:
  note: Момент после подсчёта сумм при вводе из примера.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - String[] shifts → массив в куче
        - int[][] t → массив строк в куче
        - int[] sums → массив в куче
  heap:
    - obj: String[3]
      data: "Утро, День, Вечер"
    - obj: int[3][4]
      data: "{12, 15, 9, 14}, {20, 18, 25, 22}, {7, 11, 6, 10}"
    - obj: int[3] (sums)
      data: "50, 85, 34"
tests:
  - name: Заказы из примера
    stdin: |
      12 15 9 14
      20 18 25 22
      7 11 6 10
    stdout: |
      Утро: 50
      День: 85
      Вечер: 34
      Больше всего заказов: День
      Меньше всего заказов: Вечер
  - name: Вечер загружен больше всех
    stdin: |
      5 5 5 5
      1 1 1 1
      9 9 9 9
    stdout: |
      Утро: 20
      День: 4
      Вечер: 36
      Больше всего заказов: Вечер
      Меньше всего заказов: День
  - name: Одинаковые суммы — берётся первая смена
    stdin: |
      3 3 3 3
      4 4 4 0
      2 2 2 6
    stdout: |
      Утро: 12
      День: 12
      Вечер: 12
      Больше всего заказов: Утро
      Меньше всего заказов: Утро
