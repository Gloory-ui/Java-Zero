id: table
title: "Двумерный массив: строки и столбцы"
hints:
  - "Всю таблицу печатают два вложенных цикла: `for (int i = 0; i < t.length; i++)` и внутри `for (int j = 0; j < t[i].length; j++)`."
  - 'Во внутреннем цикле `System.out.print(t[i][j] + " ");`, после него — `System.out.println();`.'
  - 'Вторая строка — индекс 1: `System.out.print("Вторая строка:");`, затем цикл по `j` с `" " + t[1][j]`.'
quiz:
  question: Сколько строк в массиве new int[5][6]?
  options:
    - "6"
    - "5"
    - "30"
    - "11"
  correct: 1
  hint: Первое число — строки, второе — столбцы.
exam:
  - q: Что вернёт t[0].length для new int[3][4]?
    options:
      - "3"
      - "4"
      - "12"
      - "0"
    correct: 1
    explain: t[0] — первая строка, в ней 4 столбца.
    advice: t.length — число строк, t[i].length — число столбцов.
  - q: Как обратиться к ячейке в третьей строке и первом столбце?
    options:
      - t[3][1]
      - t[2][0]
      - t[0][2]
      - t[1][3]
    correct: 1
    explain: Индексы с нуля. Третья строка — 2, первый столбец — 0.
    advice: Сначала строка, потом столбец.
  - q: Сколько раз выполнится тело внутреннего цикла при печати таблицы 3 × 4?
    options:
      - "7"
      - "12"
      - "3"
      - "4"
    correct: 1
    explain: На каждую из 3 строк внутренний цикл проходит 4 столбца, всего 12 ячеек.
    advice: Это те же вложенные циклы, что в таблице умножения.
memory:
  note: Двумерный массив — массив ссылок на строки. Каждая строка — отдельный массив int[4] в куче.
  stack:
    - method: main()
      vars:
        - int[][] t → массив строк в куче
  heap:
    - obj: int[3][]
      data: "Три ссылки: на строку 0, строку 1, строку 2."
    - obj: int[4] (строка 0)
      data: "3, 8, 1, 9"
    - obj: int[4] (строка 1)
      data: "5, 2, 7, 4"
    - obj: int[4] (строка 2)
      data: "6, 0, 2, 8"
tests:
  - name: Таблица целиком и вторая строка
    stdout: |
      3 8 1 9
      5 2 7 4
      6 0 2 8
      Вторая строка: 5 2 7 4
    match: tokens
  - kind: source
    name: Таблица печатается вложенными циклами
    pattern: \bfor\s*\([^)]*\)[\s\S]*\bfor\s*\(
    message: Для всей таблицы нужен цикл по строкам и внутри него цикл по столбцам
