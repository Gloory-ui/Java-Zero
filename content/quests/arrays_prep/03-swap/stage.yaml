id: swap
title: "Индекс максимума и обмен через temp"
hints:
  - "Запоминай индекс, а не значение: `int maxIndex = 0;`, в цикле `if (a[i] > a[maxIndex]) maxIndex = i;`."
  - "Обмен в три шага: `int temp = a[0]; a[0] = a[maxIndex]; a[maxIndex] = temp;`."
  - 'Вывод: `System.out.print("После обмена: {");`, элементы через `", "`, в конце `System.out.println("}");`.'
sampleInput: |
  5
  4 -5 0 6 8
quiz:
  question: Сколько присваиваний нужно, чтобы поменять местами a[0] и a[3] через временную переменную?
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  correct: 2
  hint: "temp = a[0]; a[0] = a[3]; a[3] = temp; — три шага."
exam:
  - q: Что окажется в массиве {5, 7} после a[0] = a[1]; a[1] = a[0];?
    options:
      - "{7, 5}"
      - "{7, 7}"
      - "{5, 5}"
      - "{5, 7}"
    correct: 1
    explain: Первое присваивание затирает 5. Во второй ячейке оказывается уже новое a[0], то есть 7.
    advice: Без временной переменной одно из значений теряется.
  - q: Зачем искать индекс максимума, а не само значение?
    options:
      - Чтобы знать, в какую ячейку поставить элемент при обмене
      - Индекс занимает меньше памяти
      - Значение максимума найти нельзя
      - Так быстрее работает цикл
    correct: 0
    explain: Значение всегда можно получить как a[maxIndex]. А по значению место в массиве не восстановить.
    advice: Этот же приём нужен, чтобы поменять местами минимум и максимум.
  - q: Какой индекс запомнит поиск со знаком > в массиве {2, 7, 3, 7}?
    options:
      - "1"
      - "3"
      - "0"
      - "2"
    correct: 0
    explain: "Вторая семёрка не больше первой, поэтому maxIndex останется 1."
    advice: Чтобы запомнить последний максимум, нужен знак >=.
memory:
  note: "Момент после обмена при вводе 5 и 4 -5 0 6 8: максимум стоит первым."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 5
        - int[] a → массив в куче
        - int maxIndex = 4
        - int temp = 4
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[5]
      data: "8, -5, 0, 6, 4"
tests:
  - name: Максимум в конце массива
    stdin: |
      5
      4 -5 0 6 8
    stdout: |
      Индекс максимума: 4
      После обмена: {8, -5, 0, 6, 4}
  - name: Максимум уже первый
    stdin: |
      4
      9 1 5 3
    stdout: |
      Индекс максимума: 0
      После обмена: {9, 1, 5, 3}
  - name: Два одинаковых максимума — берётся первый
    stdin: |
      5
      2 7 3 7 1
    stdout: |
      Индекс максимума: 1
      После обмена: {7, 2, 3, 7, 1}
