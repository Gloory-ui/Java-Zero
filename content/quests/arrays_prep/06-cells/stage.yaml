id: cells
title: Обход таблицы и адреса ячеек
hints:
  - "Прочитай `rows` и `cols`, создай `int[][] t = new int[rows][cols];` и заполни двумя вложенными циклами через `sc.nextInt()`."
  - "Вторыми вложенными циклами пройди все ячейки: `if (t[i][j] > 5)` — печатай адрес и увеличивай `count`."
  - 'Строка вывода: `System.out.println("[" + i + "][" + j + "] = " + t[i][j]);`, в конце `System.out.println("Всего: " + count);`.'
sampleInput: |
  3 4
  3 8 1 9
  5 2 7 4
  6 0 2 8
quiz:
  question: В каком порядке обходит ячейки цикл по i (строки) с вложенным циклом по j (столбцы)?
  options:
    - По строкам слева направо, сверху вниз
    - По столбцам сверху вниз
    - По диагонали
    - В случайном порядке
  correct: 0
  hint: Внешний цикл держит строку, пока внутренний проходит все её столбцы.
exam:
  - q: Что напечатает "[" + 1 + "][" + 2 + "]"?
    options:
      - "[1][2]"
      - "[3]"
      - "[12]"
      - Ошибку компиляции
    correct: 0
    explain: Строка в начале выражения превращает всё сложение в склейку текста.
    advice: Без строки между ними 1 + 2 сложилось бы как числа.
  - q: Где заводить счётчик подходящих ячеек?
    options:
      - До обоих циклов
      - Во внешнем цикле
      - Во внутреннем цикле
      - После циклов
    correct: 0
    explain: Счётчик считает по всей таблице. Внутри цикла он обнулялся бы каждый круг.
    advice: Это тот же накопитель, что в квесте «Циклы».
  - q: Как прочитать таблицу 2 × 3 из ввода 1 2 3 4 5 6?
    options:
      - "Двумя вложенными циклами: t[i][j] = sc.nextInt()"
      - Одним вызовом sc.nextInt()
      - sc.nextLine() для каждой ячейки
      - Таблицу из ввода прочитать нельзя
    correct: 0
    explain: "Вложенные циклы идут по строкам: 1 2 3 попадут в строку 0, 4 5 6 — в строку 1."
    advice: nextInt() берёт следующее число, где бы оно ни стояло во вводе.
memory:
  note: Момент после обхода при вводе из примера. Подошли пять ячеек.
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int rows = 3
        - int cols = 4
        - int[][] t → массив строк в куче
        - int count = 5
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[3][4]
      data: "{3, 8, 1, 9}, {5, 2, 7, 4}, {6, 0, 2, 8}"
tests:
  - name: Таблица 3 × 4 из примера
    stdin: |
      3 4
      3 8 1 9
      5 2 7 4
      6 0 2 8
    stdout: |
      [0][1] = 8
      [0][3] = 9
      [1][2] = 7
      [2][0] = 6
      [2][3] = 8
      Всего: 5
    match: tokens
  - name: Подходящих ячеек нет
    stdin: |
      2 2
      1 2
      3 4
    stdout: |
      Всего: 0
    match: tokens
  - name: Одна строка
    stdin: |
      1 3
      6 6 0
    stdout: |
      [0][0] = 6
      [0][1] = 6
      Всего: 2
    match: tokens
