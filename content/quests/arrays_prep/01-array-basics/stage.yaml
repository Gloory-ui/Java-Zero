id: array-basics
title: "Массив: ячейки, индексы и вывод через запятую"
hints:
  - "Создай массив `int[] a = new int[6];` и заполни его циклом `for (int i = 0; i < a.length; i++)`."
  - "В ячейку `i` пиши `a[i] = (i + 1) * 5;` — при `i = 0` получится 5, при `i = 5` — 30."
  - 'Во втором цикле ставь запятую только перед элементами с индексом больше нуля: `if (i > 0) System.out.print(", ");`, потом `System.out.print(a[i]);`.'
quiz:
  question: Какой индекс у последней ячейки массива new int[6]?
  options:
    - "6"
    - "5"
    - "0"
    - "7"
  correct: 1
  hint: "Индексы начинаются с нуля: 0, 1, 2, 3, 4, 5."
exam:
  - q: Что лежит в ячейках массива сразу после new int[4]?
    options:
      - Нули
      - Случайные числа
      - Ничего, чтение вызовет ошибку
      - Числа 1, 2, 3, 4
    correct: 0
    explain: "Новый массив заполнен значениями по умолчанию: у int это 0."
    advice: У boolean значение по умолчанию false, у double — 0.0.
  - q: Чем закончится обращение a[a.length]?
    options:
      - Вернёт последний элемент
      - Ошибкой ArrayIndexOutOfBoundsException
      - Вернёт 0
      - Вернёт длину массива
    correct: 1
    explain: Последний индекс — length - 1. Ячейки с индексом length нет.
    advice: В условии цикла пиши i < a.length, а не <=.
  - q: Как вывести числа через запятую без запятой в конце?
    options:
      - Печатать ", " перед каждым элементом, кроме первого
      - Печатать a[i] + ", " в каждом круге
      - Вызвать System.out.println(a)
      - Печатать ", " только после первого элемента
    correct: 0
    explain: Условие if (i > 0) пропускает запятую перед первым элементом, поэтому после последнего её тоже нет.
    advice: Тот же приём нужен для вывода массива в фигурных скобках.
memory:
  note: Момент после первого цикла, массив заполнен.
  stack:
    - method: main()
      vars:
        - int[] a → массив в куче
  heap:
    - obj: int[6]
      data: "5, 10, 15, 20, 25, 30"
tests:
  - name: Шесть чисел, кратных пяти, через запятую
    stdout: |
      5, 10, 15, 20, 25, 30
  - kind: source
    name: Массив создаётся через new int[...]
    pattern: \bint\s*\[\s*\]\s*\w+\s*=\s*new\s+int\s*\[
    message: "Создай массив: int[] a = new int[6]; и заполни его циклом"
