id: max-positions
title: Максимум и все его позиции
hints:
  - "Прочитай `n`, создай `int[] a = new int[n];` и заполни его в цикле через `sc.nextInt()`."
  - "Первый проход: `int max = a[0];`, дальше `if (a[i] > max) max = a[i];`."
  - 'Второй проход: `System.out.print("Индексы:");`, в цикле `if (a[i] == max) System.out.print(" " + i);`, в конце `System.out.println();`.'
sampleInput: |
  7
  4 1 9 3 7 9 2
quiz:
  question: С чего правильно начать поиск максимума в массиве a?
  options:
    - int max = 0;
    - int max = a[0];
    - int max = a.length;
    - int max = -1;
  correct: 1
  hint: Начальное значение должно быть одним из чисел массива, иначе ответ может оказаться числом, которого в массиве нет.
exam:
  - q: Почему поиск максимума и печать индексов делают двумя отдельными циклами?
    options:
      - Максимум известен только после просмотра всех элементов
      - Так быстрее работает программа
      - Один цикл не может читать массив
      - Так требует компилятор
    correct: 0
    explain: Пока цикл не дошёл до конца, впереди может встретиться число больше. Сравнивать с максимумом можно, только когда он найден окончательно.
    advice: Покажи на примере 3 8 1 8 2, что один проход напечатал бы лишний индекс.
  - q: Что выведет программа для ввода 3 и чисел -7 -2 -9?
    options:
      - "Максимум: 0"
      - "Максимум: -2 и Индексы: 1"
      - "Максимум: -9"
      - Ошибку выхода за границы
    correct: 1
    explain: "Поиск начинается с a[0] = -7, затем -2 больше -7. Ответ: -2 в ячейке с индексом 1."
    advice: Проверь программу на наборе из одних отрицательных чисел.
  - q: С какого индекса можно начинать первый проход, если max = a[0]?
    options:
      - С 1, потому что a[0] уже учтён
      - Только с 0
      - С a.length - 1
      - С 2
    correct: 0
    explain: a[0] уже лежит в max, сравнивать его с самим собой не нужно. Начать с 0 тоже правильно, просто один лишний круг.
    advice: Главное — не пропустить последний элемент, условие остаётся i < n.
memory:
  note: "Момент после первого прохода при вводе 7 и 4 1 9 3 7 9 2: максимум найден, индексы ещё не напечатаны."
  stack:
    - method: main()
      vars:
        - Scanner sc → объект в куче
        - int n = 7
        - int[] a → массив в куче
        - int max = 9
  heap:
    - obj: Scanner
      data: Читает числа из ввода.
    - obj: int[7]
      data: "4, 1, 9, 3, 7, 9, 2"
tests:
  - name: Максимум встречается дважды
    stdin: |
      7
      4 1 9 3 7 9 2
    stdout: |
      Максимум: 9
      Индексы: 2 5
    match: tokens
  - name: Одни отрицательные числа
    stdin: |
      3
      -8 -2 -5
    stdout: |
      Максимум: -2
      Индексы: 1
    match: tokens
  - name: Все числа одинаковые
    stdin: |
      3
      5 5 5
    stdout: |
      Максимум: 5
      Индексы: 0 1 2
    match: tokens
