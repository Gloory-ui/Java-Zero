id: interface-basics
title: "Интерфейс: договор без кода"
hints:
  - "Класс подписывает договор словом `implements`: `class Rect implements Shape`. После этого компилятор потребует оба метода интерфейса."
  - "Реализация — публичный метод с той же сигнатурой: `@Override public double area() { return w * h; }`."
  - "В `main`: `Shape[] shapes = { new Rect(3, 4), new Triangle(3, 4) };`, затем `for (Shape s : shapes)` с печатью и накопителем `total += s.area();`."
quiz:
  question: Что означает запись class Rect implements Shape?
  options:
    - Rect обещает реализовать все методы интерфейса Shape
    - Rect получает поля и код из Shape
    - Rect становится интерфейсом
    - Shape получает методы Rect
  correct: 0
  hint: Интерфейс — договор, implements — подпись под ним.
exam:
  - q: Можно ли написать Shape s = new Shape();?
    options:
      - Нет, объект интерфейса создать нельзя
      - Да, получится пустая фигура
      - Да, если у Shape нет методов
      - Только внутри main
    correct: 0
    explain: У методов интерфейса нет тела, поэтому объект из него не построить. Зато переменная типа Shape может ссылаться на Rect или Triangle.
    advice: "Тип переменной — интерфейс, объект — конкретный класс: Shape s = new Rect(3, 4);"
  - q: Чем интерфейс отличается от абстрактного класса?
    options:
      - Класс может реализовать много интерфейсов, а наследовать только от одного класса
      - Интерфейс хранит обычные поля объекта
      - Методы абстрактного класса нельзя переопределять
      - Ничем, это синонимы
    correct: 0
    explain: extends — только один родитель, implements — сколько угодно интерфейсов. Полей объекта у интерфейса нет, только константы.
    advice: Нужен общий код и поля — абстрактный класс. Нужна только способность что-то делать — интерфейс.
  - q: "Почему цикл for (Shape s : shapes) вызывает разные area()?"
    options:
      - Срабатывает метод из класса объекта — это полиморфизм
      - Java выбирает метод по имени переменной
      - area() вызывается у самого интерфейса Shape
      - Цикл сам подбирает формулу площади
    correct: 0
    explain: У переменной s тип Shape, но объект за ней — Rect или Triangle. Вызывается метод объекта, как при переопределении в наследниках.
    advice: Полиморфизм работает одинаково и с родительскими классами, и с интерфейсами.
memory:
  note: Момент после создания массива фигур.
  stack:
    - method: main(String[] args)
      vars:
        - Shape[] shapes → массив в куче
  heap:
    - obj: Shape[2]
      data: "[0] → Rect, [1] → Triangle"
    - obj: Rect
      data: w = 3.0, h = 4.0
    - obj: Triangle
      data: base = 3.0, height = 4.0
tests:
  - name: Площади фигур
    stdout: |
      Прямоугольник: 12.0
      Треугольник: 6.0
      Сумма площадей: 18.0
  - kind: source
    name: Оба класса реализуют Shape
    pattern: 'implements\s+Shape[\s\S]*implements\s+Shape'
    message: "Добавь implements Shape обоим классам: class Rect implements Shape"
